# Recursive Flint 40B-A2.5B, Unsloth UD-Q4_K_XL GGUF target, with its
# DFlash2 draft; native context. Splash serves Flint text only, from GGUF.
SPLASH_MODEL_REPO="${SPLASH_MODEL_REPO:-unsloth/flint-GGUF:UD-Q4_K_XL}"
SPLASH_MODEL_REVISION="${SPLASH_MODEL_REVISION:-20468edfc38ab43d6914cc88b08cbecb05d0fc62}"
SPLASH_DRAFT_REPO="${SPLASH_DRAFT_REPO:-incoai/Flint-DFlash2}"
SPLASH_DRAFT_REVISION="${SPLASH_DRAFT_REVISION:-39b0a7f7a12a14461b9eac8d90a9fcec24168889}"
SPLASH_MAX_LEN="${SPLASH_MAX_LEN:-262144}"

# Flint decides when to reason; Splash documents no setting that forces it
# on or off.
SPLASH_CAP_REASONING="${SPLASH_CAP_REASONING:-required}"
SPLASH_CAP_TOOLS="${SPLASH_CAP_TOOLS:-required}"
SPLASH_CAP_REASONING_MODE="${SPLASH_CAP_REASONING_MODE:-default}"
SPLASH_CAP_DISABLE_MODE="${SPLASH_CAP_DISABLE_MODE:-none}"
SPLASH_CAP_SYSTEM_PROMPT="${SPLASH_CAP_SYSTEM_PROMPT:-}"
# The model card requires returned reasoning preserved in the history.
SPLASH_PRESERVE_REASONING="${SPLASH_PRESERVE_REASONING:-1}"

# generation_config.json of RecursiveSI/flint at 2a247be.
SPLASH_SAMPLING="${SPLASH_SAMPLING:-temperature=1.0 top_p=0.95 top_k=20}"
