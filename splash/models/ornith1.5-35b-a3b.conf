# Ornith 1.5 35B-A3B, DeepReinforce's MLX 4-bit build: a structural twin of
# Qwen3.6-35B-A3B (qwen3_5_moe, the same quantization layout as the
# mlx-community build), so Splash serves it as that family. There is no
# Ornith 35B DFlash2 draft; the Qwen3.6-35B-A3B one is pinned, trained on
# the base model's weights, so its acceptance on Ornith is a measured value,
# not a given. Native context.
SPLASH_MODEL_REPO="${SPLASH_MODEL_REPO:-ornith-ai/Ornith-1.5-35B-A3B-MLX-4bit}"
SPLASH_MODEL_REVISION="${SPLASH_MODEL_REVISION:-19504d912fa8fc7622bf6b1de3db5d5d890b1f02}"
SPLASH_DRAFT_REPO="${SPLASH_DRAFT_REPO:-incoai/Qwen3.6-35B-A3B-DFlash2}"
SPLASH_DRAFT_REVISION="${SPLASH_DRAFT_REVISION:-51ef7b6923ad6c14cb1bb41c37a9041446496ab6}"
SPLASH_MAX_LEN="${SPLASH_MAX_LEN:-262144}"

# The MLX build ships no processor config (Splash 1.5.0 refuses it with
# vision), so it is installed and served text-only.
SPLASH_LANGUAGE_ONLY="${SPLASH_LANGUAGE_ONLY:-1}"

# Splash reads the thinking switch at the top level of the request.
SPLASH_CAP_REASONING="${SPLASH_CAP_REASONING:-required}"
SPLASH_CAP_TOOLS="${SPLASH_CAP_TOOLS:-required}"
SPLASH_CAP_REASONING_MODE="${SPLASH_CAP_REASONING_MODE:-default}"
SPLASH_CAP_DISABLE_MODE="${SPLASH_CAP_DISABLE_MODE:-reasoning-effort-none}"
SPLASH_CAP_SYSTEM_PROMPT="${SPLASH_CAP_SYSTEM_PROMPT:-}"

# AuditBench and Capability Check samples decode at the checkpoint's sampling, from its
# generation_config.json at the pinned revision.
SPLASH_SAMPLING="${SPLASH_SAMPLING:-temperature=1.0 top_p=0.95 top_k=20}"
