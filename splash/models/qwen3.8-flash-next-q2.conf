# Qwen3.8-Flash-Next (125B-A6B), ISTA-DASLab's GSQ-RCO Q2_0 GGUF target
# (66.4 GB), Splash's suggested Flash-Next build, with its DFlash2 draft;
# native context.
SPLASH_MODEL_REPO="${SPLASH_MODEL_REPO:-ISTA-DASLab/Qwen3.8-Flash-Next-GSQ-RCO-GGUF:Q2_0}"
SPLASH_MODEL_REVISION="${SPLASH_MODEL_REVISION:-ed59f92082b1e93c0e96d60a8b11aab089b52f09}"
SPLASH_DRAFT_REPO="${SPLASH_DRAFT_REPO:-incoai/Qwen3.8-Flash-Next-DFlash2}"
SPLASH_DRAFT_REVISION="${SPLASH_DRAFT_REVISION:-a22a1744e85c17364dcc54a6a420af7135d4c7f6}"
SPLASH_MAX_LEN="${SPLASH_MAX_LEN:-262144}"

# Memory need: the 66.4 GB build with four full-context KV streams (about
# 14 GB of KV at 13.2 KB/token).
SPLASH_MEMORY_GIB="${SPLASH_MEMORY_GIB:-85}"

# Splash reads the thinking switch at the top level of the request.
SPLASH_CAP_REASONING="${SPLASH_CAP_REASONING:-required}"
SPLASH_CAP_TOOLS="${SPLASH_CAP_TOOLS:-required}"
SPLASH_CAP_REASONING_MODE="${SPLASH_CAP_REASONING_MODE:-default}"
SPLASH_CAP_DISABLE_MODE="${SPLASH_CAP_DISABLE_MODE:-reasoning-effort-none}"
SPLASH_CAP_SYSTEM_PROMPT="${SPLASH_CAP_SYSTEM_PROMPT:-}"

# Qwen3.8's template accepts exactly low, medium and xhigh reasoning effort
# with thinking on, and unset means xhigh.
SPLASH_REASONING_EFFORTS="${SPLASH_REASONING_EFFORTS:-low medium xhigh}"

# generation_config.json of Qwen/Qwen3.8-Flash-Next at
# de4b8e4d43b917e7706784d8bb445c9af86a3540.
SPLASH_SAMPLING="${SPLASH_SAMPLING:-temperature=1.0 top_p=0.95 top_k=20}"
