# Qwen3.8-27B MLX 4-bit target, upstream's replacement for the retired Splash
# package, with its DFlash2 draft pinned; native context.
SPLASH_MODEL_REPO="${SPLASH_MODEL_REPO:-mlx-community/Qwen3.8-27B-4bit}"
SPLASH_MODEL_REVISION="${SPLASH_MODEL_REVISION:-10c35caafbb80f7dc6a7a432cdd11af10a6d4818}"
SPLASH_DRAFT_REPO="${SPLASH_DRAFT_REPO:-incoai/Qwen3.8-27B-DFlash2}"
SPLASH_DRAFT_REVISION="${SPLASH_DRAFT_REVISION:-015e795645c74b1a0eeef3b570031fb62e769bc5}"
SPLASH_MAX_LEN="${SPLASH_MAX_LEN:-262144}"

# Splash reads the thinking switch at the top level of the request.
SPLASH_CAP_REASONING="${SPLASH_CAP_REASONING:-required}"
SPLASH_CAP_TOOLS="${SPLASH_CAP_TOOLS:-required}"
SPLASH_CAP_REASONING_MODE="${SPLASH_CAP_REASONING_MODE:-default}"
SPLASH_CAP_DISABLE_MODE="${SPLASH_CAP_DISABLE_MODE:-reasoning-effort-none}"
SPLASH_CAP_SYSTEM_PROMPT="${SPLASH_CAP_SYSTEM_PROMPT:-}"

# Qwen3.8's template accepts exactly low, medium and xhigh reasoning effort
# with thinking on, and unset means xhigh; Splash passes reasoning_effort to
# it (and maps high and max to xhigh). The generated opencode entry offers
# them as variants.
SPLASH_REASONING_EFFORTS="${SPLASH_REASONING_EFFORTS:-low medium xhigh}"

# AuditBench and audit fitness decode at the checkpoint's sampling, from its
# generation_config.json at the pinned revision.
SPLASH_SAMPLING="${SPLASH_SAMPLING:-temperature=1.0 top_p=0.95 top_k=20}"
