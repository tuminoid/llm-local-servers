# Ornith 1.5 122B (Qwen3.5-122B-A10B architecture), DeepReinforce's MLX
# 4-bit build with its vision tower, and its DFlash2 draft; native context.
SPLASH_MODEL_REPO="${SPLASH_MODEL_REPO:-ornith-ai/Ornith-1.5-122B-MLX-4bit}"
SPLASH_MODEL_REVISION="${SPLASH_MODEL_REVISION:-06a57aba4fbae218efc9716bcdf7d6b3035331c8}"
SPLASH_DRAFT_REPO="${SPLASH_DRAFT_REPO:-incoai/Ornith-1.5-122B-DFlash2}"
SPLASH_DRAFT_REVISION="${SPLASH_DRAFT_REVISION:-9baefc1bec85c08193ab442e0ca5f7057669b61d}"
SPLASH_MAX_LEN="${SPLASH_MAX_LEN:-262144}"

# Memory need: the 71 GB build with four full-context KV streams; at
# 100 GiB available memory fell to 12 GiB.
SPLASH_MEMORY_GIB="${SPLASH_MEMORY_GIB:-92}"

# Splash reads the thinking switch at the top level of the request.
SPLASH_CAP_REASONING="${SPLASH_CAP_REASONING:-required}"
SPLASH_CAP_TOOLS="${SPLASH_CAP_TOOLS:-required}"
SPLASH_CAP_REASONING_MODE="${SPLASH_CAP_REASONING_MODE:-default}"
SPLASH_CAP_DISABLE_MODE="${SPLASH_CAP_DISABLE_MODE:-reasoning-effort-none}"
SPLASH_CAP_SYSTEM_PROMPT="${SPLASH_CAP_SYSTEM_PROMPT:-}"

# generation_config.json at the pinned revision.
SPLASH_SAMPLING="${SPLASH_SAMPLING:-temperature=0.6 top_p=0.95 top_k=20}"
