# Thinking Machines Inkling 2 Mini (looped MoE, 26.4B total), Unsloth
# UD-Q4_K_M GGUF with its DFlash2 draft; served at 262,144 of its 1,048,576.
SPLASH_MODEL_REPO="${SPLASH_MODEL_REPO:-unsloth/Inkling-2-Mini-GGUF:UD-Q4_K_M}"
SPLASH_MODEL_REVISION="${SPLASH_MODEL_REVISION:-8078d149286eec7193795413b9e0643da6d11fa1}"
SPLASH_DRAFT_REPO="${SPLASH_DRAFT_REPO:-incoai/Inkling-2-Mini-DFlash2}"
SPLASH_DRAFT_REVISION="${SPLASH_DRAFT_REVISION:-4f9088ea66c21f2b99ed657d1941c306b03e84d2}"
SPLASH_MAX_LEN="${SPLASH_MAX_LEN:-262144}"

# The model decides per turn whether to reason, and the card says minimum
# reasoning effort does not turn it off, so no disable control is declared.
SPLASH_CAP_REASONING="${SPLASH_CAP_REASONING:-required}"
SPLASH_CAP_TOOLS="${SPLASH_CAP_TOOLS:-required}"
SPLASH_CAP_REASONING_MODE="${SPLASH_CAP_REASONING_MODE:-default}"
SPLASH_CAP_DISABLE_MODE="${SPLASH_CAP_DISABLE_MODE:-none}"
SPLASH_CAP_SYSTEM_PROMPT="${SPLASH_CAP_SYSTEM_PROMPT:-}"

# The release's generation_config.json declares temperature only.
SPLASH_SAMPLING="${SPLASH_SAMPLING:-temperature=1.0}"
