# DeepSeek-V4.1-Flash-1017 GSQ-RCO IQ2_XXS (ISTA-DASLab's 2.00 bpw set): all
# 384 routed experts, 138 GB of transformer weights. On an 80 GB card about
# 56% of the experts stay on the GPU and the rest run on the CPU lane from RAM:
# a CPU-lane profile by design, served for interactive use at the operator's
# decision, so strata-bench refuses it and it has no serving rate. The shared
# Engram n-gram table is read one row a token and the DSpark drafter drafts
# the decode.
#
# Capability Check v2 fails audit fitness (workflow no_reasoning 2), the same
# way as the Coder (strata/BENCHMARKS.md).
STRATA_FAMILY="${STRATA_FAMILY:-deepseek41}"
STRATA_SERVED_NAME="${STRATA_SERVED_NAME:-deepseek-v4.1-flash-q2}"
STRATA_MODEL_REPO="${STRATA_MODEL_REPO:-ISTA-DASLab/DeepSeek-V4.1-Flash-1017-GSQ-RCO-GGUF}"
STRATA_MODEL_REVISION="${STRATA_MODEL_REVISION:-cb02422c900df489cea5833e8a92171224059b3c}"
STRATA_SHARDS="${STRATA_SHARDS:-DeepSeek-V4.1-Flash-1017-GSQ-RCO-IQ2_XXS-00001-of-00004.gguf DeepSeek-V4.1-Flash-1017-GSQ-RCO-IQ2_XXS-00002-of-00004.gguf DeepSeek-V4.1-Flash-1017-GSQ-RCO-IQ2_XXS-00003-of-00004.gguf DeepSeek-V4.1-Flash-1017-GSQ-RCO-IQ2_XXS-00004-of-00004.gguf}"
# The Engram table of the same release, and Unsloth's metadata shard, which
# pack_gguf reads the Engram's hash tables from (Strata setup's recipe).
STRATA_ENGRAM="${STRATA_ENGRAM:-ISTA-DASLab/DeepSeek-V4.1-Flash-1017-GSQ-RCO-GGUF@cb02422c900df489cea5833e8a92171224059b3c:DeepSeek-V4.1-Flash-Engram-IQ4_NL.gguf}"
STRATA_ENGRAM_META="${STRATA_ENGRAM_META:-unsloth/DeepSeek-V4.1-Flash-1017-GGUF@8a6ec9cf118e785a362ea94ee123c61c70553be6:UD-Q8_K_XL/DeepSeek-V4.1-Flash-1017-UD-Q8_K_XL-00001-of-00009.gguf}"
STRATA_DRAFTER="${STRATA_DRAFTER:-unsloth/DeepSeek-V4.1-Flash-1017-GGUF@8a6ec9cf118e785a362ea94ee123c61c70553be6:dspark-DeepSeek-V4.1-Flash-1017-Q8_0.gguf}"
STRATA_EXPERT_PROFILE="${STRATA_EXPERT_PROFILE:-profile-2.00.bin}"

# The checkpoint reads 1,048,576 positions. On the A100 the attention cache
# at 1M moves about a hundred experts to the CPU lane against 262K; a
# complete 104-step session ran at it (strata/BENCHMARKS.md).
STRATA_CTX="${STRATA_CTX:-1048576}"
STRATA_PARALLEL="${STRATA_PARALLEL:-1}"

# Strata setup's defaults for the ISTA-DAS sets: DSpark drafts at a 0.65
# confidence floor.
STRATA_ENGINE_ARGS="${STRATA_ENGINE_ARGS:---dspark auto --dspark-conf 0.65}"

# Thinking is on by default (the template's effort high, 75 of 100);
# chat_template_kwargs.enable_thinking=false turns it off. Tool calls stream
# as OpenAI tool_calls.
STRATA_CAP_REASONING="${STRATA_CAP_REASONING:-required}"
STRATA_CAP_TOOLS="${STRATA_CAP_TOOLS:-required}"
STRATA_CAP_REASONING_MODE="${STRATA_CAP_REASONING_MODE:-default}"
STRATA_CAP_DISABLE_MODE="${STRATA_CAP_DISABLE_MODE:-enable-thinking-false}"
STRATA_CAP_SYSTEM_PROMPT="${STRATA_CAP_SYSTEM_PROMPT:-}"

# The model card's recommended sampling (deepseek-ai/DeepSeek-V4.1-Flash-1017
# ships no generation_config.json): temperature 1.0, top_p 1.0.
STRATA_SAMPLING="${STRATA_SAMPLING:-temperature=1.0 top_p=1.0 min_p=0}"
