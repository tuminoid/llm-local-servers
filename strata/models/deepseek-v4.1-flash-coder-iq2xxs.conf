# DeepSeek-V4.1-Flash-1017 GSQ-RCO Coder (ISTA-DASLab): half of the routed
# experts removed (192 of 384 a layer, chosen on code, agentic tool use, long
# context and vision calibration data; no retraining), the rest at the IQ2_XXS
# set's quantization. 72 GB of transformer weights, every routed expert on an
# 80 GB card. The shared Engram n-gram table is read one row a token and the
# DSpark drafter drafts the decode.
#
# Interactive and audit-trial use: Capability Check v2 fails audit fitness
# (workflow no_reasoning 2). The model answers the opening tool call of an
# audit without thinking at its default effort, as the unpruned set does, so
# this is the model's adaptive effort, not the pruning (strata/BENCHMARKS.md).
STRATA_FAMILY="${STRATA_FAMILY:-deepseek41}"
STRATA_SERVED_NAME="${STRATA_SERVED_NAME:-deepseek-v4.1-flash-coder-iq2xxs}"
STRATA_MODEL_REPO="${STRATA_MODEL_REPO:-ISTA-DASLab/DeepSeek-V4.1-Flash-1017-GSQ-RCO-Coder-GGUF}"
STRATA_MODEL_REVISION="${STRATA_MODEL_REVISION:-0b1d5da5734d76375bdad4e72af85a420fde7af7}"
STRATA_SHARDS="${STRATA_SHARDS:-IQ2_XXS/DeepSeek-V4.1-Flash-1017-GSQ-RCO-Coder-IQ2_XXS-00001-of-00006.gguf IQ2_XXS/DeepSeek-V4.1-Flash-1017-GSQ-RCO-Coder-IQ2_XXS-00002-of-00006.gguf IQ2_XXS/DeepSeek-V4.1-Flash-1017-GSQ-RCO-Coder-IQ2_XXS-00003-of-00006.gguf IQ2_XXS/DeepSeek-V4.1-Flash-1017-GSQ-RCO-Coder-IQ2_XXS-00004-of-00006.gguf IQ2_XXS/DeepSeek-V4.1-Flash-1017-GSQ-RCO-Coder-IQ2_XXS-00005-of-00006.gguf}"
# The split's sixth shard is its Engram table: the unpruned release's Engram
# (the same table) is used instead, with the Coder's own metadata shard, as
# Strata setup packs the Coder.
STRATA_ENGRAM="${STRATA_ENGRAM:-ISTA-DASLab/DeepSeek-V4.1-Flash-1017-GSQ-RCO-GGUF@cb02422c900df489cea5833e8a92171224059b3c:DeepSeek-V4.1-Flash-Engram-IQ4_NL.gguf}"
STRATA_ENGRAM_META="${STRATA_ENGRAM_META:-ISTA-DASLab/DeepSeek-V4.1-Flash-1017-GSQ-RCO-Coder-GGUF@0b1d5da5734d76375bdad4e72af85a420fde7af7:IQ2_XXS/DeepSeek-V4.1-Flash-1017-GSQ-RCO-Coder-IQ2_XXS-00001-of-00006.gguf}"
STRATA_DRAFTER="${STRATA_DRAFTER:-unsloth/DeepSeek-V4.1-Flash-1017-GGUF@8a6ec9cf118e785a362ea94ee123c61c70553be6:dspark-DeepSeek-V4.1-Flash-1017-Q8_0.gguf}"
STRATA_EXPERT_PROFILE="${STRATA_EXPERT_PROFILE:-profile-coder.bin}"

# The checkpoint reads 1,048,576 positions. On the A100 the attention cache
# takes about 1 GB at 1M and every expert stays on the card; a complete
# 104-step session ran at it (strata/BENCHMARKS.md).
STRATA_CTX="${STRATA_CTX:-1048576}"
STRATA_PARALLEL="${STRATA_PARALLEL:-1}"

# Strata setup's defaults for the ISTA-DAS sets: DSpark drafts at a 0.65
# confidence floor.
STRATA_ENGINE_ARGS="${STRATA_ENGINE_ARGS:---dspark auto --dspark-conf 0.65}"

# Thinking is on by default (the template's effort high, 75 of 100);
# chat_template_kwargs.enable_thinking=false turns it off. Tool calls stream
# as OpenAI tool_calls.
STRATA_CAP_REASONING="${STRATA_CAP_REASONING:-required}"
STRATA_CAP_TOOLS="${STRATA_CAP_TOOLS:-required}"
STRATA_CAP_REASONING_MODE="${STRATA_CAP_REASONING_MODE:-default}"
STRATA_CAP_DISABLE_MODE="${STRATA_CAP_DISABLE_MODE:-enable-thinking-false}"
STRATA_CAP_SYSTEM_PROMPT="${STRATA_CAP_SYSTEM_PROMPT:-}"

# The model card's recommended sampling (deepseek-ai/DeepSeek-V4.1-Flash-1017
# ships no generation_config.json): temperature 1.0, top_p 1.0.
STRATA_SAMPLING="${STRATA_SAMPLING:-temperature=1.0 top_p=1.0 min_p=0}"
