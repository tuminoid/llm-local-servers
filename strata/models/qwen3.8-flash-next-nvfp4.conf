# Qwen3.8-Flash-Next (125B-A6B) with NVFP4 routed experts: Strata's
# ready-made pack of a GPTQ quantization of Qwen's BF16 experts (group 16,
# E4M3 scales), with the FP8 n-gram (PLE) table and the BF16 token embedding
# beside it. NVIDIA cards only: Blackwell multiplies on its FP4 tensor cores,
# older cards (sm_75 and up) at 8-bit precision (W4A8, int8 MMQ). Served
# over the faster GSQ-RCO Q2_0 pack for quality, an operator decision: on
# Strata's own scoring Q2_0 keeps 80.6% of Q8_0's top tokens (mean KL 0.315)
# against 91.8-92.1% (0.069) for this pack (strata/BENCHMARKS.md).
STRATA_SERVED_NAME="${STRATA_SERVED_NAME:-qwen3.8-flash-next-nvfp4}"
STRATA_MODEL_REPO="${STRATA_MODEL_REPO:-Maximilian228/Qwen3.8-Flash-Next-NVFP4-GPTQ-Strata}"
STRATA_MODEL_REVISION="${STRATA_MODEL_REVISION:-640a1db97446ddd5e89d2b70ecd0297987192c93}"
STRATA_PACK="${STRATA_PACK:-pack}"
STRATA_DENSE_GGUF="${STRATA_DENSE_GGUF:-qwen-nvfp4-gptq-dense.gguf}"
STRATA_PLE_GGUF="${STRATA_PLE_GGUF:-ple-fp8.gguf}"
STRATA_EMBD_GGUF="${STRATA_EMBD_GGUF:-token-embd-bf16.gguf}"

# The checkpoint's native length.
STRATA_CTX="${STRATA_CTX:-262144}"

# One slot. The engine reads one admission's prompt at a time while the
# other slots decode between its chunks, so on deep agent sessions every
# stream count above one measured slower (strata/BENCHMARKS.md).
STRATA_PARALLEL="${STRATA_PARALLEL:-1}"

# Strata setup's defaults for the pack: MTP drafts four deep, 8-bit KV, the
# expert cache and prompt chunk sized by the engine.
STRATA_ENGINE_ARGS="${STRATA_ENGINE_ARGS:---spec 4 --spec-min-p 0.5 --kv int8 --expert-cache auto --prefill auto}"

# Thinking is on by default; chat_template_kwargs.enable_thinking=false
# turns it off. Tool calls stream as OpenAI tool_calls.
STRATA_CAP_REASONING="${STRATA_CAP_REASONING:-required}"
STRATA_CAP_TOOLS="${STRATA_CAP_TOOLS:-required}"
STRATA_CAP_REASONING_MODE="${STRATA_CAP_REASONING_MODE:-default}"
STRATA_CAP_DISABLE_MODE="${STRATA_CAP_DISABLE_MODE:-enable-thinking-false}"
STRATA_CAP_SYSTEM_PROMPT="${STRATA_CAP_SYSTEM_PROMPT:-}"

# generation_config.json of Qwen/Qwen3.8-Flash-Next at
# de4b8e4d43b917e7706784d8bb445c9af86a3540.
STRATA_SAMPLING="${STRATA_SAMPLING:-temperature=1.0 top_p=0.95 top_k=20}"
