# Thinking Machines Inkling 2 Mini (looped MoE, 26.4B total) on Strata's
# Inkling engine: Unsloth's UD-Q4_K_M GGUF at the commit Strata's catalog
# pins, with the original checkpoint's DSpark drafter (mtp.safetensors),
# whose tokenizer and chat template the pull converts for the server.
STRATA_FAMILY="${STRATA_FAMILY:-inkling}"
STRATA_SERVED_NAME="${STRATA_SERVED_NAME:-inkling-2-mini}"
STRATA_MODEL_REPO="${STRATA_MODEL_REPO:-unsloth/Inkling-2-Mini-GGUF}"
STRATA_MODEL_REVISION="${STRATA_MODEL_REVISION:-800c946d7b9c830c86290df49afbbe91db8455f5}"
STRATA_GGUF="${STRATA_GGUF:-Inkling-2-Mini-UD-Q4_K_M.gguf}"
STRATA_DRAFTER="${STRATA_DRAFTER:-thinkingmachines/Inkling-2-Mini@1fb4134b9a74f9681054f4ef82e4bf1f458a2337:mtp.safetensors}"
# Served at 262,144 of its 1,048,576, as the fleet's other deep profiles.
STRATA_CTX="${STRATA_CTX:-262144}"
# Four slots; the engine batches them, and its drafter serves the first.
STRATA_PARALLEL="${STRATA_PARALLEL:-4}"
STRATA_ENGINE_ARGS="${STRATA_ENGINE_ARGS:-}"
# The model decides per turn whether to reason, and the card says minimum
# reasoning effort does not turn it off, so no disable control is declared.
STRATA_CAP_REASONING="${STRATA_CAP_REASONING:-required}"
STRATA_CAP_TOOLS="${STRATA_CAP_TOOLS:-required}"
STRATA_CAP_REASONING_MODE="${STRATA_CAP_REASONING_MODE:-default}"
STRATA_CAP_DISABLE_MODE="${STRATA_CAP_DISABLE_MODE:-none}"
STRATA_CAP_SYSTEM_PROMPT="${STRATA_CAP_SYSTEM_PROMPT:-}"
# The release's generation_config.json declares temperature only.
STRATA_SAMPLING="${STRATA_SAMPLING:-temperature=1.0}"
