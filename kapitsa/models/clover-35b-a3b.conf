# DiffuSpace's Clover-35B-A3B-Preview, Qwen3.6-35B-A3B tuned into a
# block-diffusion MoE, converted from its BF16 checkpoint to Kapitsa's 4-bit
# pack (the 35B's recipe: router and shared-expert gate 8-bit) by the
# release's own converter.
KAPITSA_SERVED_NAME="${KAPITSA_SERVED_NAME:-clover-35b-a3b}"
KAPITSA_MODEL_REPO="${KAPITSA_MODEL_REPO:-Diffuspace/Clover-35B-A3B-Preview}"
KAPITSA_MODEL_REVISION="${KAPITSA_MODEL_REVISION:-4b0402b65e523d0183a14c431955438714cb16ff}"
KAPITSA_CONVERTER="${KAPITSA_CONVERTER:-convert_clover.py}"

# The card states 131,072 positions; its RoPE is the base's (theta 1e7,
# partial 0.25), native to 262,144, so the pack is served through a view
# whose config.json states that. Kapitsa clamps --context to the field.
KAPITSA_MAX_POSITIONS="${KAPITSA_MAX_POSITIONS:-262144}"
KAPITSA_CTX="${KAPITSA_CTX:-262144}"

# Decode self-speculatively: a denoising pass of the model drafts, a causal
# pass checks, with threshold acceptance and the checkpoint's own controls
# (presence and repetition penalties, the end-of-reply and </think> ramps).
# The 35B's DFlash2 drafter is not the model's weights, and with it Kapitsa
# drops the </think> ramp: audit fitness 8 of 12, three workflow runaways.
# NI_CLOVER_ACCEPT=exact loses the triage answers' brackets (8 of 12).
KAPITSA_ENGINE_ENV="${KAPITSA_ENGINE_ENV:-NI_CLOVER_DECODE=spec}"

# The checkpoint's end-of-reply ramp (dllm_length_penalty 10 from 8,192 over
# 8,192 tokens, reasoning counted) ends a reply at about 16K with its
# thinking open: deep audit calls that think past it never write their
# tool call. With it off, the </think> ramp at the checkpoint's 10 (one row
# per draft cycle) lets some replies circle in their thinking to the
# client's 65,536-token limit; at 20 thinking closes, and a real audit ran
# about 300 replies with none cut off or running away (longest 8.2K).
KAPITSA_GENERATION="${KAPITSA_GENERATION:-dllm_length_penalty=0 dllm_think_end_bias=20}"

KAPITSA_CAP_REASONING="${KAPITSA_CAP_REASONING:-required}"
KAPITSA_CAP_TOOLS="${KAPITSA_CAP_TOOLS:-required}"
KAPITSA_CAP_REASONING_MODE="${KAPITSA_CAP_REASONING_MODE:-default}"
KAPITSA_CAP_DISABLE_MODE="${KAPITSA_CAP_DISABLE_MODE:-enable-thinking-false}"
KAPITSA_CAP_SYSTEM_PROMPT="${KAPITSA_CAP_SYSTEM_PROMPT:-}"

# generation_config.json at the pinned revision: do_sample false, presence
# 0.9, repetition 1.05.
KAPITSA_SAMPLING="${KAPITSA_SAMPLING:-temperature=0.0 top_p=1.0 presence_penalty=0.9 repetition_penalty=1.05}"
