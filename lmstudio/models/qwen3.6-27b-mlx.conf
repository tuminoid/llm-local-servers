# LM Studio model config for Qwen3.6-27B, MLX 4-bit (Darwin/arm64 only).
#
# MLX takes LM Studio's MLX runtime, which exists only on Apple Silicon -- the
# same platform constraint vllm-metal/ lives under. pull.sh and start.sh refuse
# this config on any non-Darwin/arm64 host rather than silently loading a GGUF
# fallback. The GGUF sibling (qwen3.6-27b-gguf.conf) is the portable profile.
#
# The same repo key resolves both formats; the --mlx filter on `lms get`
# fetches the MLX 4-bit variant and `lms load` selects it by the resolved
# MLX model key. This mirrors the vLLM-Metal MLX 4-bit operating point so LM
# Studio's MLX path is measured against the plugin's on the same host.
#
# Accepted deviation (lmstudio/AGENTS.md): the pin is the repo path plus the
# quant tag, not a served content digest.
#
# BLOCKED -- upstream MLX usage-accounting defect (diagnose-only, per
# ../AGENTS.md "Diagnose upstream bugs, do not report them"):
# On a 64 GiB MacBook Pro, LM Studio's MLX runtime reports completion_tokens
# exactly one less than it actually generates. Measured against a resident
# qwen3.6-27b MLX 4bit load (LM Studio CLI build reports no semver):
#   max_tokens=1  -> completion_tokens=0  (finish_reason "length", empty text)
#   max_tokens=2  -> 1;  =3 -> 2;  =5 -> 4;  =50 -> 49 (all finish "length")
# so the accounting is off by one at every length. AuditBench's warmup sends
# max_tokens=1 and requires completion_tokens==1 (backends must honor
# max_tokens exactly), so the run aborts at warmup:
#   "warmup did not return exactly one output token; endpoint reported 0".
# This is an LM Studio MLX-runtime bug, not an adapter or config bug: the
# lifecycle, identity check (format safetensors, arch qwen3_5, quant 4bit),
# 208384 context load, and a real /v1/chat/completions reply all pass; only
# the token accounting is wrong. Every throughput number would be off by one
# output token per request even if the warmup gate were relaxed, so no
# canonical MLX serving rate can be captured through LM Studio until this is
# fixed. The GGUF path (llama.cpp runtime) is unaffected.
# RETEST CONDITION: re-run `make lmstudio-bench MODEL=qwen3.6-27b-mlx` after
# an LM Studio update; the block clears when max_tokens=1 yields
# completion_tokens=1 (probe: POST /v1/chat/completions with max_tokens=1,
# ignore_eos=true, and read usage.completion_tokens). Compare against the
# vLLM-Metal MLX operating point only once a clean AuditBench run exists.
#
# ALSO BLOCKED -- Capability Check v1 cannot pass through LM Studio's MLX
# endpoint (diagnose-only). model_identity passes (format safetensors, arch
# qwen3_5, quant 4bit, matched), but two Capability-v1/LM-Studio API-contract
# mismatches fail the rest, both verified directly against the live endpoint:
#   - Reasoning channel: LM Studio emits reasoning ONLY in the message's
#     `reasoning_content` field, never the `reasoning` field Capability-v1
#     treats as the pass channel, so streaming_reasoning, structured_json and
#     thinking_disabled fail with "reasoning arrived in legacy
#     reasoning_content". (LM Studio uses the same reasoning_content field as
#     vLLM/DeepSeek.)
#   - tool_choice form: LM Studio accepts only string tool_choice
#     (none/auto/required) and DOES return tool_calls for "required", but
#     Capability-v1's OpenAIChatAdapter sends the object form
#     {"type":"function",...}, which LM Studio rejects with HTTP 400
#     "Invalid tool_choice type: 'object'", failing tool_call (and skipping
#     tool_round_trip).
# These are harness-vs-LM-Studio contract gaps, not adapter/config bugs, and
# the workload/gate logic lives only in llm-audit-bench (never forked here),
# so resolving them is a harness-protocol decision. RETEST CONDITION: re-run
# `make lmstudio-capability MODEL=qwen3.6-27b-mlx` after a Capability-v1
# amendment that accepts reasoning_content and/or emits string tool_choice,
# or after LM Studio adds the `reasoning` field and object tool_choice.

# Download spec for `lms get`: the @4bit suffix is a get-time format filter
# that fetches the MLX 4-bit build. It is NOT a loadable key (see below).
LMSTUDIO_GET_SPEC="${LMSTUDIO_GET_SPEC:-qwen/qwen3.6-27b@4bit}"
# Key `lms load` accepts: the bare repo key only. The @quant suffix, the
# store path, and the indexedModelIdentifier are all rejected by `lms load`
# ("Model not found") -- verified on Apple Silicon. Both the MLX and GGUF
# builds share this one key, so `lms load` disambiguates by device: with
# --yes (which start.sh always passes) it resolves to the preferred/local
# device's artifact, and the post-load identity check aborts on a wrong
# pick. On this MacBook the MLX build is the local artifact and the GGUF is
# a remote LM Link peer, so --yes resolves to MLX. If a host has both builds
# local, set LMSTUDIO_SERVED_NAME/identity to force the intended one or pull
# only the MLX build there.
LMSTUDIO_MODEL_KEY="${LMSTUDIO_MODEL_KEY:-qwen/qwen3.6-27b}"
LMSTUDIO_SERVED_NAME="${LMSTUDIO_SERVED_NAME:-qwen3.6-27b-mlx}"

# MLX artifacts report their on-disk container as "safetensors" in lms
# ls/ps, not "mlx"; the bench adapter maps LMSTUDIO_FORMAT=mlx onto that
# reported format (see lmstudio/bench.py _format_matches). LMSTUDIO_FORMAT
# still selects the `lms get --mlx` filter in pull.sh.
LMSTUDIO_FORMAT="${LMSTUDIO_FORMAT:-mlx}"
LMSTUDIO_EXPECTED_QUANTIZATION="${LMSTUDIO_EXPECTED_QUANTIZATION:-4bit}"
# The MLX/safetensors build reports the transformers architecture family id
# qwen3_5 (confirmed via `lms ls --json` on Apple Silicon: the qwen3.6 MLX
# 4bit artifact reports architecture "qwen3_5", the same family the 3.5 MLX
# build reports), not the llama.cpp id the GGUF build reports (qwen35).
LMSTUDIO_EXPECTED_ARCHITECTURE="${LMSTUDIO_EXPECTED_ARCHITECTURE:-qwen3_5}"

# Served context window, not the native maximum. The native max is 262144
# (LMSTUDIO_EXPECTED shows maxContextLength 262144), but LM Studio's MLX
# runtime ignores `lms load --context-length` and caps this build's loaded
# window at 208384 on a 64 GiB MacBook Pro (measured: requesting 40000,
# 131072, or 262144 all load 208384). AuditBench targets fractions of the
# configured context (audit_half 15/16, audit_deep 7/8), so the configured
# value must not exceed the served window or the deep phases overflow it;
# bench.py aborts if it does. 208384 keeps audit_deep (182336) and
# audit_half (195360) inside the real window while staying above the 131072
# floor. Reconfirm the cap per host: a machine with more unified memory may
# load a larger window, in which case raise this toward 262144.
LMSTUDIO_CONTEXT_LENGTH="${LMSTUDIO_CONTEXT_LENGTH:-208384}"

LMSTUDIO_MIN_VERSION="${LMSTUDIO_MIN_VERSION:-0.4.0}"

LMSTUDIO_CAP_REASONING="${LMSTUDIO_CAP_REASONING:-required}"
LMSTUDIO_CAP_TOOLS="${LMSTUDIO_CAP_TOOLS:-required}"
LMSTUDIO_CAP_REASONING_MODE="${LMSTUDIO_CAP_REASONING_MODE:-default}"
# Thinking disable control. The ONLY control that disables reasoning on this
# MLX build is the top-level reasoning_effort=none parameter (verified on the
# 64 GiB MacBook Pro against the qwen3.8 MLX sibling on the same runtime: unary
# and streaming both return reasoning_tokens=0 and empty reasoning_content). The
# Capability-v1 harness's openai_control() offers no reasoning_effort disable
# mode; its two disable controls are both silently ignored by this MLX runtime
# -- enable-thinking-false (chat_template_kwargs.enable_thinking=false) and
# no-think-prefix (/no_think) each still return ~30 reasoning tokens, identical
# to the baseline. So the gate has no working disable control here; setting it
# to "none" (send no control) is the honest value rather than asserting a
# disable the backend does not honor. The working disable is wired on the bench
# path below (reasoning_effort=none), passed through as the top-level parameter.
LMSTUDIO_CAP_DISABLE_MODE="${LMSTUDIO_CAP_DISABLE_MODE:-none}"
LMSTUDIO_CAP_SYSTEM_PROMPT="${LMSTUDIO_CAP_SYSTEM_PROMPT:-}"

# AuditBench v1 decode-compliance controls, sent by the bench adapters and
# recorded in the run's settings; env wins over file, and the AUDIT_BENCH_*
# harness names work too. Default "none": on this MLX build reasoning_effort=none
# is the one control that actually disables thinking (verified: reasoning_tokens
# drops to 0 on both unary and streaming /v1/chat/completions), so the budget
# goes to visible content and the token-accounting probe can see it. The other
# Qwen disable idioms (enable_thinking=false, /no_think) are ignored by this
# runtime. A model that does not accept "none" keeps thinking and the probe
# fails closed; set a supported value, or empty to send nothing.
LMSTUDIO_BENCH_REASONING_EFFORT="${LMSTUDIO_BENCH_REASONING_EFFORT:-none}"
LMSTUDIO_BENCH_SYSTEM_PROMPT="${LMSTUDIO_BENCH_SYSTEM_PROMPT:-}"
