# LM Studio model config for Qwen3.6-27B, MLX 4-bit (Darwin/arm64 only).
#
# MLX takes LM Studio's MLX runtime, which exists only on Apple Silicon -- the
# same platform constraint vllm-metal/ lives under. pull.sh and start.sh refuse
# this config on any non-Darwin/arm64 host rather than silently loading a GGUF
# fallback. The GGUF sibling (qwen3.6-27b-gguf.conf) is the portable profile.
#
# The same repo key resolves both formats; the --mlx filter on `lms get`
# fetches the MLX 4-bit variant and `lms load` selects it by the resolved
# MLX model key. This mirrors the vLLM-Metal MLX 4-bit operating point so LM
# Studio's MLX path is measured against the plugin's on the same host.
#
# Accepted deviation (lmstudio/AGENTS.md): the pin is the repo path plus the
# quant tag, not a served content digest.

# Download spec for `lms get`: the @4bit suffix is a get-time format filter
# that fetches the MLX 4-bit build. It is NOT a loadable key (see below).
LMSTUDIO_GET_SPEC="${LMSTUDIO_GET_SPEC:-qwen/qwen3.6-27b@4bit}"
# Key `lms load` accepts: the bare repo key only. The @quant suffix, the
# store path, and the indexedModelIdentifier are all rejected by `lms load`
# ("Model not found") -- verified on Apple Silicon. Both the MLX and GGUF
# builds share this one key, so `lms load` disambiguates by device: with
# --yes (which start.sh always passes) it resolves to the preferred/local
# device's artifact, and the post-load identity check aborts on a wrong
# pick. On this MacBook the MLX build is the local artifact and the GGUF is
# a remote LM Link peer, so --yes resolves to MLX. If a host has both builds
# local, set LMSTUDIO_SERVED_NAME/identity to force the intended one or pull
# only the MLX build there.
LMSTUDIO_MODEL_KEY="${LMSTUDIO_MODEL_KEY:-qwen/qwen3.6-27b}"
LMSTUDIO_SERVED_NAME="${LMSTUDIO_SERVED_NAME:-qwen3.6-27b-mlx}"

# MLX artifacts report their on-disk container as "safetensors" in lms
# ls/ps, not "mlx"; the bench adapter maps LMSTUDIO_FORMAT=mlx onto that
# reported format (see lmstudio/bench.py _format_matches). LMSTUDIO_FORMAT
# still selects the `lms get --mlx` filter in pull.sh.
LMSTUDIO_FORMAT="${LMSTUDIO_FORMAT:-mlx}"
LMSTUDIO_EXPECTED_QUANTIZATION="${LMSTUDIO_EXPECTED_QUANTIZATION:-4bit}"
# The MLX/safetensors build reports the transformers architecture family id
# qwen3_5 (confirmed via `lms ls --json` on Apple Silicon: the qwen3.6 MLX
# 4bit artifact reports architecture "qwen3_5", the same family the 3.5 MLX
# build reports), not the llama.cpp id the GGUF build reports (qwen35).
LMSTUDIO_EXPECTED_ARCHITECTURE="${LMSTUDIO_EXPECTED_ARCHITECTURE:-qwen3_5}"

# Served context window, not the native maximum. The native max is 262144
# (LMSTUDIO_EXPECTED shows maxContextLength 262144), but LM Studio's MLX
# runtime ignores `lms load --context-length` and caps this build's loaded
# window at 208384 on a 64 GiB MacBook Pro (measured: requesting 40000,
# 131072, or 262144 all load 208384). AuditBench targets fractions of the
# configured context (audit_half 15/16, audit_deep 7/8), so the configured
# value must not exceed the served window or the deep phases overflow it;
# bench.py aborts if it does. 208384 keeps audit_deep (182336) and
# audit_half (195360) inside the real window while staying above the 131072
# floor. Reconfirm the cap per host: a machine with more unified memory may
# load a larger window, in which case raise this toward 262144.
LMSTUDIO_CONTEXT_LENGTH="${LMSTUDIO_CONTEXT_LENGTH:-208384}"

LMSTUDIO_MIN_VERSION="${LMSTUDIO_MIN_VERSION:-0.4.0}"

LMSTUDIO_CAP_REASONING="${LMSTUDIO_CAP_REASONING:-required}"
LMSTUDIO_CAP_TOOLS="${LMSTUDIO_CAP_TOOLS:-required}"
LMSTUDIO_CAP_REASONING_MODE="${LMSTUDIO_CAP_REASONING_MODE:-default}"
LMSTUDIO_CAP_DISABLE_MODE="${LMSTUDIO_CAP_DISABLE_MODE:-enable-thinking-false}"
LMSTUDIO_CAP_SYSTEM_PROMPT="${LMSTUDIO_CAP_SYSTEM_PROMPT:-}"
