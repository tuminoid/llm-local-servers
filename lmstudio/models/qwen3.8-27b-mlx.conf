# LM Studio model config for Qwen3.8-27B, MLX 4-bit (Darwin/arm64 only).
#
# MLX takes LM Studio's MLX runtime, which exists only on Apple Silicon -- the
# same platform constraint vllm-metal/ lives under. pull.sh and start.sh refuse
# this config on any non-Darwin/arm64 host rather than silently loading a GGUF
# fallback. This mirrors the vLLM-Metal MLX 4-bit operating point
# (vllm-metal/models/qwen3.8-27b-4bit.conf) so LM Studio's MLX path is measured
# against the plugin's on the same host.
#
# Accepted deviation (lmstudio/AGENTS.md): the pin is the repo path plus the
# quant tag, not a served content digest.
#
# BLOCKED -- upstream MLX usage-accounting defect (diagnose-only, per
# ../AGENTS.md "Diagnose upstream bugs, do not report them"):
# LM Studio's MLX runtime reports completion_tokens exactly one less than it
# actually generates (verified on a 64 GiB MacBook Pro against the sibling
# qwen3.6-27b MLX 4bit: max_tokens=1 -> 0, 2 -> 1, 5 -> 4, 50 -> 49, all
# finish_reason "length"). This is the same MLX runtime, so it applies here
# identically. AuditBench's warmup sends max_tokens=1 and requires
# completion_tokens==1, so the run aborts at warmup ("warmup did not return
# exactly one output token; endpoint reported 0"), and every throughput number
# would be off by one output token per request even if the gate were relaxed.
# No canonical MLX serving rate can be captured through LM Studio until this is
# fixed; the GGUF path (llama.cpp runtime) is unaffected.
# RETEST CONDITION: re-run `make lmstudio-bench MODEL=qwen3.8-27b-mlx` after an
# LM Studio update; the block clears when max_tokens=1 yields
# completion_tokens=1 (probe: POST /v1/chat/completions with max_tokens=1,
# ignore_eos=true, and read usage.completion_tokens).
#
# ALSO BLOCKED -- Capability Check v1 cannot pass through LM Studio's MLX
# endpoint (diagnose-only), for the same two harness-vs-LM-Studio API-contract
# mismatches verified against the sibling MLX build:
#   - Reasoning channel: LM Studio emits reasoning ONLY in the message's
#     `reasoning_content` field, never the `reasoning` field Capability-v1
#     treats as the pass channel ("reasoning arrived in legacy
#     reasoning_content").
#   - tool_choice form: LM Studio accepts only string tool_choice
#     (none/auto/required) and DOES return tool_calls for "required", but
#     Capability-v1's OpenAIChatAdapter sends the object form
#     {"type":"function",...}, which LM Studio rejects with HTTP 400.
# The workload/gate logic lives only in llm-audit-bench (never forked here), so
# resolving them is a harness-protocol decision. RETEST CONDITION: re-run
# `make lmstudio-capability MODEL=qwen3.8-27b-mlx` after a Capability-v1
# amendment that accepts reasoning_content and/or emits string tool_choice, or
# after LM Studio adds the `reasoning` field and object tool_choice.

# Download spec for `lms get`: the @4bit suffix is a get-time format filter
# that fetches the MLX 4-bit build. It is NOT a loadable key (see below).
LMSTUDIO_GET_SPEC="${LMSTUDIO_GET_SPEC:-qwen/qwen3.8-27b@4bit}"
# Key `lms load` accepts: the bare repo key only. The @quant suffix, the store
# path, and the indexedModelIdentifier are all rejected by `lms load`
# ("Model not found"). On this host the key resolves TWO local MLX variants,
# @4bit and @8bit (confirmed via `lms ls --json`: both safetensors, both
# local -- no GGUF sibling resident), so `lms load --yes` (which start.sh
# always passes) picks one by preference/order and the post-load identity
# check below (quant 4bit) aborts a wrong pick of the 8bit build. Pull only
# the 4bit build on a host where the ordering is unreliable.
LMSTUDIO_MODEL_KEY="${LMSTUDIO_MODEL_KEY:-qwen/qwen3.8-27b}"
LMSTUDIO_SERVED_NAME="${LMSTUDIO_SERVED_NAME:-qwen3.8-27b-mlx}"

# MLX artifacts report their on-disk container as "safetensors" in lms ls/ps,
# not "mlx"; the bench adapter maps LMSTUDIO_FORMAT=mlx onto that reported
# format (see lmstudio/bench.py _format_matches). LMSTUDIO_FORMAT still selects
# the `lms get --mlx` filter in pull.sh.
LMSTUDIO_FORMAT="${LMSTUDIO_FORMAT:-mlx}"
LMSTUDIO_EXPECTED_QUANTIZATION="${LMSTUDIO_EXPECTED_QUANTIZATION:-4bit}"
# The MLX/safetensors build reports the transformers architecture family id
# qwen3_5 (confirmed via `lms ls --json` on Apple Silicon: the qwen3.8-27b MLX
# 4bit artifact reports architecture "qwen3_5"), not the llama.cpp id a GGUF
# build would report (qwen35).
LMSTUDIO_EXPECTED_ARCHITECTURE="${LMSTUDIO_EXPECTED_ARCHITECTURE:-qwen3_5}"

# Served context window, not the native maximum. The native max is 262144
# (maxContextLength 262144), but LM Studio's MLX runtime ignores
# `lms load --context-length` and caps this build's loaded window at 208384 on
# a 64 GiB MacBook Pro (measured: loading qwen3.8-27b 4bit reports
# contextLength 208384, the same host ceiling the qwen3.6 MLX build hits, so
# it is a unified-memory cap, not model-specific). AuditBench targets fractions
# of the configured context (audit_half 15/16, audit_deep 7/8), so the
# configured value must not exceed the served window or the deep phases
# overflow it; bench.py aborts if it does. 208384 keeps audit_deep (182336) and
# audit_half (195360) inside the real window while staying above the 131072
# floor. Reconfirm the cap per host: a machine with more unified memory may
# load a larger window, in which case raise this toward 262144.
LMSTUDIO_CONTEXT_LENGTH="${LMSTUDIO_CONTEXT_LENGTH:-208384}"

LMSTUDIO_MIN_VERSION="${LMSTUDIO_MIN_VERSION:-0.4.0}"

LMSTUDIO_CAP_REASONING="${LMSTUDIO_CAP_REASONING:-required}"
LMSTUDIO_CAP_TOOLS="${LMSTUDIO_CAP_TOOLS:-required}"
LMSTUDIO_CAP_REASONING_MODE="${LMSTUDIO_CAP_REASONING_MODE:-default}"
LMSTUDIO_CAP_DISABLE_MODE="${LMSTUDIO_CAP_DISABLE_MODE:-enable-thinking-false}"
LMSTUDIO_CAP_SYSTEM_PROMPT="${LMSTUDIO_CAP_SYSTEM_PROMPT:-}"

# AuditBench v1 decode-compliance controls, sent by the bench adapters and
# recorded in the run's settings; env wins over file, and the AUDIT_BENCH_*
# harness names work too. Default "none": these Qwen models reason by default,
# and LM Studio honours reasoning_effort on /v1/chat/completions, so the budget
# goes to visible content and the token-accounting probe can see it. A model
# that does not accept the value keeps thinking and the probe fails closed; set
# a supported value, or empty to send nothing.
LMSTUDIO_BENCH_REASONING_EFFORT="${LMSTUDIO_BENCH_REASONING_EFFORT:-none}"
LMSTUDIO_BENCH_SYSTEM_PROMPT="${LMSTUDIO_BENCH_SYSTEM_PROMPT:-}"
