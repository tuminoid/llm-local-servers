# Qwen3.8-27B MLX 4-bit on LM Studio's MLX engine: the checkpoint and revision
# vllm-metal/ serves, for Apple Silicon without the Splash engine (M1/M2).
LMSTUDIO_FORMAT="${LMSTUDIO_FORMAT:-mlx}"
LMSTUDIO_MODEL_REPO="${LMSTUDIO_MODEL_REPO:-mlx-community/Qwen3.8-27B-4bit}"
LMSTUDIO_MODEL_REVISION="${LMSTUDIO_MODEL_REVISION:-10c35caafbb80f7dc6a7a432cdd11af10a6d4818}"
LMSTUDIO_CONTEXT="${LMSTUDIO_CONTEXT:-262144}"
LMSTUDIO_EXPECTED_ARCHITECTURE="${LMSTUDIO_EXPECTED_ARCHITECTURE:-qwen3_5}"
LMSTUDIO_EXPECTED_QUANTIZATION="${LMSTUDIO_EXPECTED_QUANTIZATION:-4bit}"
# mlx-llm 1.11.0 reports completion_tokens one low on length-capped responses
# (max_tokens 1 -> 0, 50 -> 49, finish_reason length) at LM Studio 0.4.25.
# Retest: max_tokens=1 returning completion_tokens=1 clears this.
LMSTUDIO_BENCH_TOLERATE_OFF_BY_ONE="${LMSTUDIO_BENCH_TOLERATE_OFF_BY_ONE:-1}"

# Reasoning arrives in reasoning_content. Neither reasoning_effort=none nor
# enable_thinking=false disables it on this engine, so no disable mode.
LMSTUDIO_CAP_REASONING="${LMSTUDIO_CAP_REASONING:-required}"
LMSTUDIO_CAP_TOOLS="${LMSTUDIO_CAP_TOOLS:-required}"
LMSTUDIO_CAP_REASONING_MODE="${LMSTUDIO_CAP_REASONING_MODE:-default}"
LMSTUDIO_CAP_DISABLE_MODE="${LMSTUDIO_CAP_DISABLE_MODE:-none}"
LMSTUDIO_CAP_SYSTEM_PROMPT="${LMSTUDIO_CAP_SYSTEM_PROMPT:-}"

# AuditBench and audit fitness decode at the checkpoint's sampling, from
# generation_config.json at the pinned revision.
LMSTUDIO_SAMPLING="${LMSTUDIO_SAMPLING:-temperature=1.0 top_p=0.95 top_k=20}"
