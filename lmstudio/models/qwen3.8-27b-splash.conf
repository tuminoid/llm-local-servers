# Qwen3.8-27B Splash package (Q4 dense target and bundled DFlash 2 draft) on
# LM Studio's Splash engine, which is Splash 1.0.2 (source e8fffde2). The same
# package and revision as the native splash/ profile. Apple GPU family 9 or
# newer (M3+) and macOS 26.4+; the fastest LM Studio engine on those hosts.
LMSTUDIO_FORMAT="${LMSTUDIO_FORMAT:-splash}"
LMSTUDIO_MODEL_REPO="${LMSTUDIO_MODEL_REPO:-incoai/Qwen3.8-27B-Splash}"
LMSTUDIO_MODEL_REVISION="${LMSTUDIO_MODEL_REVISION:-9d27070b71f7142c6b6025f03ac011d70a73cb48}"
LMSTUDIO_CONTEXT="${LMSTUDIO_CONTEXT:-262144}"
LMSTUDIO_EXPECTED_ARCHITECTURE="${LMSTUDIO_EXPECTED_ARCHITECTURE:-qwen3_5}"
LMSTUDIO_EXPECTED_QUANTIZATION="${LMSTUDIO_EXPECTED_QUANTIZATION:-4bit}"
# The Splash engine reports exact usage counts.
LMSTUDIO_BENCH_TOLERATE_OFF_BY_ONE="${LMSTUDIO_BENCH_TOLERATE_OFF_BY_ONE:-}"

# Reasoning arrives in reasoning_content; top-level reasoning_effort=none
# disables it (enable_thinking=false does not).
LMSTUDIO_CAP_REASONING="${LMSTUDIO_CAP_REASONING:-required}"
LMSTUDIO_CAP_TOOLS="${LMSTUDIO_CAP_TOOLS:-required}"
LMSTUDIO_CAP_REASONING_MODE="${LMSTUDIO_CAP_REASONING_MODE:-default}"
LMSTUDIO_CAP_DISABLE_MODE="${LMSTUDIO_CAP_DISABLE_MODE:-reasoning-effort-none}"
LMSTUDIO_CAP_SYSTEM_PROMPT="${LMSTUDIO_CAP_SYSTEM_PROMPT:-}"

# AuditBench decodes at the checkpoint's sampling, from the base
# checkpoint's generation_config.json (mlx-community/Qwen3.8-27B-4bit); the
# package ships none.
LMSTUDIO_SAMPLING="${LMSTUDIO_SAMPLING:-temperature=1.0 top_p=0.95 top_k=20}"
