# LM Studio model config for Qwen3.6-27B, GGUF (portable).
#
# GGUF takes LM Studio's llama.cpp runtime, which runs on every host (CUDA,
# CPU, and Apple Silicon Metal), so this is the portable profile. The MLX
# sibling (qwen3.6-27b-mlx.conf) is the Apple-Silicon-only variant that takes
# the MLX runtime instead; keeping one conf per artifact matches how ollama/
# and vllm-metal/ split MLX from GGUF rather than switching on an env var.
#
# Accepted deviation (lmstudio/AGENTS.md): the pin is the repo path plus the
# quant tag, not a served content digest. LM Studio has no registry SHA256 to
# pin the way the Ollama configs do; the same repo key resolves both formats
# and the --gguf/--mlx filter on `lms get` selects which one is fetched.

# Download spec for `lms get`: repo path with the quantization pinned via @.
LMSTUDIO_GET_SPEC="${LMSTUDIO_GET_SPEC:-qwen/qwen3.6-27b@q4_k_m}"
# Model key `lms load` resolves in the local store, and what lms ps reports.
LMSTUDIO_MODEL_KEY="${LMSTUDIO_MODEL_KEY:-qwen/qwen3.6-27b}"
# Identifier assigned at load time; also the OpenAI `model` field the benchmark
# and capability adapters send, and what /v1/models must report.
LMSTUDIO_SERVED_NAME="${LMSTUDIO_SERVED_NAME:-qwen3.6-27b-gguf}"

# Artifact facts. Format selects the runtime and the lms get filter; the
# expected quant/architecture strings are exactly what `lms ls`/`lms ps` report
# (LM Studio uses the llama.cpp architecture id qwen35, not the HF class name)
# and the bench adapter compares them case-insensitively against the load.
LMSTUDIO_FORMAT="${LMSTUDIO_FORMAT:-gguf}"
LMSTUDIO_EXPECTED_QUANTIZATION="${LMSTUDIO_EXPECTED_QUANTIZATION:-Q4_K_M}"
LMSTUDIO_EXPECTED_ARCHITECTURE="${LMSTUDIO_EXPECTED_ARCHITECTURE:-qwen35}"

# Per-request context window (lms load --context-length). Matches the native
# checkpoint maximum; LM Studio refuses a load that will not fit.
LMSTUDIO_CONTEXT_LENGTH="${LMSTUDIO_CONTEXT_LENGTH:-262144}"

# Minimum LM Studio version whose v1 REST API this server drives. Enforced only
# when the CLI reports a semver; otherwise the v1 API probe is the real gate.
LMSTUDIO_MIN_VERSION="${LMSTUDIO_MIN_VERSION:-0.4.0}"

# Capability Check v1 expectations. Qwen3.6 reasons by default and supports
# XML tool calls; the enable-thinking-false control turns reasoning off.
LMSTUDIO_CAP_REASONING="${LMSTUDIO_CAP_REASONING:-required}"
LMSTUDIO_CAP_TOOLS="${LMSTUDIO_CAP_TOOLS:-required}"
LMSTUDIO_CAP_REASONING_MODE="${LMSTUDIO_CAP_REASONING_MODE:-default}"
LMSTUDIO_CAP_DISABLE_MODE="${LMSTUDIO_CAP_DISABLE_MODE:-enable-thinking-false}"
LMSTUDIO_CAP_SYSTEM_PROMPT="${LMSTUDIO_CAP_SYSTEM_PROMPT:-}"

# AuditBench v1 decode-compliance controls, sent by the bench adapters and
# recorded in the run's settings; env wins over file, and the AUDIT_BENCH_*
# harness names work too. Default "none": these Qwen models reason by
# default, and LM Studio honours reasoning_effort on /v1/chat/completions,
# so the budget goes to visible content and the token-accounting probe can
# see it. A model that does not accept the value keeps thinking and the
# probe fails closed; set a supported value, or empty to send nothing.
LMSTUDIO_BENCH_REASONING_EFFORT="${LMSTUDIO_BENCH_REASONING_EFFORT:-none}"
LMSTUDIO_BENCH_SYSTEM_PROMPT="${LMSTUDIO_BENCH_SYSTEM_PROMPT:-}"
