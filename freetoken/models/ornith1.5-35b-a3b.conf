# Ornith 1.5 35B-A3B (DeepReinforce), the publisher's Q4_K_M GGUF: a
# structural twin of Qwen3.6-35B-A3B (GGUF architecture qwen35moe), served on
# FreeToken's GGUF path with every expert in VRAM.
FREETOKEN_SERVED_NAME="${FREETOKEN_SERVED_NAME:-ornith1.5-35b-a3b}"
FREETOKEN_MODEL_REPO="${FREETOKEN_MODEL_REPO:-ornith-ai/Ornith-1.5-35B-A3B-GGUF}"
FREETOKEN_MODEL_REVISION="${FREETOKEN_MODEL_REVISION:-12393612fd4f730ff5aadc23e9b8f9648aa49ceb}"
FREETOKEN_MODEL_FILES="${FREETOKEN_MODEL_FILES:-Ornith-1.5-35B-Q4_K_M.gguf}"
# The checkpoint's native length.
FREETOKEN_CTX="${FREETOKEN_CTX:-262144}"
# Eight running requests share the KV pool FreeToken sizes from the free VRAM.
FREETOKEN_PARALLEL="${FREETOKEN_PARALLEL:-8}"
FREETOKEN_MOE_STRATEGY="${FREETOKEN_MOE_STRATEGY:-fused}"
FREETOKEN_ENGINE_ARGS="${FREETOKEN_ENGINE_ARGS:-}"

# Thinking is on by default; chat_template_kwargs.enable_thinking=false
# turns it off. Tool calls stream as OpenAI tool_calls.
FREETOKEN_CAP_REASONING="${FREETOKEN_CAP_REASONING:-required}"
FREETOKEN_CAP_TOOLS="${FREETOKEN_CAP_TOOLS:-required}"
FREETOKEN_CAP_REASONING_MODE="${FREETOKEN_CAP_REASONING_MODE:-default}"
FREETOKEN_CAP_DISABLE_MODE="${FREETOKEN_CAP_DISABLE_MODE:-enable-thinking-false}"
FREETOKEN_CAP_SYSTEM_PROMPT="${FREETOKEN_CAP_SYSTEM_PROMPT:-}"

# The fleet's Ornith 1.5 35B sampling (the base Qwen3.6-35B-A3B's
# generation_config.json); FreeToken reads the same from the GGUF.
FREETOKEN_SAMPLING="${FREETOKEN_SAMPLING:-temperature=1.0 top_p=0.95 top_k=20}"
