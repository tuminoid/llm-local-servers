# GLM-5.3-Flash, unsloth's UD-Q2_K_XL GGUF (glm5-next). Its experts do not fit
# the card: they sit in pinned host RAM behind a GPU expert cache, so the
# profile is interactive and serves one stream.
FREETOKEN_SERVED_NAME="${FREETOKEN_SERVED_NAME:-glm5.3-flash-q2kxl}"
FREETOKEN_MODEL_REPO="${FREETOKEN_MODEL_REPO:-unsloth/GLM-5.3-Flash-GGUF}"
FREETOKEN_MODEL_REVISION="${FREETOKEN_MODEL_REVISION:-a38483c8cd5df544f53d70fb281afe97369d5ab6}"
FREETOKEN_MODEL_FILES="${FREETOKEN_MODEL_FILES:-UD-Q2_K_XL/GLM-5.3-Flash-UD-Q2_K_XL-00001-of-00004.gguf UD-Q2_K_XL/GLM-5.3-Flash-UD-Q2_K_XL-00002-of-00004.gguf UD-Q2_K_XL/GLM-5.3-Flash-UD-Q2_K_XL-00003-of-00004.gguf UD-Q2_K_XL/GLM-5.3-Flash-UD-Q2_K_XL-00004-of-00004.gguf}"
# The checkpoint's native length.
FREETOKEN_CTX="${FREETOKEN_CTX:-262144}"
# Interactive: one running request.
FREETOKEN_PARALLEL="${FREETOKEN_PARALLEL:-1}"
FREETOKEN_MOE_STRATEGY="${FREETOKEN_MOE_STRATEGY:-offload}"
FREETOKEN_ENGINE_ARGS="${FREETOKEN_ENGINE_ARGS:-}"

# Thinking is always on: the GGUF's chat template opens <think> after every
# assistant turn and reads no enable_thinking.
FREETOKEN_CAP_REASONING="${FREETOKEN_CAP_REASONING:-required}"
FREETOKEN_CAP_TOOLS="${FREETOKEN_CAP_TOOLS:-required}"
FREETOKEN_CAP_REASONING_MODE="${FREETOKEN_CAP_REASONING_MODE:-default}"
FREETOKEN_CAP_DISABLE_MODE="${FREETOKEN_CAP_DISABLE_MODE:-none}"
FREETOKEN_CAP_SYSTEM_PROMPT="${FREETOKEN_CAP_SYSTEM_PROMPT:-}"

# generation_config.json.
FREETOKEN_SAMPLING="${FREETOKEN_SAMPLING:-temperature=1.0 top_p=0.95 min_p=0}"
