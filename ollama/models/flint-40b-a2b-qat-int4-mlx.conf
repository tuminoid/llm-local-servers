# Ollama MLX model config for Recursive Flint 40B-A2.5B, QAT INT4.
#
# Recursive's Apple Silicon artifact (group-64 affine INT4 experts and
# projections, INT8 embeddings), served by Ollama's MLX runner. 0.40.8 is
# the first release with Flint, macOS only.

OLLAMA_MODEL="${OLLAMA_MODEL:-flint:40b-a2b-qat-int4}"
OLLAMA_EXPECTED_DIGEST="${OLLAMA_EXPECTED_DIGEST:-a503b9032955b04831daf8065e689f146e842d77167aada5d20e0300393da468}"
OLLAMA_EXPECTED_FORMAT="${OLLAMA_EXPECTED_FORMAT:-safetensors}"
OLLAMA_EXPECTED_QUANTIZATION="${OLLAMA_EXPECTED_QUANTIZATION:-int4}"
OLLAMA_EXPECTED_ARCHITECTURE="${OLLAMA_EXPECTED_ARCHITECTURE:-flint}"
OLLAMA_EXPECTED_NATIVE_CONTEXT="${OLLAMA_EXPECTED_NATIVE_CONTEXT:-262144}"
OLLAMA_MIN_VERSION="${OLLAMA_MIN_VERSION:-0.40.8}"
OLLAMA_CONTEXT_LENGTH="${OLLAMA_CONTEXT_LENGTH:-262144}"
OLLAMA_KV_CACHE_TYPE="${OLLAMA_KV_CACHE_TYPE:-mlx-native}"
OLLAMA_CAP_REASONING="${OLLAMA_CAP_REASONING:-required}"
OLLAMA_CAP_TOOLS="${OLLAMA_CAP_TOOLS:-required}"
OLLAMA_CAP_REASONING_MODE="${OLLAMA_CAP_REASONING_MODE:-default}"
OLLAMA_CAP_DISABLE_MODE="${OLLAMA_CAP_DISABLE_MODE:-think-false}"
OLLAMA_CAP_SYSTEM_PROMPT="${OLLAMA_CAP_SYSTEM_PROMPT:-}"
# The model card requires returned reasoning preserved in the history;
# without it audit fitness fell to 9 of 12 (2026-10-22, 0.40.8).
OLLAMA_PRESERVE_REASONING="${OLLAMA_PRESERVE_REASONING:-1}"

# AuditBench and audit fitness decode at the checkpoint's sampling, from
# generation_config.json at RecursiveSI/flint 2a247be.
OLLAMA_SAMPLING="${OLLAMA_SAMPLING:-temperature=1.0 top_p=0.95 top_k=20}"
