# Ollama model config for Qwen3.8 27B at native context.
#
# The official qwen3.8:27b artifact requires Ollama 0.32.12 or newer. This
# profile keeps the native 262,144-token context as the measured A100 operating
# point; qwen3.8-27b.conf remains the faster 128k local profile.
#
# Ollama classifies this model as qwen35 and hard-limits that architecture to
# one parallel request. Runtime 0.34.2 (GGUF runtime, root Makefile), MTP
# drafting on from the registry Modelfile (draft_num_predict 4). Remote
# lifecycle calls pass OLLAMA_VERSION=0.34.2 at the make level: the remote
# fixed environment resolves OLLAMA_BIN before this conf is read.

OLLAMA_MODEL="${OLLAMA_MODEL:-qwen3.8:27b}"
OLLAMA_EXPECTED_DIGEST="${OLLAMA_EXPECTED_DIGEST:-22130167c4c20e20c7b71454612966ca8e8171e9b3cc8ab6ce8aa6cbfec79643}"
OLLAMA_EXPECTED_FORMAT="${OLLAMA_EXPECTED_FORMAT:-gguf}"
OLLAMA_EXPECTED_QUANTIZATION="${OLLAMA_EXPECTED_QUANTIZATION:-Q4_K_M}"
OLLAMA_EXPECTED_ARCHITECTURE="${OLLAMA_EXPECTED_ARCHITECTURE:-qwen35}"
OLLAMA_EXPECTED_NATIVE_CONTEXT="${OLLAMA_EXPECTED_NATIVE_CONTEXT:-262144}"
OLLAMA_MIN_VERSION="${OLLAMA_MIN_VERSION:-0.32.12}"
OLLAMA_RUNTIME_VERSION="${OLLAMA_RUNTIME_VERSION:-0.34.2}"
OLLAMA_CONTEXT_LENGTH="${OLLAMA_CONTEXT_LENGTH:-262144}"
OLLAMA_KV_CACHE_TYPE="${OLLAMA_KV_CACHE_TYPE:-q8_0}"
OLLAMA_CAP_REASONING="${OLLAMA_CAP_REASONING:-required}"
OLLAMA_CAP_TOOLS="${OLLAMA_CAP_TOOLS:-required}"
OLLAMA_CAP_REASONING_MODE="${OLLAMA_CAP_REASONING_MODE:-think-true}"
OLLAMA_CAP_DISABLE_MODE="${OLLAMA_CAP_DISABLE_MODE:-think-false}"
OLLAMA_CAP_SYSTEM_PROMPT="${OLLAMA_CAP_SYSTEM_PROMPT:-}"

# AuditBench and audit fitness decode at the checkpoint's sampling, from the registry
# artifact's params layer.
OLLAMA_SAMPLING="${OLLAMA_SAMPLING:-temperature=1 top_p=0.95 top_k=20}"
