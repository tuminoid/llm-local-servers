# Ollama model config for Gemma 4 E2B.
#
# The official gemma4:e2b artifact is Q4_K_M and requires Ollama 0.30.5 or
# newer. The checkpoint's native 131,072-token context matches the comparable
# local vLLM profile.

OLLAMA_MODEL="${OLLAMA_MODEL:-gemma4:e2b}"
OLLAMA_EXPECTED_DIGEST="${OLLAMA_EXPECTED_DIGEST:-7fbdbf8f5e45a75bb122155ed546e765b4d9c53a1285f62fd9f506baa1c5a47e}"
OLLAMA_EXPECTED_FORMAT="${OLLAMA_EXPECTED_FORMAT:-gguf}"
OLLAMA_EXPECTED_QUANTIZATION="${OLLAMA_EXPECTED_QUANTIZATION:-Q4_K_M}"
OLLAMA_EXPECTED_ARCHITECTURE="${OLLAMA_EXPECTED_ARCHITECTURE:-gemma4}"
OLLAMA_EXPECTED_NATIVE_CONTEXT="${OLLAMA_EXPECTED_NATIVE_CONTEXT:-131072}"
OLLAMA_MIN_VERSION="${OLLAMA_MIN_VERSION:-0.30.5}"
OLLAMA_CONTEXT_LENGTH="${OLLAMA_CONTEXT_LENGTH:-131072}"
OLLAMA_KV_CACHE_TYPE="${OLLAMA_KV_CACHE_TYPE:-q8_0}"
OLLAMA_CAP_REASONING="${OLLAMA_CAP_REASONING:-required}"
OLLAMA_CAP_TOOLS="${OLLAMA_CAP_TOOLS:-required}"
OLLAMA_CAP_REASONING_MODE="${OLLAMA_CAP_REASONING_MODE:-think-true}"
OLLAMA_CAP_DISABLE_MODE="${OLLAMA_CAP_DISABLE_MODE:-think-false}"
OLLAMA_CAP_SYSTEM_PROMPT="${OLLAMA_CAP_SYSTEM_PROMPT:-}"

# AuditBench decodes at the checkpoint's sampling, from the registry
# artifact's params layer.
OLLAMA_SAMPLING="${OLLAMA_SAMPLING:-temperature=1 top_p=0.95 top_k=64}"
