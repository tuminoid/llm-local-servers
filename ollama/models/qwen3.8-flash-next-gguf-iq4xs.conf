# Ollama GGUF model config for Qwen3.8-Flash-Next (125B-A6B), UD-IQ4_XS.
#
# The A100 sibling of qwen3.8-flash-next-gguf: the same locally
# imported model at the smaller UD-IQ4_XS quantization, sized for the
# 80 GB card (layers ~60 GiB in VRAM, the 26.8 GiB n-gram PLE table in
# host RAM). Same rules as the Q4_K_XL conf: LOCAL `ollama create`
# import, never a registry pull; use_mmap=false baked into the model;
# runtime split to 0.33.3 (vendored llama.cpp b10760, first
# qwen4exp-capable pin).
#
# REMOTE IMPORT RECIPE (three UD-IQ4_XS shards of
# unsloth/Qwen3.8-Flash-Next-GGUF at revision
# c8b5954a88c2775c546b92593eda40ea041d3176, per-shard LFS SHA-256s
# verified after download): stage the shards in a HOME-DIRECTORY
# staging dir -- NEVER under tmp/ollama/, whose deploy rsync runs
# --delete and removes everything outside runtime/, model-cache/, and
# state/ -- then `ollama create` from that directory with a Modelfile
# of FROM <dir> + PARAMETER use_mmap false. The server merges the
# shards into one 93 GB blob and leaves the raw shard-upload blobs
# ORPHANED in the blob store (~87 GB, zero manifest references):
# verify and delete them after every split-GGUF import.
#
# REMOTE START: the remote fixed environment resolves OLLAMA_BIN from
# the make-level OLLAMA_VERSION before this conf is read, so remote
# lifecycle calls must pass it explicitly:
#   make ollama-remote-start HOST=<host> OLLAMA_VERSION=0.33.3 \
#     MODEL=qwen3.8-flash-next-gguf-iq4xs
# A forgotten override fails loudly at the min-version check. The
# conf's OLLAMA_RUNTIME_VERSION still covers a local start.
#
# OPERATING POINT (measured 2026-09-05, A100-SXM4-80GB, 211 GB host
# RAM): two full native-context slots at q8_0 KV, 73.0-73.4 GB VRAM,
# 49/49 layers offloaded. The 2 x 262,144 shape is LOCKED by decision:
# llama.cpp partitions -c statically across slots (no fungible pool),
# so more slots means proportionally smaller per-slot context -- a
# measured 8 x 65,536 shape batches decode to 143.5 tok/s aggregate at
# only 63% GPU utilization, but a big model on tiny windows serves no
# fleet need; pooled-KV shapes belong to a future FreeToken or vLLM
# route. Supervised evidence at this operating point: needles exact at
# 20k/131k/246k and in a dual concurrent 246k pair; prefill
# 1,087 / 829 / 634 tok/s at those depths (~1.75-2x the M5 Q4_K_XL
# point); decode 35.5 / 20.7 / 13.8 tok/s (PLE-over-PCIe and QSA
# bound, only ~8% above the M5); 2-stream decode 58.2 tok/s aggregate
# (1.85x). Cold deep prefills serialize across slots and starve the
# sibling slot's decode, as on Metal.
#
# The truncated-tool-call parser 500 documented in the Q4_K_XL conf
# presumably blocks AuditBench replay profiles here identically
# (untested on CUDA). Capability Check v1 and canonical AuditBench
# remain owed on this artifact; the figures above are supervised probe
# evidence, not canonical rates.

OLLAMA_MODEL="${OLLAMA_MODEL:-qwen3.8-flash-next:ud-iq4xs}"
OLLAMA_EXPECTED_DIGEST="${OLLAMA_EXPECTED_DIGEST:-0f61f031c82b5fbbefa9df575f5ce1e5abb1c3bcdc78b88549e85bf8cd878d14}"
OLLAMA_EXPECTED_FORMAT="${OLLAMA_EXPECTED_FORMAT:-gguf}"
OLLAMA_EXPECTED_QUANTIZATION="${OLLAMA_EXPECTED_QUANTIZATION:-IQ4_XS}"
OLLAMA_EXPECTED_ARCHITECTURE="${OLLAMA_EXPECTED_ARCHITECTURE:-qwen4exp}"
OLLAMA_EXPECTED_NATIVE_CONTEXT="${OLLAMA_EXPECTED_NATIVE_CONTEXT:-262144}"
OLLAMA_MIN_VERSION="${OLLAMA_MIN_VERSION:-0.33.3}"
OLLAMA_RUNTIME_VERSION="${OLLAMA_RUNTIME_VERSION:-0.33.3}"
OLLAMA_CONTEXT_LENGTH="${OLLAMA_CONTEXT_LENGTH:-262144}"
OLLAMA_NUM_PARALLEL="${OLLAMA_NUM_PARALLEL:-2}"
OLLAMA_KV_CACHE_TYPE="${OLLAMA_KV_CACHE_TYPE:-q8_0}"
OLLAMA_LOCAL_IMPORT="${OLLAMA_LOCAL_IMPORT:-1}"
OLLAMA_CAP_REASONING="${OLLAMA_CAP_REASONING:-required}"
OLLAMA_CAP_TOOLS="${OLLAMA_CAP_TOOLS:-required}"
OLLAMA_CAP_REASONING_MODE="${OLLAMA_CAP_REASONING_MODE:-think-true}"
OLLAMA_CAP_DISABLE_MODE="${OLLAMA_CAP_DISABLE_MODE:-think-false}"
OLLAMA_CAP_SYSTEM_PROMPT="${OLLAMA_CAP_SYSTEM_PROMPT:-}"
