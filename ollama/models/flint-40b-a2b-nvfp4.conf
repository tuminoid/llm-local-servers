# Ollama model config for Recursive Flint 40B-A2.5B, NVFP4 GGUF.
#
# Recursive's CUDA artifact, the tag's `latest`: every projection and expert
# in NVFP4, embeddings in BF16. 0.40.9 is the first release with Flint off
# macOS. Not on Apple Silicon: llama.cpp's Metal backend has no NVFP4 matmul,
# so the weights would run on the CPU; the M5 serves Flint from Splash.

OLLAMA_MODEL="${OLLAMA_MODEL:-flint:40b-a2b-gguf-nvfp4}"
OLLAMA_EXPECTED_DIGEST="${OLLAMA_EXPECTED_DIGEST:-9543f736310ddf3daee4f3d5467229d0ac16cdc3d58339a97eecac1c27d37872}"
OLLAMA_EXPECTED_FORMAT="${OLLAMA_EXPECTED_FORMAT:-gguf}"
OLLAMA_EXPECTED_QUANTIZATION="${OLLAMA_EXPECTED_QUANTIZATION:-NVFP4}"
OLLAMA_EXPECTED_ARCHITECTURE="${OLLAMA_EXPECTED_ARCHITECTURE:-flint}"
OLLAMA_EXPECTED_NATIVE_CONTEXT="${OLLAMA_EXPECTED_NATIVE_CONTEXT:-262144}"
OLLAMA_MIN_VERSION="${OLLAMA_MIN_VERSION:-0.40.9}"
OLLAMA_CONTEXT_LENGTH="${OLLAMA_CONTEXT_LENGTH:-262144}"
OLLAMA_KV_CACHE_TYPE="${OLLAMA_KV_CACHE_TYPE:-q8_0}"
# 14 of 49 layers carry full attention with 4 KV heads, so four 262,144
# sessions need about 15 GiB of q8 KV beside the 21 GiB of weights.
OLLAMA_NUM_PARALLEL="${OLLAMA_NUM_PARALLEL:-4}"
OLLAMA_CAP_REASONING="${OLLAMA_CAP_REASONING:-required}"
OLLAMA_CAP_TOOLS="${OLLAMA_CAP_TOOLS:-required}"
OLLAMA_CAP_REASONING_MODE="${OLLAMA_CAP_REASONING_MODE:-default}"
OLLAMA_CAP_DISABLE_MODE="${OLLAMA_CAP_DISABLE_MODE:-think-false}"
OLLAMA_CAP_SYSTEM_PROMPT="${OLLAMA_CAP_SYSTEM_PROMPT:-}"
# The model card requires returned reasoning preserved in the history;
# without it the MLX build's audit fitness fell to 9 of 12 (2026-10-22).
OLLAMA_PRESERVE_REASONING="${OLLAMA_PRESERVE_REASONING:-1}"

# AuditBench and audit fitness decode at the checkpoint's sampling, from
# generation_config.json at RecursiveSI/flint 2a247be, matching the tag's
# params layer.
OLLAMA_SAMPLING="${OLLAMA_SAMPLING:-temperature=1.0 top_p=0.95 top_k=20}"
