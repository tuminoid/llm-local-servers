# Ollama model config for Qwen3.6-35B-A3B REAP-48 v2.
#
# crucible-labs/Qwen3.6-35B-A3B-REAP-48-v2-GGUF at revision
# b960e1f922fb4eb62113831d9629afa7b320930f: Qwen3.6-35B-A3B with 48% of its
# routed experts pruned by REAP, the rest IQ3_S/IQ4_XS and the shared
# expert Q5_K-Q8_0 (Qwen3.6-35B-A3B-REAP-48-v2.gguf, 9,426,919,520 bytes,
# sha256 91d1e110bf55741f9bddbeaba1d0c6e224058a09d46607b2b6cd757cb03fa191;
# Ollama labels the file type Q4_K_M). 19.2B parameters, no MTP head.
#
# LOCALLY IMPORTED, not a registry pull. `ollama create` from a directory
# holding the real file and a Modelfile of:
#   FROM ./Qwen3.6-35B-A3B-REAP-48-v2.gguf
#   RENDERER qwen3.5
#   PARSER qwen3.5
# the renderer and parser the registry's qwen3.6:35b-a3b declares for the
# same architecture.
#
# Sized to run entirely on the RTX PRO 3000's 12 GiB. At 262,144 with q4_0
# KV (1,440 MiB) and an 820 MiB compute buffer, llama.cpp projects 11,030
# MiB against 11,532 free under the launcher's 256 MiB fit target for a GPU
# without a display, and /api/ps reports all 11,565,835,221 bytes on the GPU;
# a 256,890-token prompt prefilled there at 801 tok/s (2026-10-12). q8_0 KV
# at 262,144 keeps 41/41 layers on the GPU but moves six layers' experts
# (1.7 GB) to the CPU. The card's -b equal to -ub holds: Ollama runs both
# at 512.
#
# The digest is the local import's manifest blob (manifests-v2/).

