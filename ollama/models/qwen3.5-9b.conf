# Ollama model config for Qwen3.5 9B.
#
# The official qwen3.5:9b artifact is Q4_K_M plus a vision projector and
# requires Ollama 0.30.0 or newer. The checkpoint supports 262,144 tokens;
# this profile uses 131,072. Repinned 2026-10-10 after the registry tag
# moved; the previous pin, 6488c96f, was rewritten in the RTX store by Ollama
# 0.40.1's local compat migration. At 262,144 the current artifact loads 32
# of 33 layers on the 12 GiB RTX and every request fails with CUDA out of
# memory under 0.32.14; at 131,072 all 33 layers fit.
#
# Ollama classifies this model as qwen35 and hard-limits that architecture to
# one parallel request.

OLLAMA_MODEL="${OLLAMA_MODEL:-qwen3.5:9b}"
OLLAMA_EXPECTED_DIGEST="${OLLAMA_EXPECTED_DIGEST:-56671c2ab9385f9cfcb404638e32cd62d88e3501d44822208363c010179a3c90}"
OLLAMA_EXPECTED_FORMAT="${OLLAMA_EXPECTED_FORMAT:-gguf}"
OLLAMA_EXPECTED_QUANTIZATION="${OLLAMA_EXPECTED_QUANTIZATION:-Q4_K_M}"
OLLAMA_EXPECTED_ARCHITECTURE="${OLLAMA_EXPECTED_ARCHITECTURE:-qwen35}"
OLLAMA_EXPECTED_NATIVE_CONTEXT="${OLLAMA_EXPECTED_NATIVE_CONTEXT:-262144}"
OLLAMA_MIN_VERSION="${OLLAMA_MIN_VERSION:-0.30.0}"
OLLAMA_CONTEXT_LENGTH="${OLLAMA_CONTEXT_LENGTH:-131072}"
OLLAMA_KV_CACHE_TYPE="${OLLAMA_KV_CACHE_TYPE:-q8_0}"
OLLAMA_CAP_REASONING="${OLLAMA_CAP_REASONING:-required}"
OLLAMA_CAP_TOOLS="${OLLAMA_CAP_TOOLS:-required}"
OLLAMA_CAP_REASONING_MODE="${OLLAMA_CAP_REASONING_MODE:-think-true}"
OLLAMA_CAP_DISABLE_MODE="${OLLAMA_CAP_DISABLE_MODE:-think-false}"
OLLAMA_CAP_SYSTEM_PROMPT="${OLLAMA_CAP_SYSTEM_PROMPT:-}"

# AuditBench and audit fitness decode at the checkpoint's sampling, from the registry
# artifact's params layer.
OLLAMA_SAMPLING="${OLLAMA_SAMPLING:-temperature=1 top_p=0.95 top_k=20 presence_penalty=1.5}"
