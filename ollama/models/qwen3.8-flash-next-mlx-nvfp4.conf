# Ollama MLX model config for Qwen3.8-Flash-Next 125B-A6B, NVFP4.
#
# TECH DEMO, not a serving recommendation: UNUSABLE FOR AUDITS on a 128 GB
# host for the prefill reason below, and AuditBench cannot run at all (its
# floor is a 131,072-token allocation). The viable deep-context path for this
# checkpoint is the llama.cpp IQ4_XS profile.
#
# The registry artifact is safetensors NVFP4 (~97.8 GiB of weights), so Ollama
# dispatches it to the MLX runner. The manifest requires Ollama 0.33.1 and the
# fleet's managed 0.32.14 predates Qwen4Exp MLX support, so run every target
# for this model with OLLAMA_VERSION=0.33.3 -- the same split runtime the
# flash-next GGUF profiles use. The root Makefile pin is unchanged.
#
# PREFILL CEILING: any prompt beyond ~3k tokens dies in a Metal
# command-buffer OOM (kIOGPUCommandBufferCallbackErrorOutOfMemory) during
# prefill -- 2,942 tokens completes, ~4,200 fails. The ceiling is
# prompt-scaled, not allocation-scaled: the identical failure occurs at an
# 8,192-token allocation, because prefill compute wants more than the ~9.6 GiB
# of headroom the weights leave. The 32,768 context below never constrained
# anything in practice; prefill dies first.
#
# NEVER raise iogpu.wired_limit_mb for this model. A supervised experiment at
# 118 GiB moved the ceiling only from ~3k to ~8k tokens and REMOVED the safety
# property: Ollama's graceful OOM handling only triggers when Metal itself
# throws, so pushing the Metal wall past the RAM wall converts a safe failure
# into the 2026-08-20 hard-reset shape (unbounded growth in system RAM, where
# nothing throws and no version protects). The sysctl was restored to 0.
#
# The registry config blob exposes no architecture string, but the pulled model
# reports general.architecture qwen4_exp. Its 180.0B parameter count is 125B
# main + 51B PLE + a 4B MTP head, so unlike the GGUF conversion this artifact
# carries the trained MTP head.
#
# Its schema enforcement passes here where every MLX profile on the 0.32.14
# pin reports `ignored` -- that defect is the older runtime's, not the MLX
# runner's (see CAPABILITIES.md).

OLLAMA_MODEL="${OLLAMA_MODEL:-qwen3.8-flash-next:125b-a6b-nvfp4}"
OLLAMA_EXPECTED_DIGEST="${OLLAMA_EXPECTED_DIGEST:-c7b96ffe21afe8c3dbb87d814b86bb5e89e622122f8613fb7acf4268a5bb85fa}"
OLLAMA_EXPECTED_FORMAT="${OLLAMA_EXPECTED_FORMAT:-safetensors}"
OLLAMA_EXPECTED_QUANTIZATION="${OLLAMA_EXPECTED_QUANTIZATION:-nvfp4}"
OLLAMA_EXPECTED_ARCHITECTURE="${OLLAMA_EXPECTED_ARCHITECTURE:-qwen4_exp}"
OLLAMA_EXPECTED_NATIVE_CONTEXT="${OLLAMA_EXPECTED_NATIVE_CONTEXT:-262144}"
OLLAMA_MIN_VERSION="${OLLAMA_MIN_VERSION:-0.33.3}"
OLLAMA_CONTEXT_LENGTH="${OLLAMA_CONTEXT_LENGTH:-32768}"
OLLAMA_KV_CACHE_TYPE="${OLLAMA_KV_CACHE_TYPE:-mlx-native}"
OLLAMA_CAP_REASONING="${OLLAMA_CAP_REASONING:-required}"
OLLAMA_CAP_TOOLS="${OLLAMA_CAP_TOOLS:-required}"
OLLAMA_CAP_REASONING_MODE="${OLLAMA_CAP_REASONING_MODE:-think-true}"
OLLAMA_CAP_DISABLE_MODE="${OLLAMA_CAP_DISABLE_MODE:-think-false}"
OLLAMA_CAP_SYSTEM_PROMPT="${OLLAMA_CAP_SYSTEM_PROMPT:-}"

# AuditBench and audit fitness decode at the checkpoint's sampling, from the registry
# artifact's params layer.
OLLAMA_SAMPLING="${OLLAMA_SAMPLING:-temperature=1 top_p=0.95 top_k=20}"
