# Ollama MLX model config for Qwen3.8-Flash-Next 125B-A6B, NVFP4.
#
# TECH DEMO status: not a serving recommendation. No AuditBench result,
# no capability gate, no per-digest depth proof exists yet.
#
# The qwen3.8-flash-next:125b-a6b-nvfp4 registry artifact is safetensors
# NVFP4 (105 GB, ~97.8 GiB of weights), so Ollama dispatches it to the
# MLX runner. The checkpoint is the multimodal Qwen4 preview architecture:
# 125B main parameters with 6B active, plus a 51B n-gram PLE table. The manifest declares capabilities completion, vision, tools,
# thinking, renderer qwen3.8, parser qwen3.5, and requires Ollama 0.33.1;
# the fleet's managed 0.32.14 predates Qwen4Exp MLX support, so run every
# target for this model with OLLAMA_VERSION=0.33.1 (and its reviewed
# archive digest for ollama-install). The root Makefile pin is unchanged.
#
# MEASURED (2026-08-28 tech demo, supervised): loads clean in ~25 s,
# 97.87 GiB all-GPU against the 107.5 GiB Metal working-set limit, and
# passes Capability Check v1 (reasoning, think-false, tools, tool round
# trip, JSON). Short decode 47.4 tok/s, shallow prefill ~260-300 tok/s.
# But any prompt beyond ~3k tokens dies in a Metal command-buffer OOM
# (kIOGPUCommandBufferCallbackErrorOutOfMemory) during prefill: 2,942
# tokens completes, ~4,200 fails, and the ceiling is prompt-scaled, not
# allocation-scaled -- the identical failure occurs at an 8,192-token
# allocation, so the runner's prefill compute wants more than the ~9.6
# GiB of headroom the weights leave, independent of context config.
# Ollama fails safe here (scheduler logs "runtime OOM detected",
# expires the model, memory is released; no host damage) -- but that
# protection is not new in 0.33: it shipped silently in v0.30.0
# (PR #16031 lineage) and is present in the 0.32.14 fleet pin. It only
# triggers when Metal itself throws (working-set wall), which this
# model's 97.87 GiB weights guarantee; the 2026-08-20 hard-reset shape
# (unbounded KV growth in system RAM, nothing throws) is NOT covered,
# on any version. No release note documents it; recorded locally per
# the no-upstream-reports policy.
#
# RAISED-LIMIT EXPERIMENT (2026-08-28, supervised, then reverted):
# iogpu.wired_limit_mb=120832 (118 GiB) moved the ceiling only from
# ~3k to ~8k tokens (7,442 passed at 199 tok/s; ~12k blew through the
# extra 10.5 GiB in under 0.5 s, pressure normal -> critical with no
# warn stage, watchdog killed the group at 14 MiB free). Two lessons:
# the prefill compute slope is ~1.5-2 GiB per 1k tokens of depth, so
# 32k audit depth needs 40-60 GiB of headroom that cannot exist beside
# 97.87 GiB of weights on a 128 GB host; and raising the limit REMOVES
# the safety property -- the Metal wall stops firing before the RAM
# wall, converting graceful OOMs into the hard-reset shape. NEVER
# raise iogpu.wired_limit_mb for this model. The sysctl was restored
# to 0 (default) the same day. VERDICT: audit-unusable at any setting;
# the deep-context path is llama.cpp (qwen4exp merged upstream
# 2026-08-27, commit 6c84c7d5d883).
# AuditBench cannot run at all: its protocol
# floor is a 131,072-token allocation and real depth OOMs three orders
# of magnitude earlier. UNUSABLE FOR AUDITS on the 128 GB M5 Max; the
# viable deep-context path for this checkpoint stays llama.cpp IQ4_XS
# (87 GiB weights, pageable PLE).
# The 32,768 default below is the demo operating point; it never
# constrained anything in practice because prefill dies first.
#
# Identity expectations below were read from the pulled 2026-08-28
# manifest and `/api/show` on the 0.33.1 runtime. The registry config
# blob exposes no architecture string, but the pulled model reports
# general.architecture qwen4_exp. Reported parameter count is 180.0B:
# 125B main + 51B n-gram PLE + the 4B MTP head, so unlike the llama.cpp
# GGUF conversion this MLX artifact carries the trained MTP head.

OLLAMA_MODEL="${OLLAMA_MODEL:-qwen3.8-flash-next:125b-a6b-nvfp4}"
OLLAMA_EXPECTED_DIGEST="${OLLAMA_EXPECTED_DIGEST:-c7b96ffe21afe8c3dbb87d814b86bb5e89e622122f8613fb7acf4268a5bb85fa}"
OLLAMA_EXPECTED_FORMAT="${OLLAMA_EXPECTED_FORMAT:-safetensors}"
OLLAMA_EXPECTED_QUANTIZATION="${OLLAMA_EXPECTED_QUANTIZATION:-nvfp4}"
OLLAMA_EXPECTED_ARCHITECTURE="${OLLAMA_EXPECTED_ARCHITECTURE:-qwen4_exp}"
OLLAMA_EXPECTED_NATIVE_CONTEXT="${OLLAMA_EXPECTED_NATIVE_CONTEXT:-262144}"
OLLAMA_MIN_VERSION="${OLLAMA_MIN_VERSION:-0.33.1}"
OLLAMA_CONTEXT_LENGTH="${OLLAMA_CONTEXT_LENGTH:-32768}"
OLLAMA_KV_CACHE_TYPE="${OLLAMA_KV_CACHE_TYPE:-mlx-native}"
OLLAMA_CAP_REASONING="${OLLAMA_CAP_REASONING:-required}"
OLLAMA_CAP_TOOLS="${OLLAMA_CAP_TOOLS:-required}"
OLLAMA_CAP_REASONING_MODE="${OLLAMA_CAP_REASONING_MODE:-think-true}"
OLLAMA_CAP_DISABLE_MODE="${OLLAMA_CAP_DISABLE_MODE:-think-false}"
OLLAMA_CAP_SYSTEM_PROMPT="${OLLAMA_CAP_SYSTEM_PROMPT:-}"
