# Ollama model config for Qwen3.8-27B.
#
# The official qwen3.8:27b artifact is Q4_K_M and includes the vision
# projector. Its manifest requires Ollama 0.32.12 or newer.
#
# Qwen3.8 is a 64-layer hybrid: 16 full-attention layers and 48 GatedDeltaNet
# layers. At 131,072 tokens, q8 KV for the full-attention layers costs 4.25 GiB
# per slot, plus 512 MiB for the MTP draft cache. On the 12 GiB host that leaves
# room for 26/66 reported layers on GPU, versus 18/66 at the native 262,144.
#
# The original target was two slots. Ollama 0.32.14 classifies this model as
# qwen35 and hard-limits that architecture to one parallel request, regardless
# of OLLAMA_NUM_PARALLEL. Keep the supported default at one until that upstream
# restriction is removed.
#
# Runtime 0.34.2 (GGUF runtime, root Makefile). The registry Modelfile sets
# draft_num_predict 4, so the llama.cpp runner drafts with the embedded MTP
# head and every rate on this profile is MTP-speculated; an hf.co GGUF
# import of the same architecture carries no Modelfile parameters and
# decodes plainly unless the request sets draft_num_predict.

OLLAMA_MODEL="${OLLAMA_MODEL:-qwen3.8:27b}"
OLLAMA_EXPECTED_DIGEST="${OLLAMA_EXPECTED_DIGEST:-22130167c4c20e20c7b71454612966ca8e8171e9b3cc8ab6ce8aa6cbfec79643}"
OLLAMA_EXPECTED_FORMAT="${OLLAMA_EXPECTED_FORMAT:-gguf}"
OLLAMA_EXPECTED_QUANTIZATION="${OLLAMA_EXPECTED_QUANTIZATION:-Q4_K_M}"
OLLAMA_EXPECTED_ARCHITECTURE="${OLLAMA_EXPECTED_ARCHITECTURE:-qwen35}"
OLLAMA_EXPECTED_NATIVE_CONTEXT="${OLLAMA_EXPECTED_NATIVE_CONTEXT:-262144}"
OLLAMA_MIN_VERSION="${OLLAMA_MIN_VERSION:-0.32.12}"
OLLAMA_RUNTIME_VERSION="${OLLAMA_RUNTIME_VERSION:-0.34.2}"
OLLAMA_CONTEXT_LENGTH="${OLLAMA_CONTEXT_LENGTH:-131072}"
OLLAMA_KV_CACHE_TYPE="${OLLAMA_KV_CACHE_TYPE:-q8_0}"
OLLAMA_CAP_REASONING="${OLLAMA_CAP_REASONING:-required}"
OLLAMA_CAP_TOOLS="${OLLAMA_CAP_TOOLS:-required}"
OLLAMA_CAP_REASONING_MODE="${OLLAMA_CAP_REASONING_MODE:-think-true}"
OLLAMA_CAP_DISABLE_MODE="${OLLAMA_CAP_DISABLE_MODE:-think-false}"
OLLAMA_CAP_SYSTEM_PROMPT="${OLLAMA_CAP_SYSTEM_PROMPT:-}"

# AuditBench decodes at the checkpoint's sampling, from the registry
# artifact's params layer.
OLLAMA_SAMPLING="${OLLAMA_SAMPLING:-temperature=1 top_p=0.95 top_k=20}"
