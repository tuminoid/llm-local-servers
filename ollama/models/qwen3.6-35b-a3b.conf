# Ollama model config for Qwen3.6 35B-A3B.
#
# The official qwen3.6:35b-a3b artifact is Q4_K_M. Its manifest declares no
# minimum Ollama version, so this profile requires the managed version against
# which it is validated. The checkpoint supports 262,144 tokens.
#
# Ollama classifies this model as qwen35moe and hard-limits that architecture
# to one parallel request under the managed 0.32.14 runtime.
#
# The registry's qwen3.6:35b-a3b-mtp-q4_K_M tag resolves to this exact
# manifest digest (verified 2026-08-25): the default Q4_K_M artifact
# already packages the multi-token-prediction head, so there is no
# separate MTP profile. Packaging proves presence, not a speedup --
# whether the managed runtime engages the head for speculative decode is
# unverified and needs matched decode measurements.

OLLAMA_MODEL="${OLLAMA_MODEL:-qwen3.6:35b-a3b}"
OLLAMA_EXPECTED_DIGEST="${OLLAMA_EXPECTED_DIGEST:-096fdbd02fe620fc10cbeb6537e080f8041aece851e5d696aed024d4f70f2e47}"
OLLAMA_EXPECTED_FORMAT="${OLLAMA_EXPECTED_FORMAT:-gguf}"
OLLAMA_EXPECTED_QUANTIZATION="${OLLAMA_EXPECTED_QUANTIZATION:-Q4_K_M}"
OLLAMA_EXPECTED_ARCHITECTURE="${OLLAMA_EXPECTED_ARCHITECTURE:-qwen35moe}"
OLLAMA_EXPECTED_NATIVE_CONTEXT="${OLLAMA_EXPECTED_NATIVE_CONTEXT:-262144}"
OLLAMA_MIN_VERSION="${OLLAMA_MIN_VERSION:-0.32.14}"
OLLAMA_CONTEXT_LENGTH="${OLLAMA_CONTEXT_LENGTH:-262144}"
OLLAMA_KV_CACHE_TYPE="${OLLAMA_KV_CACHE_TYPE:-q8_0}"
OLLAMA_CAP_REASONING="${OLLAMA_CAP_REASONING:-required}"
OLLAMA_CAP_TOOLS="${OLLAMA_CAP_TOOLS:-required}"
OLLAMA_CAP_REASONING_MODE="${OLLAMA_CAP_REASONING_MODE:-think-true}"
OLLAMA_CAP_DISABLE_MODE="${OLLAMA_CAP_DISABLE_MODE:-think-false}"
OLLAMA_CAP_SYSTEM_PROMPT="${OLLAMA_CAP_SYSTEM_PROMPT:-}"

# AuditBench and audit fitness decode at the checkpoint's sampling, from the registry
# artifact's params layer.
OLLAMA_SAMPLING="${OLLAMA_SAMPLING:-temperature=1 top_p=0.95 top_k=20 presence_penalty=1.5}"
