# Ollama MLX model config for NVIDIA Nemotron 3.5 Lightning 30B-A3B.
#
# The nemotron-3.5-lightning:30b-a3b-mlx registry artifact is a safetensors
# MLX build (~25 GB), so Ollama dispatches it to the MLX runner rather than
# llama.cpp. Announced 2026-08-11; NemotronHForCausalLM (nemotron_h), a
# Mamba/attention hybrid MoE with 30B total and 3B active parameters,
# 52 layers, GQA 32q/2kv. The manifest declares completion, tools, and
# thinking.
#
# The registry artifact declares a 262,144-token context (the official HF
# config carries max_position_embeddings 1,048,576, but the artifact is the
# authority here). The full 262,144 default is proven: only 6 of 52 layers
# are attention (KV 6,144 B/token, 1.5 GiB at full depth; Mamba state is a
# constant 46 MiB/sequence), and a supervised 2026-08-25 near-ceiling run
# prefilled 235,390 tokens at 2,010 tok/s inside a 41.1 GiB allocation,
# retrieved a depth-1 needle exactly, and decoded at 48.2 tok/s.
#
# Identity expectations below were read from the pulled 2026-08-25 manifest
# and `ollama show` on the managed 0.32.14 runtime.

OLLAMA_MODEL="${OLLAMA_MODEL:-nemotron-3.5-lightning:30b-a3b-mlx}"
OLLAMA_EXPECTED_DIGEST="${OLLAMA_EXPECTED_DIGEST:-8b1474be6e54dc19eb7aa08bebfb9bda147c4b9ef9796a726131ad29ad15645a}"
OLLAMA_EXPECTED_FORMAT="${OLLAMA_EXPECTED_FORMAT:-safetensors}"
OLLAMA_EXPECTED_QUANTIZATION="${OLLAMA_EXPECTED_QUANTIZATION:-nvfp4}"
OLLAMA_EXPECTED_ARCHITECTURE="${OLLAMA_EXPECTED_ARCHITECTURE:-nemotron_h}"
OLLAMA_EXPECTED_NATIVE_CONTEXT="${OLLAMA_EXPECTED_NATIVE_CONTEXT:-262144}"
OLLAMA_MIN_VERSION="${OLLAMA_MIN_VERSION:-0.32.14}"
# MLX runner: held on 0.32.14 (root Makefile); the 0.40.3 default is unproven
# against its post-prefill memory runaway.
OLLAMA_RUNTIME_VERSION="${OLLAMA_RUNTIME_VERSION:-0.32.14}"
OLLAMA_CONTEXT_LENGTH="${OLLAMA_CONTEXT_LENGTH:-262144}"
OLLAMA_KV_CACHE_TYPE="${OLLAMA_KV_CACHE_TYPE:-mlx-native}"
OLLAMA_CAP_REASONING="${OLLAMA_CAP_REASONING:-required}"
OLLAMA_CAP_TOOLS="${OLLAMA_CAP_TOOLS:-required}"
OLLAMA_CAP_REASONING_MODE="${OLLAMA_CAP_REASONING_MODE:-think-true}"
OLLAMA_CAP_DISABLE_MODE="${OLLAMA_CAP_DISABLE_MODE:-think-false}"
OLLAMA_CAP_SYSTEM_PROMPT="${OLLAMA_CAP_SYSTEM_PROMPT:-}"

# AuditBench and audit fitness decode at the checkpoint's sampling, from the registry
# artifact's params layer.
OLLAMA_SAMPLING="${OLLAMA_SAMPLING:-temperature=1 top_p=0.95}"
