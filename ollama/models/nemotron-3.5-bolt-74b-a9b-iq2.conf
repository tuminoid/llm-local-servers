# Ollama model config for NVIDIA Nemotron 3.5 Bolt 74B-A9B, IQ2_XXS GGUF.
#
# NVIDIA's 24 GB Bolt (hybrid Mamba-2 + MoE, nemotron_h_moe) with its vision
# projector and a DFlash draft packaged in the tag (draft_num_predict 7). The
# tag requires 0.40.5 and llama.cpp b11669. Not on Apple Silicon: llama.cpp's
# Metal backend has no NVFP4 matmul (b11963), so its 80 NVFP4 tensors and
# its NVFP4 draft run on the CPU; the Apple Silicon profile is
# nemotron-3.5-bolt-74b-a9b-q3kxl. Retest when a vendored llama.cpp runs
# NVFP4 on Metal. It shares Super VL's renderer, so the same thinking
# controls.

OLLAMA_MODEL="${OLLAMA_MODEL:-nemotron-3.5-bolt:74b-a9b-iq2}"
OLLAMA_EXPECTED_DIGEST="${OLLAMA_EXPECTED_DIGEST:-d6d3deeca27134af015d1ab4d57ee655dd6d624dbef4f5dfd18f4b54f76bb554}"
OLLAMA_EXPECTED_FORMAT="${OLLAMA_EXPECTED_FORMAT:-gguf}"
OLLAMA_EXPECTED_QUANTIZATION="${OLLAMA_EXPECTED_QUANTIZATION:-IQ2_XXS}"
OLLAMA_EXPECTED_ARCHITECTURE="${OLLAMA_EXPECTED_ARCHITECTURE:-nemotron_h_moe}"
OLLAMA_EXPECTED_NATIVE_CONTEXT="${OLLAMA_EXPECTED_NATIVE_CONTEXT:-262144}"
OLLAMA_MIN_VERSION="${OLLAMA_MIN_VERSION:-0.40.5}"
OLLAMA_CONTEXT_LENGTH="${OLLAMA_CONTEXT_LENGTH:-262144}"
OLLAMA_KV_CACHE_TYPE="${OLLAMA_KV_CACHE_TYPE:-q8_0}"
OLLAMA_CAP_REASONING="${OLLAMA_CAP_REASONING:-required}"
OLLAMA_CAP_TOOLS="${OLLAMA_CAP_TOOLS:-required}"
OLLAMA_CAP_REASONING_MODE="${OLLAMA_CAP_REASONING_MODE:-think-true}"
OLLAMA_CAP_DISABLE_MODE="${OLLAMA_CAP_DISABLE_MODE:-think-false}"
OLLAMA_CAP_SYSTEM_PROMPT="${OLLAMA_CAP_SYSTEM_PROMPT:-}"
# The renderer defaults thinking off on the OpenAI-compatible path, as for
# Super VL.
OLLAMA_BENCH_REASONING_EFFORT="${OLLAMA_BENCH_REASONING_EFFORT:-high}"

# AuditBench and audit fitness decode at the checkpoint's sampling:
# generation_config.json at nvidia/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB
# a326822a, matching the tag's params layer.
OLLAMA_SAMPLING="${OLLAMA_SAMPLING:-temperature=1.0 top_p=0.95}"
