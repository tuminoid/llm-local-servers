# Ollama model config for Ornith 1.5 35B-A3B.
#
# The official ornith-1.5:35b artifact is a 20.22 GiB Q4_K_M GGUF plus a
# 0.84 GiB vision projector, a structural twin of Qwen3.6-35B-A3B
# (qwen35moe, 10 of 40 layers holding KV). Thinking follows think, and tool
# calls use the Qwen <tool_call><function=...> dialect. Ollama limits
# qwen35moe to one parallel request.
#
# Requires 0.40.1, the release it was first validated on (the manifest
# declares no minimum version); runs on the 0.40.3 default. The digest pin
# held across every 0.40.1 and 0.40.3 load on the A100 (2026-10-09/11).

OLLAMA_MODEL="${OLLAMA_MODEL:-ornith-1.5:35b}"
OLLAMA_EXPECTED_DIGEST="${OLLAMA_EXPECTED_DIGEST:-9f3b89b2521908dd2e6f7a11fa368e62c8f89e1075f22604e4d1a76dd1240fcc}"
OLLAMA_EXPECTED_FORMAT="${OLLAMA_EXPECTED_FORMAT:-gguf}"
OLLAMA_EXPECTED_QUANTIZATION="${OLLAMA_EXPECTED_QUANTIZATION:-Q4_K_M}"
OLLAMA_EXPECTED_ARCHITECTURE="${OLLAMA_EXPECTED_ARCHITECTURE:-qwen35moe}"
OLLAMA_EXPECTED_NATIVE_CONTEXT="${OLLAMA_EXPECTED_NATIVE_CONTEXT:-262144}"
OLLAMA_MIN_VERSION="${OLLAMA_MIN_VERSION:-0.40.1}"
OLLAMA_CONTEXT_LENGTH="${OLLAMA_CONTEXT_LENGTH:-262144}"
OLLAMA_KV_CACHE_TYPE="${OLLAMA_KV_CACHE_TYPE:-q8_0}"
OLLAMA_CAP_REASONING="${OLLAMA_CAP_REASONING:-required}"
OLLAMA_CAP_TOOLS="${OLLAMA_CAP_TOOLS:-required}"
OLLAMA_CAP_REASONING_MODE="${OLLAMA_CAP_REASONING_MODE:-think-true}"
OLLAMA_CAP_DISABLE_MODE="${OLLAMA_CAP_DISABLE_MODE:-think-false}"
OLLAMA_CAP_SYSTEM_PROMPT="${OLLAMA_CAP_SYSTEM_PROMPT:-}"

# AuditBench and audit fitness decode at the checkpoint's sampling, from
# generation_config.json of the base repo (the GGUF's general.sampling
# agrees).
OLLAMA_SAMPLING="${OLLAMA_SAMPLING:-temperature=1 top_p=0.95 top_k=20}"
