# Ollama MLX model config for Muse Glimmer 30B (Meta Superintelligence Labs).
#
# The muse-glimmer:30b-mlx registry artifact is safetensors NVFP4, so Ollama
# dispatches it to the MLX runner rather than llama.cpp. This profile pins the
# managed 0.32.14 MLX runner it is validated against.
#
# No near-ceiling proof run exists yet, and MLX maxima are measured per model
# rather than derived: treat the first full-context request as a supervised
# experiment.
#
# Reasoning strength is steered in the system prompt ("Reasoning strength:
# low", medium, high, or xhigh).
#
# TAG HISTORY: this tag has moved twice, `3d5c4b80e60b` -> `ef32a55b4976` ->
# `015fa21845be` (reviewed and pinned 2026-09-07 after a drift refusal caught
# it). The current manifest still packages the DFlash assistant model, which
# proves the draft ships and nothing about its speed. Its weights are ~3 GiB
# smaller than the previous digest's and residency fell with them, so no
# performance number carries across the move.
#
# GOTCHA: its schema-constrained responses leak raw channel markers
# (` to=user<|message|>`) into content, which the streaming path does not
# show. Watch for that behind any renderer that trusts content.

OLLAMA_MODEL="${OLLAMA_MODEL:-muse-glimmer:30b-mlx}"
OLLAMA_EXPECTED_DIGEST="${OLLAMA_EXPECTED_DIGEST:-015fa21845bead56096c2f8773aff7a2047063507fe82897e662ad544c5b2fa6}"
OLLAMA_EXPECTED_FORMAT="${OLLAMA_EXPECTED_FORMAT:-safetensors}"
OLLAMA_EXPECTED_QUANTIZATION="${OLLAMA_EXPECTED_QUANTIZATION:-nvfp4}"
OLLAMA_EXPECTED_ARCHITECTURE="${OLLAMA_EXPECTED_ARCHITECTURE:-muse_glimmer}"
OLLAMA_EXPECTED_NATIVE_CONTEXT="${OLLAMA_EXPECTED_NATIVE_CONTEXT:-131072}"
OLLAMA_MIN_VERSION="${OLLAMA_MIN_VERSION:-0.32.14}"
OLLAMA_CONTEXT_LENGTH="${OLLAMA_CONTEXT_LENGTH:-131072}"
OLLAMA_KV_CACHE_TYPE="${OLLAMA_KV_CACHE_TYPE:-mlx-native}"
# Decode-compliance control (AuditBench protocol): at default effort the model
# deliberates and declines the synthetic output-control workload; its
# documented effort control restores compliance. Benchmark-only setting.
OLLAMA_BENCH_SYSTEM_PROMPT="${OLLAMA_BENCH_SYSTEM_PROMPT:-Reasoning strength: low}"
OLLAMA_CAP_REASONING="${OLLAMA_CAP_REASONING:-required}"
OLLAMA_CAP_TOOLS="${OLLAMA_CAP_TOOLS:-required}"
OLLAMA_CAP_REASONING_MODE="${OLLAMA_CAP_REASONING_MODE:-default}"
# The vendor grades reasoning strength and documents no off switch, but the
# serving path has one: Ollama's `think: false` produces correct content with
# an empty reasoning field on this digest (checked live).
OLLAMA_CAP_DISABLE_MODE="${OLLAMA_CAP_DISABLE_MODE:-think-false}"
OLLAMA_CAP_SYSTEM_PROMPT="${OLLAMA_CAP_SYSTEM_PROMPT:-Reasoning strength: low}"
