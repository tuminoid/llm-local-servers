# Ollama MLX model config for Muse Glimmer 30B (Meta Superintelligence Labs).
#
# The muse-glimmer:30b-mlx registry artifact is safetensors NVFP4 (~21 GiB,
# 32.3B parameters including the vision tower), so Ollama dispatches it to the
# MLX runner rather than llama.cpp.
# Registry support entered official Ollama at 0.32.7/0.32.8; this profile
# pins the managed 0.32.14 MLX runner it is validated against.
#
# Native context is 131,072. The KV layout is cheap for a 30B dense model
# (52 layers in a Local/Local/Local/Global pattern with a 2048-token
# sliding window, GQA 32q/2kv, roughly 13 KiB/token for the global
# layers), so a full context adds only a few GiB over the weights. The MLX
# near-ceiling rule still applies: maxima are measured per model, never
# derived, and this profile has no near-ceiling proof run yet -- treat the
# first full-context request as a supervised experiment.
#
# The manifest declares completion, tools, vision, and thinking. Reasoning
# strength is steered in the system prompt ("Reasoning strength: low",
# medium, high, or xhigh). The reviewed 2026-08-25 manifest draws its tensors
# from the `30b-nvfp4-dflash` artifact and includes an assistant-model config.
# That proves the draft is packaged, not that it accelerates this workload;
# any DFlash speedup claim still needs matched measurements.

OLLAMA_MODEL="${OLLAMA_MODEL:-muse-glimmer:30b-mlx}"
OLLAMA_EXPECTED_DIGEST="${OLLAMA_EXPECTED_DIGEST:-ef32a55b4976faa955cbab0462d09bd081351ef5b87d73d8fcd299bf17c111d7}"
OLLAMA_EXPECTED_FORMAT="${OLLAMA_EXPECTED_FORMAT:-safetensors}"
OLLAMA_EXPECTED_QUANTIZATION="${OLLAMA_EXPECTED_QUANTIZATION:-nvfp4}"
OLLAMA_EXPECTED_ARCHITECTURE="${OLLAMA_EXPECTED_ARCHITECTURE:-muse_glimmer}"
OLLAMA_EXPECTED_NATIVE_CONTEXT="${OLLAMA_EXPECTED_NATIVE_CONTEXT:-131072}"
OLLAMA_MIN_VERSION="${OLLAMA_MIN_VERSION:-0.32.14}"
OLLAMA_CONTEXT_LENGTH="${OLLAMA_CONTEXT_LENGTH:-131072}"
OLLAMA_KV_CACHE_TYPE="${OLLAMA_KV_CACHE_TYPE:-mlx-native}"
# Decode-compliance control (AuditBench protocol): at default effort the model
# deliberates and declines the synthetic output-control workload; its
# documented effort control restores compliance. Benchmark-only setting.
OLLAMA_BENCH_SYSTEM_PROMPT="${OLLAMA_BENCH_SYSTEM_PROMPT:-Reasoning strength: low}"
OLLAMA_CAP_REASONING="${OLLAMA_CAP_REASONING:-required}"
OLLAMA_CAP_TOOLS="${OLLAMA_CAP_TOOLS:-required}"
OLLAMA_CAP_REASONING_MODE="${OLLAMA_CAP_REASONING_MODE:-default}"
OLLAMA_CAP_DISABLE_MODE="${OLLAMA_CAP_DISABLE_MODE:-none}"
OLLAMA_CAP_SYSTEM_PROMPT="${OLLAMA_CAP_SYSTEM_PROMPT:-Reasoning strength: low}"
