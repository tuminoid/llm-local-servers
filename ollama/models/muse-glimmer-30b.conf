# Ollama model config for Muse Glimmer 30B, GGUF.
#
# The default muse-glimmer:30b registry artifact is Q4_K_M GGUF (~17 GiB),
# so Ollama dispatches it to the llama.cpp runner -- a separate artifact
# from the safetensors muse-glimmer-30b-mlx profile, not an
# interchangeable quantization. Native context is 131,072; the checkpoint
# uses a Local/Local/Local/Global attention pattern with a 2048-token
# sliding window and 2 KV heads, so per-slot KV is small if the runner
# implements the window and ~52 KiB/token if it does not.
#
# This profile exists to answer the concurrency question the MLX runner
# cannot: whether the llama.cpp path gives Muse Glimmer real parallel
# slots or the architecture is slot-forced like Ollama's Qwen3.5/3.6
# families. Verify overlap with concurrent requests before claiming
# parallelism; queueing staircases are not concurrency.

OLLAMA_MODEL="${OLLAMA_MODEL:-muse-glimmer:30b}"
OLLAMA_EXPECTED_DIGEST="${OLLAMA_EXPECTED_DIGEST:-de878ce33ad81d060001db1469a02eebe4d86f0ad58cfe52dc062fdcbe4464c1}"
OLLAMA_EXPECTED_FORMAT="${OLLAMA_EXPECTED_FORMAT:-gguf}"
OLLAMA_EXPECTED_QUANTIZATION="${OLLAMA_EXPECTED_QUANTIZATION:-Q4_K_M}"
OLLAMA_EXPECTED_ARCHITECTURE="${OLLAMA_EXPECTED_ARCHITECTURE:-muse-glimmer}"
OLLAMA_EXPECTED_NATIVE_CONTEXT="${OLLAMA_EXPECTED_NATIVE_CONTEXT:-131072}"
OLLAMA_MIN_VERSION="${OLLAMA_MIN_VERSION:-0.32.14}"
OLLAMA_CONTEXT_LENGTH="${OLLAMA_CONTEXT_LENGTH:-131072}"
OLLAMA_KV_CACHE_TYPE="${OLLAMA_KV_CACHE_TYPE:-q8_0}"
# Decode-compliance control (AuditBench protocol): same weights and refusal
# behavior as the MLX profile; see that config's note. Benchmark-only setting.
OLLAMA_BENCH_SYSTEM_PROMPT="${OLLAMA_BENCH_SYSTEM_PROMPT:-Reasoning strength: low}"
OLLAMA_CAP_REASONING="${OLLAMA_CAP_REASONING:-required}"
OLLAMA_CAP_TOOLS="${OLLAMA_CAP_TOOLS:-required}"
OLLAMA_CAP_REASONING_MODE="${OLLAMA_CAP_REASONING_MODE:-default}"
# Kept at `none` because this pairing is unchecked. Its MLX sibling proved
# on 2026-09-07 that Ollama's `think: false` disables reasoning on this
# model family, so try `think-false` first when the RTX host runs its
# campaign, and repin this expectation if it holds here too.
OLLAMA_CAP_DISABLE_MODE="${OLLAMA_CAP_DISABLE_MODE:-none}"
OLLAMA_CAP_SYSTEM_PROMPT="${OLLAMA_CAP_SYSTEM_PROMPT:-Reasoning strength: low}"
