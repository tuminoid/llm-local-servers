# Ollama model config for LiquidAI LFM2.5-24B-A2B.
#
# unsloth/LFM2.5-24B-A2B-GGUF at revision
# faa77113e93335b63423e9e8d33395f86eaf8946: LFM2.5-24B-A2B-UD-IQ3_XXS.gguf
# (8,959,328,480 bytes, sha256
# e06694b1f0bb322ecfde6bf9af260d2f2047ed1b30bbfdd04d97bf55472bfeec; Ollama
# labels the file type Q4_K_S). 24B total, 2.45B active; 40 layers, 30
# short convolution and 10 GQA (8 KV heads of 64), so KV costs 20 KiB/token
# at f16. Native 131,072.
#
# LOCALLY IMPORTED, not a registry pull. `ollama create` from a directory
# holding the real file and a Modelfile of:
#   FROM ./LFM2.5-24B-A2B-UD-IQ3_XXS.gguf
#   RENDERER lfm2
#   PARSER lfm2-thinking
# the renderer and parser the registry's lfm2.5:8b declares for the same
# lfm2moe architecture.
#
# Sized to run entirely on the RTX PRO 3000's 12 GiB. At 131,072 with f16
# KV (2,560 MiB) and a 205 MiB compute buffer, llama.cpp projects 11,301
# MiB against 11,594 free under the launcher's 256 MiB fit target for a GPU
# without a display, and /api/ps reports all 11,850,911,579 bytes on the
# GPU; a 126,532-token prompt prefilled there at 1,427 tok/s (2026-10-14).
# The UD-Q3_K_XL (10,947,100,928 bytes) keeps 0.4 to 2.2 GB of experts on
# the CPU at 131,072 with any KV type.
#
# It always reasons (the template opens <think> on every assistant turn);
# the card documents no control to turn that off. It fails Capability Check
# v2 audit fitness: an interactive profile, not an audit one.
#
# The digest is the local import's manifest blob (manifests-v2/).

OLLAMA_MODEL="${OLLAMA_MODEL:-lfm2.5:24b-a2b-iq3xxs}"
OLLAMA_EXPECTED_DIGEST="${OLLAMA_EXPECTED_DIGEST:-d4220f26c6ddf75ca1c67ab1eb5738bcd8a61fd37be0cad11a024bb7b6de8d43}"
OLLAMA_EXPECTED_FORMAT="${OLLAMA_EXPECTED_FORMAT:-gguf}"
OLLAMA_EXPECTED_QUANTIZATION="${OLLAMA_EXPECTED_QUANTIZATION:-Q4_K_S}"
OLLAMA_EXPECTED_ARCHITECTURE="${OLLAMA_EXPECTED_ARCHITECTURE:-lfm2moe}"
OLLAMA_EXPECTED_NATIVE_CONTEXT="${OLLAMA_EXPECTED_NATIVE_CONTEXT:-131072}"
OLLAMA_MIN_VERSION="${OLLAMA_MIN_VERSION:-0.40.3}"
OLLAMA_CONTEXT_LENGTH="${OLLAMA_CONTEXT_LENGTH:-131072}"
OLLAMA_KV_CACHE_TYPE="${OLLAMA_KV_CACHE_TYPE:-f16}"
OLLAMA_LOCAL_IMPORT="${OLLAMA_LOCAL_IMPORT:-1}"
OLLAMA_CAP_REASONING="${OLLAMA_CAP_REASONING:-required}"
OLLAMA_CAP_TOOLS="${OLLAMA_CAP_TOOLS:-required}"
OLLAMA_CAP_REASONING_MODE="${OLLAMA_CAP_REASONING_MODE:-think-true}"
OLLAMA_CAP_DISABLE_MODE="${OLLAMA_CAP_DISABLE_MODE:-none}"
OLLAMA_CAP_SYSTEM_PROMPT="${OLLAMA_CAP_SYSTEM_PROMPT:-}"

# AuditBench and audit fitness decode at the checkpoint's
# generation_config.json (LiquidAI/LFM2.5-24B-A2B at 1769516a).
OLLAMA_SAMPLING="${OLLAMA_SAMPLING:-temperature=0.1 top_k=50 repetition_penalty=1.05}"
