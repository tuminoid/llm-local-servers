# Ollama GGUF model config for Xiaomi MiMo-V2.6-Flash-MOPD, Q2_K_S.
#
# 309B total, 15B active MoE (256 experts, 8 routed). 48 layers: 39
# sliding-window (128 tokens) and 9 global, so only the global layers grow
# with depth: 4 KV heads, K 192 and V 128 wide, about 5.6 GiB at 262,144 in
# f16. Native 1,048,576. MIT. MOPD is the release after the RL checkpoint
# (multi-teacher on-policy distillation on top of it).
#
# LOCAL `ollama create` import, never a registry pull (the library has no
# MiMo-V2.6). llama.cpp's native mimo2 architecture runs no repo code. The
# GGUF's own Jinja template carries <think> and enable_thinking, and
# re-renders every assistant turn's reasoning_content.
#
# IMPORT RECIPE: the two Q2_K_S shards of ggml-org/MiMo-V2.6-Flash-MOPD-GGUF
# at revision 0522c706471508d8b7e36ae7040922563c477358, LFS SHA-256s
# verified, staged as real files in a home-directory dir, then `ollama
# create` from a Modelfile of FROM <dir>.
#
# 98.6 GiB of weights: on the 128 GB M5 the 262,144 context fits only with
# q8_0 KV and the host prompt cache off (below).

OLLAMA_MODEL="${OLLAMA_MODEL:-mimo-v2.6-flash:q2_k_s}"
OLLAMA_EXPECTED_DIGEST="${OLLAMA_EXPECTED_DIGEST:-aecb7b7e21a433681c8f3be361634e2cd75819ddc413a6132269572c81364709}"
OLLAMA_EXPECTED_FORMAT="${OLLAMA_EXPECTED_FORMAT:-gguf}"
# ggml-org names the file Q2_K_S (98.6 GiB, about 2.7 bits per weight), but
# its GGUF file_type reads MXFP4_MOE, which is what Ollama reports.
OLLAMA_EXPECTED_QUANTIZATION="${OLLAMA_EXPECTED_QUANTIZATION:-MXFP4_MOE}"
OLLAMA_EXPECTED_ARCHITECTURE="${OLLAMA_EXPECTED_ARCHITECTURE:-mimo2}"
OLLAMA_EXPECTED_NATIVE_CONTEXT="${OLLAMA_EXPECTED_NATIVE_CONTEXT:-1048576}"
OLLAMA_MIN_VERSION="${OLLAMA_MIN_VERSION:-0.40.8}"
OLLAMA_CONTEXT_LENGTH="${OLLAMA_CONTEXT_LENGTH:-262144}"
# q8_0, not f16: with the prompt cache off, the f16 session still ran out
# of room on the M5, available memory falling from 7.9 to 3.7 GiB as the
# conversation grew to 148k (2026-10-26). q8_0 returns 2.7 of the ~5.6 GiB
# of global-layer KV; audit fitness passed 12 of 12 at both.
OLLAMA_KV_CACHE_TYPE="${OLLAMA_KV_CACHE_TYPE:-q8_0}"
# llama-server's host-RAM prompt cache off. At the default 8 GiB it copies a
# finished prompt's state into the same unified memory the 99 GiB of
# weights leave 6-9 GiB of: 5,427 MiB after a 245,747-token prompt and
# 1,965 MiB after a 167,064-token session (2026-10-25), each tripping the
# 4 GiB floor. The cost is a full prefill when another conversation took
# the slot in between.
OLLAMA_CACHE_RAM="${OLLAMA_CACHE_RAM:-0}"
OLLAMA_LOCAL_IMPORT="${OLLAMA_LOCAL_IMPORT:-1}"
OLLAMA_CAP_REASONING="${OLLAMA_CAP_REASONING:-required}"
OLLAMA_CAP_TOOLS="${OLLAMA_CAP_TOOLS:-required}"
OLLAMA_CAP_REASONING_MODE="${OLLAMA_CAP_REASONING_MODE:-think-true}"
OLLAMA_CAP_DISABLE_MODE="${OLLAMA_CAP_DISABLE_MODE:-think-false}"
OLLAMA_CAP_SYSTEM_PROMPT="${OLLAMA_CAP_SYSTEM_PROMPT:-}"

# The template re-renders past reasoning, so the history carries it back.
OLLAMA_PRESERVE_REASONING="${OLLAMA_PRESERVE_REASONING:-1}"

# generation_config.json at the source checkpoint: temperature 1.0, top_p
# 0.95, matching the model card.
OLLAMA_SAMPLING="${OLLAMA_SAMPLING:-temperature=1.0 top_p=0.95}"
