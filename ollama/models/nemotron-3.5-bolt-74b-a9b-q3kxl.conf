# Ollama model config for NVIDIA Nemotron 3.5 Bolt 74B-A9B, Unsloth
# UD-Q3_K_XL GGUF, for Apple Silicon.
#
# unsloth/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-GGUF at revision
# 34841e360524d421c564cc3ed247aa04a865473b:
# NVIDIA-Nemotron-3.5-Bolt-74B-A9B-UD-Q3_K_XL.gguf (39,027,158,016 bytes,
# sha256 51077d511c769efb299073cc7b33d31bb007eb4fdaed60938dc1133146b708e3).
# Its tensors are q8_0, q6_K, q5_K, q4_K, iq4_xs, iq3_s and iq3_xxs, all
# of which llama.cpp's Metal backend runs (all 89 layers on the GPU, Ollama
# labels the file type Q3_K_M). The registry tag
# (nemotron-3.5-bolt-74b-a9b-iq2.conf) carries NVFP4 tensors that Metal
# refuses, and they run on the CPU; unsloth's DFlash draft is NVFP4 too, so
# this profile has no draft.
#
# LOCALLY IMPORTED, not a registry pull. `ollama create` from a directory
# holding the real file and a Modelfile of:
#   FROM ./NVIDIA-Nemotron-3.5-Bolt-74B-A9B-UD-Q3_K_XL.gguf
#   RENDERER nemotron-3.5-super
#   PARSER nemotron-3-nano
#   PARAMETER temperature 1
#   PARAMETER top_p 0.95
# the renderer, parser and params of the registry tag.
#
# The digest is the local import's manifest blob (manifests-v2/).

OLLAMA_MODEL="${OLLAMA_MODEL:-nemotron-3.5-bolt:74b-a9b-q3kxl}"
OLLAMA_EXPECTED_DIGEST="${OLLAMA_EXPECTED_DIGEST:-bdeed349c1c2a9407439d562614bdb9ceb835ca61e0f20a3422bfd773133a653}"
OLLAMA_EXPECTED_FORMAT="${OLLAMA_EXPECTED_FORMAT:-gguf}"
OLLAMA_EXPECTED_QUANTIZATION="${OLLAMA_EXPECTED_QUANTIZATION:-Q3_K_M}"
OLLAMA_EXPECTED_ARCHITECTURE="${OLLAMA_EXPECTED_ARCHITECTURE:-nemotron_h_moe}"
OLLAMA_EXPECTED_NATIVE_CONTEXT="${OLLAMA_EXPECTED_NATIVE_CONTEXT:-262144}"
OLLAMA_MIN_VERSION="${OLLAMA_MIN_VERSION:-0.40.12}"
OLLAMA_CONTEXT_LENGTH="${OLLAMA_CONTEXT_LENGTH:-262144}"
OLLAMA_KV_CACHE_TYPE="${OLLAMA_KV_CACHE_TYPE:-q8_0}"
OLLAMA_LOCAL_IMPORT="${OLLAMA_LOCAL_IMPORT:-1}"
OLLAMA_CAP_REASONING="${OLLAMA_CAP_REASONING:-required}"
OLLAMA_CAP_TOOLS="${OLLAMA_CAP_TOOLS:-required}"
OLLAMA_CAP_REASONING_MODE="${OLLAMA_CAP_REASONING_MODE:-think-true}"
OLLAMA_CAP_DISABLE_MODE="${OLLAMA_CAP_DISABLE_MODE:-think-false}"
OLLAMA_CAP_SYSTEM_PROMPT="${OLLAMA_CAP_SYSTEM_PROMPT:-}"
# The renderer defaults thinking off on the OpenAI-compatible path, as for
# Super VL.
OLLAMA_BENCH_REASONING_EFFORT="${OLLAMA_BENCH_REASONING_EFFORT:-high}"

# AuditBench and audit fitness decode at the checkpoint's sampling:
# generation_config.json at nvidia/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB
# a326822a, matching the tag's params layer.
OLLAMA_SAMPLING="${OLLAMA_SAMPLING:-temperature=1.0 top_p=0.95}"
