# Ollama GGUF model config for Nanbeige4.3-33B, Q4_K_M.
#
# Dense 33B on the plain Llama architecture: 52 layers, 8 KV heads of 128,
# so KV grows 208 KiB per token in f16, about 52 GiB at 262,144. Native
# 524,288. Apache-2.0. A reasoning model aimed at agentic coding.
#
# LOCAL `ollama create` import, never a registry pull (the library has no
# Nanbeige). The GGUF's own Jinja template carries <think>, enable_thinking
# and preserve_thinking (unset keeps every turn's reasoning) and the
# Qwen3-Coder-style XML <tool_call> format.
#
# IMPORT RECIPE: Nanbeige_Nanbeige4.3-33B-Q4_K_M.gguf of
# bartowski/Nanbeige_Nanbeige4.3-33B-GGUF (imatrix, llama.cpp b11845) at
# revision 9beb68421fdf7be095093a6888325fa2c83ddd38, LFS SHA-256 verified,
# staged as a real file in a home-directory dir, then `ollama create` from a
# Modelfile of FROM <dir>.
#
# The A100 serves this model on vLLM (W4A16); this GGUF profile is the M5's
# route, where vLLM-Metal's MLX 4-bit build decoded about a third as fast
# and failed audit fitness on malformed tool arguments (2026-10-26).

OLLAMA_MODEL="${OLLAMA_MODEL:-nanbeige4.3:33b-q4_k_m}"
OLLAMA_EXPECTED_DIGEST="${OLLAMA_EXPECTED_DIGEST:-f630b1711fd6dd31209acc83efd4e5f9967721d836630aa416908eb5e6c18ef0}"
OLLAMA_EXPECTED_FORMAT="${OLLAMA_EXPECTED_FORMAT:-gguf}"
OLLAMA_EXPECTED_QUANTIZATION="${OLLAMA_EXPECTED_QUANTIZATION:-Q4_K_M}"
OLLAMA_EXPECTED_ARCHITECTURE="${OLLAMA_EXPECTED_ARCHITECTURE:-llama}"
OLLAMA_EXPECTED_NATIVE_CONTEXT="${OLLAMA_EXPECTED_NATIVE_CONTEXT:-524288}"
OLLAMA_MIN_VERSION="${OLLAMA_MIN_VERSION:-0.40.8}"
OLLAMA_CONTEXT_LENGTH="${OLLAMA_CONTEXT_LENGTH:-262144}"
OLLAMA_KV_CACHE_TYPE="${OLLAMA_KV_CACHE_TYPE:-f16}"
OLLAMA_LOCAL_IMPORT="${OLLAMA_LOCAL_IMPORT:-1}"
OLLAMA_CAP_REASONING="${OLLAMA_CAP_REASONING:-required}"
OLLAMA_CAP_TOOLS="${OLLAMA_CAP_TOOLS:-required}"
OLLAMA_CAP_REASONING_MODE="${OLLAMA_CAP_REASONING_MODE:-think-true}"
OLLAMA_CAP_DISABLE_MODE="${OLLAMA_CAP_DISABLE_MODE:-think-false}"
OLLAMA_CAP_SYSTEM_PROMPT="${OLLAMA_CAP_SYSTEM_PROMPT:-}"

# The template keeps past reasoning unless preserve_thinking is false, and
# the card recommends keeping it for multi-turn tool use.
OLLAMA_PRESERVE_REASONING="${OLLAMA_PRESERVE_REASONING:-1}"
# Ollama's llama-server path drops a history message's reasoning field: a
# probe (2026-10-26) rendered the same history at 86 prompt tokens with or
# without reasoning and 506 with it inline, and with the empty think block
# the model returned an empty answer. The template splits content on </think>.
OLLAMA_REASONING_INLINE="${OLLAMA_REASONING_INLINE:-1}"

# The repo's generation_config.json carries no sampling; the model card's
# agentic and tool-use settings.
OLLAMA_SAMPLING="${OLLAMA_SAMPLING:-temperature=1.0 top_p=0.95}"
