# Ollama model config for Underdog Saluki 27B 1.0.
#
# ConwayResearch/Underdog-Saluki-27B-1.0 at revision
# 4f60eba09f4b6db63c72915d328d97e1d93edb8c: a 2-bit GSQ-RCO mixed-precision
# GGUF of Qwen3.8-27B (Underdog-Saluki-27B-1.0-IQ2-mix.gguf, 7,898,369,152
# bytes, sha256 4a673518b11b1c4445f9b9a9d3c40356f5ba39f6a6260dcb25f3fbfd475d9efb;
# standard llama.cpp quant types IQ1-IQ4, Q2_K, Q4_K, Q8_0). Text only here;
# the mmproj add-ons are not imported.
#
# LOCALLY IMPORTED, not a registry pull. `ollama create` from a directory
# holding the real file and a Modelfile of:
#   FROM ./Underdog-Saluki-27B-1.0-IQ2-mix.gguf
#   RENDERER qwen3.8
#   PARSER qwen3.5
# the renderer and parser the registry's qwen3.8:27b declares for the same
# architecture.
#
# Sized to run entirely on the RTX PRO 3000's 12 GiB: 16 of 64 layers hold
# KV (full attention every fourth), 4 KV heads of 256, so q4_0 KV costs about
# 18 KiB/token. At 163,840 the weights (7,257 MiB), KV (2,880 MiB) and
# compute buffer (880 MiB) keep 65/65 layers on the GPU under the
# launcher's 256 MiB fit target for a GPU without a display; a 159,769-token
# prompt prefilled there at 294 tok/s (2026-10-12). 184,320 keeps at most
# 62/65 (num_batch 256 included), and its layers on the CPU cut late-session
# decode to about 8 tok/s; at 1024 MiB even 131,072 loses its output layer.
#
# The digest is the local import's manifest blob (manifests-v2/).

OLLAMA_MODEL="${OLLAMA_MODEL:-saluki:27b-iq2mix}"
OLLAMA_EXPECTED_DIGEST="${OLLAMA_EXPECTED_DIGEST:-4868fcc0efd98b2e5f6be4a494b883707916cae81a27418032f133a9d6b8ce5a}"
OLLAMA_EXPECTED_FORMAT="${OLLAMA_EXPECTED_FORMAT:-gguf}"
OLLAMA_EXPECTED_ARCHITECTURE="${OLLAMA_EXPECTED_ARCHITECTURE:-qwen35}"
OLLAMA_EXPECTED_NATIVE_CONTEXT="${OLLAMA_EXPECTED_NATIVE_CONTEXT:-262144}"
OLLAMA_MIN_VERSION="${OLLAMA_MIN_VERSION:-0.40.3}"
OLLAMA_CONTEXT_LENGTH="${OLLAMA_CONTEXT_LENGTH:-163840}"
OLLAMA_KV_CACHE_TYPE="${OLLAMA_KV_CACHE_TYPE:-q4_0}"
OLLAMA_LOCAL_IMPORT="${OLLAMA_LOCAL_IMPORT:-1}"
OLLAMA_CAP_REASONING="${OLLAMA_CAP_REASONING:-required}"
OLLAMA_CAP_TOOLS="${OLLAMA_CAP_TOOLS:-required}"
OLLAMA_CAP_REASONING_MODE="${OLLAMA_CAP_REASONING_MODE:-think-true}"
OLLAMA_CAP_DISABLE_MODE="${OLLAMA_CAP_DISABLE_MODE:-think-false}"
OLLAMA_CAP_SYSTEM_PROMPT="${OLLAMA_CAP_SYSTEM_PROMPT:-}"

# AuditBench and audit fitness decode at the model card's thinking-mode
# setting (the repo ships no generation_config.json; the GGUF's
# general.sampling carries the base model's temperature 1.0).
OLLAMA_SAMPLING="${OLLAMA_SAMPLING:-temperature=0.6 top_p=0.95 top_k=20}"
