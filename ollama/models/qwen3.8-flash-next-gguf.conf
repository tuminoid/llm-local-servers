# Ollama GGUF model config for Qwen3.8-Flash-Next (125B-A6B), UD-Q4_K_XL.
#
# LOCALLY IMPORTED artifact, not a registry pull: the four UD-Q4_K_XL
# shards of unsloth/Qwen3.8-Flash-Next-GGUF at revision
# c8b5954a88c2775c546b92593eda40ea041d3176 (per-shard LFS SHA-256s
# reviewed at download), imported with `ollama create` from a directory
# of REAL files (the HF snapshot symlinks are refused as insecure
# paths; APFS-clone the shards out first) and a Modelfile of:
#   FROM <staging dir>
#   PARAMETER use_mmap false
# The server merges the split into one 103.7 GiB blob; use_mmap=false
# is REQUIRED (the shipped shard layout otherwise wires the 26.8 GiB
# n-gram PLE table with the GPU buffers) and maps to the runner's
# --load-mode none. After any split-GGUF import, delete the orphaned
# shard-upload blobs the create leaves behind (~99 GB, unreferenced by
# any manifest). A sibling tag ud-q4kxl-vision adds the mmproj
# projector (0.84 GiB, layer blob shared) for image input; it has no
# audit role.
#
# RUNTIME SPLIT: qwen4exp needs the vendored llama.cpp b10760 that
# ships in Ollama 0.33.3; the fleet default pin stays 0.32.14 pending
# the MLX-runner post-prefill commit runaway retest. GGUF manifests
# dispatch to the llama.cpp runner, never the MLX runner, so this
# profile is unaffected by that runaway (verified: repeated distinct
# near-ceiling prefills on one process, identical rates, zero
# retention drift). OLLAMA_RUNTIME_VERSION below selects the 0.33.3
# managed runtime for this profile only; reviewed 0.33.3 archive
# digests are recorded beside the fleet pin in the root Makefile.
#
# OPERATING POINT (measured 2026-09-04, M5 Max 128 GiB): two full
# native-context slots at q8_0 KV. Weights load fully GPU-resident
# (49/49 layers, ~81 GiB wired); q8 KV for the 2 x 262,144 aggregate
# is ~9.0 GiB and the host idles at 21-24 GiB available. f16 KV at the
# same shape leaves only 10-14 GiB available and grazed an 8 GiB
# memory-watchdog floor under conversation transients -- q8_0 is the
# serving default, gated by needle-exact retrieval at 131k and 246k at
# rate parity with f16 (prefill 437/356 tok/s, decode 19.6/12.9 at
# those depths). Near-ceiling proof: 245,941-token needle prefills,
# repeated, exact. Three 262,144 slots also allocate and batch
# (1.82x aggregate) if a third deep stream is ever worth its latency.
#
# Concurrency semantics: qwen4exp carries no one-slot architecture
# guard; two-stream decode batching is real (1.53x aggregate). Cold
# DEEP prefills serialize across slots (no aggregate loss), and a
# slot's decode starves while the other slot runs a deep cold fill --
# batch shapes fine, interactivity beside a cold 246k fill is not.
# The llama.cpp slot cache gives 36x identical-prefix resend and
# suffix-only prefill on growing conversations (turn walls 13-29 s
# across a 147k 15-turn chain).
#
# Model behavior notes: the GGUF ships no MTP head (no speculation on
# this path) and no YaRN knob is reachable through Ollama (native
# 262,144 only). JSON-SCHEMA format enforcement works (verified
# "enforced" by Capability Check v1), but the bare `format: "json"`
# mode measured unenforced (returned fenced JSON) -- use a schema or
# prompt for JSON. Deep-conversation verdict prompts should be pointed
# or run with thinking on: a vague "final verdict" with thinking off
# declined to retrieve turn-1 facts that a pointed question retrieved
# exactly.
#
# Capability Check v1 PASSED 2026-09-04 (all seven checks, schema
# enforcement verified) on this digest at this operating point.
# Canonical AuditBench remains owed; the figures above are supervised
# probe evidence, not canonical rates.

OLLAMA_MODEL="${OLLAMA_MODEL:-qwen3.8-flash-next:ud-q4kxl}"
OLLAMA_EXPECTED_DIGEST="${OLLAMA_EXPECTED_DIGEST:-e6ead30bcebd70f8b388a601d3370d58d2aed85e31e2f8eff9ab64f4e6052363}"
