# Ollama GGUF model config for Qwen3.8-Flash-Next (125B-A6B), UD-Q4_K_XL.
#
# LOCALLY IMPORTED, not a registry pull. Import the four UD-Q4_K_XL
# shards of unsloth/Qwen3.8-Flash-Next-GGUF at revision
# c8b5954a88c2775c546b92593eda40ea041d3176 with `ollama create` from a
# directory of REAL files (HF snapshot symlinks are refused as insecure
# paths -- APFS-clone the shards out first) and a Modelfile of:
#   FROM <staging dir>
#   PARAMETER use_mmap false
# use_mmap=false is REQUIRED: the shipped shard layout otherwise wires
# the 26.8 GiB n-gram PLE table with the GPU buffers (maps to runner
# --load-mode none). After any split-GGUF import, delete the orphaned
# shard-upload blobs create leaves behind (~99 GB, unreferenced). The
# sibling ud-q4kxl-vision tag adds an mmproj projector; no audit role.
#
# RUNTIME 0.34.2 (GGUF runtime, root Makefile); qwen4exp needs a vendored
# llama.cpp at or past b10760, hence OLLAMA_MIN_VERSION 0.33.3.
#
# DEFECT (0.33.3 and 0.34.2; retest on a release whose parsers degrade
# truncation gracefully): a cap-truncated tool call returns HTTP 500
# ("unexpected end of JSON input"). Repro at temp 0: tools + max_tokens 32.
# Blocks the replay and replay-concurrent profiles.
#
# JSON output: JSON-SCHEMA format enforcement works (verified enforced),
# but bare `format: "json"` measured UNENFORCED (returned fenced JSON)
# -- use a schema or prompt for JSON. Deep-conversation verdict prompts
# should be pointed or run with thinking on: a vague "final verdict"
# with thinking off declined to retrieve turn-1 facts a pointed question
# retrieved exactly.
#
# No MTP head (no speculation) and no YaRN knob reachable through Ollama
# (native 262,144 only). Operating point and rates in BENCHMARKS.md.

OLLAMA_MODEL="${OLLAMA_MODEL:-qwen3.8-flash-next:ud-q4kxl}"
OLLAMA_EXPECTED_DIGEST="${OLLAMA_EXPECTED_DIGEST:-e6ead30bcebd70f8b388a601d3370d58d2aed85e31e2f8eff9ab64f4e6052363}"
OLLAMA_EXPECTED_FORMAT="${OLLAMA_EXPECTED_FORMAT:-gguf}"
OLLAMA_EXPECTED_QUANTIZATION="${OLLAMA_EXPECTED_QUANTIZATION:-Q4_K_M}"
OLLAMA_EXPECTED_ARCHITECTURE="${OLLAMA_EXPECTED_ARCHITECTURE:-qwen4exp}"
OLLAMA_EXPECTED_NATIVE_CONTEXT="${OLLAMA_EXPECTED_NATIVE_CONTEXT:-262144}"
OLLAMA_MIN_VERSION="${OLLAMA_MIN_VERSION:-0.33.3}"
OLLAMA_RUNTIME_VERSION="${OLLAMA_RUNTIME_VERSION:-0.34.2}"
OLLAMA_CONTEXT_LENGTH="${OLLAMA_CONTEXT_LENGTH:-262144}"
OLLAMA_NUM_PARALLEL="${OLLAMA_NUM_PARALLEL:-2}"
OLLAMA_KV_CACHE_TYPE="${OLLAMA_KV_CACHE_TYPE:-q8_0}"
OLLAMA_LOCAL_IMPORT="${OLLAMA_LOCAL_IMPORT:-1}"
OLLAMA_CAP_REASONING="${OLLAMA_CAP_REASONING:-required}"
OLLAMA_CAP_TOOLS="${OLLAMA_CAP_TOOLS:-required}"
OLLAMA_CAP_REASONING_MODE="${OLLAMA_CAP_REASONING_MODE:-think-true}"
OLLAMA_CAP_DISABLE_MODE="${OLLAMA_CAP_DISABLE_MODE:-think-false}"
OLLAMA_CAP_SYSTEM_PROMPT="${OLLAMA_CAP_SYSTEM_PROMPT:-}"

# AuditBench decodes at the checkpoint's sampling, from the
# Qwen3.8-Flash-Next card's thinking-mode setting (the local import's
# Modelfile sets no sampling).
OLLAMA_SAMPLING="${OLLAMA_SAMPLING:-temperature=1.0 top_p=0.95 top_k=20}"
