# Ollama MLX model config for Qwen3.6 35B-A3B (base model, NVFP4).
#
# The qwen3.6:35b-a3b-nvfp4 registry artifact is safetensors NVFP4, so
# Ollama dispatches it to the MLX runner. This is the BASE model on the
# same runtime and quantization as the coding variant in
# qwen3.6-35b-a3b-coding-mlx-nvfp4.conf; the pair exists to measure what
# the coding fine-tune costs or buys (thinking quality, audit behavior)
# with everything else held equal.
#
# Native context is 262,144, but the launch default is 131,072: the
# coding sibling's current manifest hard-reset the host on 2026-08-26
# during a 131k prefill at the 262,144 operating point (see its conf),
# which retired the idea that its old 246k proof informally covers this
# artifact.
#
# PER-DIGEST PROOF at 131,072 (2026-08-26, digest e92a3e94..., supervised
# with a memory watchdog): a 127,975-token needle prefill (97.6% of the
# allocation) completed cleanly -- needle retrieved, peak residency
# 26.6 GiB, memory pressure normal throughout. Indicative rates (MagSafe
# 140 W, not canonical): prefill 1,632 tok/s and decode 58.6 tok/s at
# that depth. KV growth measured ~37 KiB/token. The 262,144 operating
# point stays BANNED: the coding sibling's crash was reproduced under a
# watchdog and traced to repeated distinct deep prefills under the
# 262,144 allocation (runaway ~17 GiB/0.5 s on the third; see its conf
# and BENCHMARKS.md), and BOTH NVFP4 tags share the identical config
# blob, so the mechanism applies here too. Never raise the default
# without a new supervised per-digest proof at that allocation.
#
# Identity expectations below were read from the pulled 2026-08-25
# manifest and `ollama show` on the managed 0.32.14 runtime.

OLLAMA_MODEL="${OLLAMA_MODEL:-qwen3.6:35b-a3b-nvfp4}"
OLLAMA_EXPECTED_DIGEST="${OLLAMA_EXPECTED_DIGEST:-e92a3e94bbca90a85491dc34e9257bfee2318cedaa16360828c4d8edf14295b9}"
OLLAMA_EXPECTED_FORMAT="${OLLAMA_EXPECTED_FORMAT:-safetensors}"
OLLAMA_EXPECTED_QUANTIZATION="${OLLAMA_EXPECTED_QUANTIZATION:-nvfp4}"
OLLAMA_EXPECTED_ARCHITECTURE="${OLLAMA_EXPECTED_ARCHITECTURE:-qwen3_5_moe}"
OLLAMA_EXPECTED_NATIVE_CONTEXT="${OLLAMA_EXPECTED_NATIVE_CONTEXT:-262144}"
OLLAMA_MIN_VERSION="${OLLAMA_MIN_VERSION:-0.32.14}"
OLLAMA_CONTEXT_LENGTH="${OLLAMA_CONTEXT_LENGTH:-131072}"
OLLAMA_KV_CACHE_TYPE="${OLLAMA_KV_CACHE_TYPE:-mlx-native}"
OLLAMA_CAP_REASONING="${OLLAMA_CAP_REASONING:-required}"
OLLAMA_CAP_TOOLS="${OLLAMA_CAP_TOOLS:-required}"
OLLAMA_CAP_REASONING_MODE="${OLLAMA_CAP_REASONING_MODE:-think-true}"
OLLAMA_CAP_DISABLE_MODE="${OLLAMA_CAP_DISABLE_MODE:-think-false}"
OLLAMA_CAP_SYSTEM_PROMPT="${OLLAMA_CAP_SYSTEM_PROMPT:-}"
