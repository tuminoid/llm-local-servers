# Ollama model config for GLM-4.7-Flash 30B-A3B.
#
# The official glm-4.7-flash artifact requires Ollama 0.15.0 and exposes a
# 202,752-token context. The minimum is from the reviewed registry manifest
# config on 2026-08-25. This measured A100 profile matches the vLLM
# glm4.7-flash-awq request limit.

OLLAMA_MODEL="${OLLAMA_MODEL:-glm-4.7-flash}"
OLLAMA_EXPECTED_DIGEST="${OLLAMA_EXPECTED_DIGEST:-4475827791a269b02c8ec49b1c3bc1abb5846bacf3fae015b75d33986322d8f6}"
OLLAMA_EXPECTED_FORMAT="${OLLAMA_EXPECTED_FORMAT:-gguf}"
OLLAMA_EXPECTED_QUANTIZATION="${OLLAMA_EXPECTED_QUANTIZATION:-Q4_K_M}"
OLLAMA_EXPECTED_ARCHITECTURE="${OLLAMA_EXPECTED_ARCHITECTURE:-glm4moelite}"
OLLAMA_EXPECTED_NATIVE_CONTEXT="${OLLAMA_EXPECTED_NATIVE_CONTEXT:-202752}"
OLLAMA_MIN_VERSION="${OLLAMA_MIN_VERSION:-0.15.0}"
OLLAMA_CONTEXT_LENGTH="${OLLAMA_CONTEXT_LENGTH:-202752}"
OLLAMA_KV_CACHE_TYPE="${OLLAMA_KV_CACHE_TYPE:-q8_0}"
OLLAMA_CAP_REASONING="${OLLAMA_CAP_REASONING:-required}"
OLLAMA_CAP_TOOLS="${OLLAMA_CAP_TOOLS:-required}"
OLLAMA_CAP_REASONING_MODE="${OLLAMA_CAP_REASONING_MODE:-think-true}"
OLLAMA_CAP_DISABLE_MODE="${OLLAMA_CAP_DISABLE_MODE:-think-false}"
OLLAMA_CAP_SYSTEM_PROMPT="${OLLAMA_CAP_SYSTEM_PROMPT:-}"

# AuditBench decodes at the checkpoint's sampling, from the registry
# artifact's params layer.
OLLAMA_SAMPLING="${OLLAMA_SAMPLING:-temperature=1 top_p=0.95 min_p=0.01}"
