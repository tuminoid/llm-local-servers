# Ollama GGUF model config for NVIDIA Nemotron 3.5 Lightning 30B-A3B.
#
# The explicit 30b-a3b-q4_K_M registry artifact is a 25,430,738,944-byte
# (23.68 GiB) GGUF, so Ollama dispatches it to llama.cpp rather than the
# Apple-only MLX runner. NemotronH is a 52-layer Mamba/attention hybrid MoE
# with 30B total and 3B active parameters, including only 6 attention layers.
#
# The artifact declares its full 1,048,576-token native context. This RTX
# profile deliberately caps requests at 262,144 tokens to match the proven MLX
# operating point and avoid displacing more weights from the 12 GiB GPU. With
# q4 KV, llama.cpp measured 432 MiB at this limit versus 816 MiB with q8. The
# 142.85 MiB recurrent state does not scale with context or KV dtype, and the
# one-layer MTP draft keeps a separate 256 MiB f16 cache. The weights still
# require CPU assistance, which automatic fit selects.
#
# Identity expectations were read from the 2026-08-25 registry manifest and
# config blob. The tag requires Ollama 0.32.9 or newer.

OLLAMA_MODEL="${OLLAMA_MODEL:-nemotron-3.5-lightning:30b-a3b-q4_K_M}"
OLLAMA_EXPECTED_DIGEST="${OLLAMA_EXPECTED_DIGEST:-e7a64ff15fb174c42b4f463e5c888c4f2c7b9cabf9e8d65a1c0874405426c1b2}"
OLLAMA_EXPECTED_FORMAT="${OLLAMA_EXPECTED_FORMAT:-gguf}"
OLLAMA_EXPECTED_QUANTIZATION="${OLLAMA_EXPECTED_QUANTIZATION:-Q4_K_M}"
OLLAMA_EXPECTED_ARCHITECTURE="${OLLAMA_EXPECTED_ARCHITECTURE:-nemotron_h_moe}"
OLLAMA_EXPECTED_NATIVE_CONTEXT="${OLLAMA_EXPECTED_NATIVE_CONTEXT:-1048576}"
OLLAMA_MIN_VERSION="${OLLAMA_MIN_VERSION:-0.32.9}"
OLLAMA_CONTEXT_LENGTH="${OLLAMA_CONTEXT_LENGTH:-262144}"
OLLAMA_KV_CACHE_TYPE="${OLLAMA_KV_CACHE_TYPE:-q4_0}"
OLLAMA_CAP_REASONING="${OLLAMA_CAP_REASONING:-required}"
OLLAMA_CAP_TOOLS="${OLLAMA_CAP_TOOLS:-required}"
OLLAMA_CAP_REASONING_MODE="${OLLAMA_CAP_REASONING_MODE:-think-true}"
OLLAMA_CAP_DISABLE_MODE="${OLLAMA_CAP_DISABLE_MODE:-think-false}"
OLLAMA_CAP_SYSTEM_PROMPT="${OLLAMA_CAP_SYSTEM_PROMPT:-}"

# AuditBench and audit fitness decode at the checkpoint's sampling, from the registry
# artifact's params layer.
OLLAMA_SAMPLING="${OLLAMA_SAMPLING:-temperature=1 top_p=0.95}"
