# Ollama MLX model config for Qwen3.8-27B, NVFP4.
#
# The qwen3.8:27b-nvfp4 registry artifact is safetensors (model_format
# "safetensors", file_type "nvfp4", ~16.9 GiB of layers), so Ollama
# dispatches it to the MLX runner rather than llama.cpp. This is a separate
# artifact from the GGUF qwen3.8-27b profile and the dense-model comparison
# point for later DFlash 2 work.
#
# The MLX runner at 0.32.14 serializes requests through one slot and keeps
# its KV cache at model precision: OLLAMA_NUM_PARALLEL, OLLAMA_KV_CACHE_TYPE,
# and OLLAMA_FLASH_ATTENTION are ignored on this path. OLLAMA_CONTEXT_LENGTH
# is a soft cap under the checkpoint's native 262,144.
#
# The default launch context is 131,072: the allocation proven with wide
# margin, chosen so a memory incident cannot start from this conf. The
# measured single-conversation ceiling on the 128 GB M5 Max is 184,320
# (supervised: a 173,041-token near-ceiling prefill completed at a
# 92.78 GiB MLX peak, ~123 GB system-wide -- no headroom above it), and
# raising to it is a supervised experiment on an otherwise quiet host,
# per run, never a default. Two reasons the default retreated from the
# ceiling: the native 262,144 exhausted unified memory ~192k tokens into
# a 246k prefill and hard-reset the machine, and even at 184,320 the
# runner cannot serve consecutive deep conversations -- the second
# conversation's fresh prefill fails against the retained prefix trie
# (HTTP 500 at this pin; on the rejected 0.33.2 trial the same point ran
# memory into the ground instead). Raising above 184,320 is not an
# experiment worth running on this host.
#
# Manifest capabilities: completion, vision, tools, thinking; requires
# Ollama 0.32.12 or newer.

OLLAMA_MODEL="${OLLAMA_MODEL:-qwen3.8:27b-nvfp4}"
OLLAMA_EXPECTED_DIGEST="${OLLAMA_EXPECTED_DIGEST:-5642e97495e1a088883805981563dcdc4a040c2f53388b7a41d1f24d3622cf7e}"
OLLAMA_EXPECTED_FORMAT="${OLLAMA_EXPECTED_FORMAT:-safetensors}"
OLLAMA_EXPECTED_QUANTIZATION="${OLLAMA_EXPECTED_QUANTIZATION:-nvfp4}"
OLLAMA_EXPECTED_ARCHITECTURE="${OLLAMA_EXPECTED_ARCHITECTURE:-qwen3_5}"
OLLAMA_EXPECTED_NATIVE_CONTEXT="${OLLAMA_EXPECTED_NATIVE_CONTEXT:-262144}"
OLLAMA_MIN_VERSION="${OLLAMA_MIN_VERSION:-0.32.12}"
OLLAMA_CONTEXT_LENGTH="${OLLAMA_CONTEXT_LENGTH:-131072}"
OLLAMA_KV_CACHE_TYPE="${OLLAMA_KV_CACHE_TYPE:-mlx-native}"
OLLAMA_CAP_REASONING="${OLLAMA_CAP_REASONING:-required}"
OLLAMA_CAP_TOOLS="${OLLAMA_CAP_TOOLS:-required}"
OLLAMA_CAP_REASONING_MODE="${OLLAMA_CAP_REASONING_MODE:-think-true}"
OLLAMA_CAP_DISABLE_MODE="${OLLAMA_CAP_DISABLE_MODE:-think-false}"
OLLAMA_CAP_SYSTEM_PROMPT="${OLLAMA_CAP_SYSTEM_PROMPT:-}"
