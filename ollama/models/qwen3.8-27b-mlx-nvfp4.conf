# Ollama MLX model config for Qwen3.8-27B, NVFP4.
#
# Safetensors NVFP4 artifact -> MLX runner, not llama.cpp. Separate
# artifact from the GGUF qwen3.8-27b profile; dense-model comparison
# point for later DFlash 2 work. The MLX runner at 0.32.14 serializes to
# one slot and keeps KV at model precision: OLLAMA_NUM_PARALLEL,
# OLLAMA_KV_CACHE_TYPE, and OLLAMA_FLASH_ATTENTION are ignored here.
# OLLAMA_CONTEXT_LENGTH is a soft cap under native 262,144.
#
# Default is 131,072 (wide margin, so a memory incident cannot start
# from this conf). Measured single-conversation ceiling on the 128 GB
# M5 Max is 184,320, with no headroom above it -- raising to it is a
# per-run supervised experiment on a quiet host, never a default.
# Native 262,144 exhausted unified memory ~192k into a 246k prefill and
# hard-reset the machine. Even at 184,320 the runner cannot serve
# CONSECUTIVE deep conversations: the second conversation's fresh
# prefill fails against the retained prefix trie (HTTP 500 at this pin;
# the rejected 0.33.2 trial ran memory into the ground instead).
# Do not raise above 184,320 on this host. Rates in BENCHMARKS.md.
#
# Manifest capabilities: completion, vision, tools, thinking; requires
# Ollama 0.32.12+.

OLLAMA_MODEL="${OLLAMA_MODEL:-qwen3.8:27b-nvfp4}"
OLLAMA_EXPECTED_DIGEST="${OLLAMA_EXPECTED_DIGEST:-5642e97495e1a088883805981563dcdc4a040c2f53388b7a41d1f24d3622cf7e}"
OLLAMA_EXPECTED_FORMAT="${OLLAMA_EXPECTED_FORMAT:-safetensors}"
OLLAMA_EXPECTED_QUANTIZATION="${OLLAMA_EXPECTED_QUANTIZATION:-nvfp4}"
OLLAMA_EXPECTED_ARCHITECTURE="${OLLAMA_EXPECTED_ARCHITECTURE:-qwen3_5}"
OLLAMA_EXPECTED_NATIVE_CONTEXT="${OLLAMA_EXPECTED_NATIVE_CONTEXT:-262144}"
OLLAMA_MIN_VERSION="${OLLAMA_MIN_VERSION:-0.32.12}"
OLLAMA_CONTEXT_LENGTH="${OLLAMA_CONTEXT_LENGTH:-131072}"
OLLAMA_KV_CACHE_TYPE="${OLLAMA_KV_CACHE_TYPE:-mlx-native}"
OLLAMA_CAP_REASONING="${OLLAMA_CAP_REASONING:-required}"
OLLAMA_CAP_TOOLS="${OLLAMA_CAP_TOOLS:-required}"
OLLAMA_CAP_REASONING_MODE="${OLLAMA_CAP_REASONING_MODE:-think-true}"
OLLAMA_CAP_DISABLE_MODE="${OLLAMA_CAP_DISABLE_MODE:-think-false}"
OLLAMA_CAP_SYSTEM_PROMPT="${OLLAMA_CAP_SYSTEM_PROMPT:-}"

# AuditBench decodes at the checkpoint's sampling, from the registry
# artifact's params layer.
OLLAMA_SAMPLING="${OLLAMA_SAMPLING:-temperature=1 top_p=0.95 top_k=20}"
