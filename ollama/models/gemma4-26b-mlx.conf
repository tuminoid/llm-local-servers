# Ollama MLX model config for Gemma 4 26B-A4B.
#
# The gemma4:26b-nvfp4 registry artifact is safetensors NVFP4, so Ollama
# dispatches it to the MLX runner rather than llama.cpp. On Apple Silicon
# the plain gemma4:26b tag resolves to this build too, not the Q4_K_M GGUF
# it names elsewhere, so the profile pins the explicit tag. It carries no
# draft model.
#
# An interactive profile, not an audit one: a generic model, and one of its
# three canonical M5 sessions recalled no findings in its report
# (2026-11-16), though Capability Check v2 passed 12 of 12.

OLLAMA_MODEL="${OLLAMA_MODEL:-gemma4:26b-nvfp4}"
OLLAMA_EXPECTED_DIGEST="${OLLAMA_EXPECTED_DIGEST:-f60799545325362bdaa15cbf38694f997514d3d46425c900b4eb06c1d6422d18}"
OLLAMA_EXPECTED_FORMAT="${OLLAMA_EXPECTED_FORMAT:-safetensors}"
OLLAMA_EXPECTED_QUANTIZATION="${OLLAMA_EXPECTED_QUANTIZATION:-nvfp4}"
OLLAMA_EXPECTED_ARCHITECTURE="${OLLAMA_EXPECTED_ARCHITECTURE:-gemma4}"
OLLAMA_EXPECTED_NATIVE_CONTEXT="${OLLAMA_EXPECTED_NATIVE_CONTEXT:-262144}"
OLLAMA_MIN_VERSION="${OLLAMA_MIN_VERSION:-0.40.6}"
OLLAMA_CONTEXT_LENGTH="${OLLAMA_CONTEXT_LENGTH:-262144}"
OLLAMA_KV_CACHE_TYPE="${OLLAMA_KV_CACHE_TYPE:-mlx-native}"
OLLAMA_CAP_REASONING="${OLLAMA_CAP_REASONING:-required}"
OLLAMA_CAP_TOOLS="${OLLAMA_CAP_TOOLS:-required}"
OLLAMA_CAP_REASONING_MODE="${OLLAMA_CAP_REASONING_MODE:-think-true}"
OLLAMA_CAP_DISABLE_MODE="${OLLAMA_CAP_DISABLE_MODE:-think-false}"
OLLAMA_CAP_SYSTEM_PROMPT="${OLLAMA_CAP_SYSTEM_PROMPT:-}"

# AuditBench and audit fitness decode at the checkpoint's sampling, from the
# registry artifact's params layer.
OLLAMA_SAMPLING="${OLLAMA_SAMPLING:-temperature=1 top_p=0.95 top_k=64}"
