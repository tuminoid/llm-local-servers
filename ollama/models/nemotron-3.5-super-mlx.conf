# Ollama model config for NVIDIA Nemotron 3.5 Super VL 120B-A12B, NVFP4 on
# Ollama's MLX runner.
#
# The library tag's config requires Ollama 0.40.5, the first release with the
# nemotron-3.5-super renderer and nemotron_h vision. Hybrid Mamba-2 + LatentMoE
# with 8 attention layers of 88, so a 524,288 context costs about 4 GiB of
# attention KV. Capability Check v2 and session results are in
# ollama/BENCHMARKS.md.

OLLAMA_MODEL="${OLLAMA_MODEL:-nemotron-3.5-super:120b-a12b-nvfp4}"
OLLAMA_EXPECTED_DIGEST="${OLLAMA_EXPECTED_DIGEST:-aba4cee1e75e178a69e0fa82ea888b4ae4e1715fc7b51dc03f751adffb2b5a49}"
OLLAMA_EXPECTED_FORMAT="${OLLAMA_EXPECTED_FORMAT:-safetensors}"
# The MLX tag's model_info carries no context_length (1,048,576 per the card).
OLLAMA_EXPECTED_NATIVE_CONTEXT="${OLLAMA_EXPECTED_NATIVE_CONTEXT:-unspecified}"
OLLAMA_MIN_VERSION="${OLLAMA_MIN_VERSION:-0.40.5}"
OLLAMA_CONTEXT_LENGTH="${OLLAMA_CONTEXT_LENGTH:-524288}"
OLLAMA_KV_CACHE_TYPE="${OLLAMA_KV_CACHE_TYPE:-mlx-native}"

# The tag declares thinking and tools; enable_thinking is the model card's
# control, which Ollama exposes as think.
OLLAMA_CAP_REASONING="${OLLAMA_CAP_REASONING:-required}"
OLLAMA_CAP_TOOLS="${OLLAMA_CAP_TOOLS:-required}"
OLLAMA_CAP_REASONING_MODE="${OLLAMA_CAP_REASONING_MODE:-think-true}"
OLLAMA_CAP_DISABLE_MODE="${OLLAMA_CAP_DISABLE_MODE:-think-false}"
OLLAMA_CAP_SYSTEM_PROMPT="${OLLAMA_CAP_SYSTEM_PROMPT:-}"
OLLAMA_BENCH_REASONING_EFFORT="${OLLAMA_BENCH_REASONING_EFFORT:-high}"

# generation_config.json and the tag's generation_defaults.
OLLAMA_SAMPLING="${OLLAMA_SAMPLING:-temperature=1.0 top_p=0.95}"
