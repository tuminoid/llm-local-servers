# Ollama MLX model config for Qwen3.6 35B-A3B coding, NVFP4.
#
# Safetensors NVFP4 artifact -> MLX runner, not llama.cpp. Separate
# artifact from the GGUF qwen3.6-35b-a3b profile; not interchangeable.
# The MLX runner at 0.32.14 serializes to one slot and keeps KV at model
# precision: OLLAMA_NUM_PARALLEL, OLLAMA_KV_CACHE_TYPE, and
# OLLAMA_FLASH_ATTENTION are ignored on this path. OLLAMA_CONTEXT_LENGTH
# is a soft cap under native 262,144.
#
# 262,144 IS BANNED on this digest. It hard-reset the host (2026-08-26,
# unsupervised canonical run). Root cause (watchdogged repro): single
# deep prefills are fine, but REPEATED distinct deep prefills leak
# 2-3.4 GiB each and the third detonates -- at 0.33.2 mid-prefill, and
# on the 2026-09-04 retest AFTER the prefill commits. Serving is
# repeated requests by definition. The old tag's 246k proof does NOT
# transfer: MLX memory proofs belong to a DIGEST, not a tag. Default is
# 131,072, proven clean per this digest (127,986-token prefill). Lift
# the ban only after three consecutive cache-busted near-ceiling
# prefills pass on the exact digest under a watchdog. Full record and
# rates in BENCHMARKS.md.
#
# Manifest declares completion/vision/thinking but NOT tools; Capability
# Check v1 verified tools via the qwen3.5 parser anyway (2026-08-25).
# Runs on Ollama 0.19.0+, but this profile pins managed 0.32.14.

OLLAMA_MODEL="${OLLAMA_MODEL:-qwen3.6:35b-a3b-coding-nvfp4}"
OLLAMA_EXPECTED_DIGEST="${OLLAMA_EXPECTED_DIGEST:-cd2692a833e66c4c98991b67e9fbaa0bb15a93285baac9240c022f2f40075b6d}"
OLLAMA_EXPECTED_FORMAT="${OLLAMA_EXPECTED_FORMAT:-safetensors}"
OLLAMA_EXPECTED_QUANTIZATION="${OLLAMA_EXPECTED_QUANTIZATION:-nvfp4}"
OLLAMA_EXPECTED_ARCHITECTURE="${OLLAMA_EXPECTED_ARCHITECTURE:-qwen3_5_moe}"
OLLAMA_EXPECTED_NATIVE_CONTEXT="${OLLAMA_EXPECTED_NATIVE_CONTEXT:-262144}"
OLLAMA_MIN_VERSION="${OLLAMA_MIN_VERSION:-0.32.14}"
OLLAMA_CONTEXT_LENGTH="${OLLAMA_CONTEXT_LENGTH:-131072}"
OLLAMA_KV_CACHE_TYPE="${OLLAMA_KV_CACHE_TYPE:-mlx-native}"
OLLAMA_CAP_REASONING="${OLLAMA_CAP_REASONING:-required}"
OLLAMA_CAP_TOOLS="${OLLAMA_CAP_TOOLS:-required}"
OLLAMA_CAP_REASONING_MODE="${OLLAMA_CAP_REASONING_MODE:-think-true}"
OLLAMA_CAP_DISABLE_MODE="${OLLAMA_CAP_DISABLE_MODE:-think-false}"
OLLAMA_CAP_SYSTEM_PROMPT="${OLLAMA_CAP_SYSTEM_PROMPT:-}"

# AuditBench and audit fitness decode at the checkpoint's sampling, from the registry
# artifact's params layer.
OLLAMA_SAMPLING="${OLLAMA_SAMPLING:-temperature=0.6 top_p=0.95 top_k=20}"
