# Ollama MLX model config for Qwen3.6 35B-A3B coding, NVFP4.
#
# The qwen3.6:35b-a3b-coding-nvfp4 registry artifact is safetensors
# (model_format "safetensors", file_type "nvfp4", 35.1B parameters), so
# Ollama dispatches it to the MLX runner rather than llama.cpp. This is a
# separate artifact from the GGUF qwen3.6-35b-a3b profile; the two are not
# interchangeable quantizations.
#
# The MLX runner at 0.32.14 serializes requests through one slot and keeps
# its KV cache at model precision: OLLAMA_NUM_PARALLEL, OLLAMA_KV_CACHE_TYPE,
# and OLLAMA_FLASH_ATTENTION are ignored on this path. OLLAMA_CONTEXT_LENGTH
# is a soft cap under the checkpoint's native 262,144.
#
# HARD RESET 2026-08-26: the CURRENT manifest (digest cd2692a8...) at the
# 262,144 operating point exhausted unified memory during a 131k-token
# prefill sample of its canonical AuditBench attempt -- watchdog panic,
# free pages 721 at death, machine reset at 01:02. The OLD manifest's
# supervised 246,096-token proof (2026-08-20, 48.62 GiB MLX peak) does
# NOT transfer: proofs belong to digests, not tags. The launch default is
# therefore reduced to 131,072. The qwen3.8 NVFP4 hard reset was the
# same failure mode. Context raises on MLX are proven per model AND per
# manifest digest, never copied.
#
# PER-DIGEST PROOF at 131,072 (2026-08-26, same digest cd2692a8...,
# supervised with a memory watchdog): a 127,986-token needle prefill
# (97.6% of the allocation) completed cleanly -- needle retrieved, peak
# residency 23.7 GiB, memory pressure normal throughout. Indicative
# rates (MagSafe 140 W, not canonical): prefill 1,932 tok/s and decode
# 69.5 tok/s at that depth.
#
# MECHANISM (same-day controlled repro, watchdogged): under the 262,144
# allocation, single deep prefills are fine even past the fatal ~127k
# depth; the killer is REPEATED distinct deep prefills on one process.
# Each ~130k request retains 2-3.4 GiB unreleased, and on the third the
# growth goes vertical (~17 GiB allocated in <0.5 s mid-prefill; kernel
# pressure never leaves "normal"). The 131,072 allocation is immune in
# the same experiment. Serving means repeated requests by definition,
# so 262,144 stays BANNED on this digest. Full record in BENCHMARKS.md.
#
# RETEST 2026-09-04 (this digest, 0.32.14, supervised, available-memory
# watchdog): two consecutive single-shot needle prefills at 235,597 and
# 246,104 tokens completed cleanly under the 262,144 allocation
# (available memory never below 67 GiB; indicative prefill 989/857
# tok/s, decode 51/48 tok/s at depth), then the THIRD cache-busted deep
# request detonated AFTER its prefill completed (~68 GiB in ~2 s,
# pressure still normal; watchdog killed the group, host unharmed). The
# old manifest's 246k proof was the same single-shot shape this digest
# passes, so the repin was never the causal variable: the fatal shape
# is repetition, detonating at the post-prefill commit. The ban stays
# on every pin until three consecutive cache-busted near-ceiling
# prefills pass on the exact digest under a watchdog.
#
# The manifest config declares completion, vision, and thinking but not tools.
# Capability Check v1 nevertheless verified a structured call and tool-result
# continuation through the runtime's qwen3.5 parser on 2026-08-25.
# Existing benchmark rates predate this manifest digest and remain historical
# until this exact artifact is remeasured.
# It requires only Ollama 0.19.0, but this profile pins the managed 0.32.14
# MLX runner it is validated against.

OLLAMA_MODEL="${OLLAMA_MODEL:-qwen3.6:35b-a3b-coding-nvfp4}"
OLLAMA_EXPECTED_DIGEST="${OLLAMA_EXPECTED_DIGEST:-cd2692a833e66c4c98991b67e9fbaa0bb15a93285baac9240c022f2f40075b6d}"
OLLAMA_EXPECTED_FORMAT="${OLLAMA_EXPECTED_FORMAT:-safetensors}"
OLLAMA_EXPECTED_QUANTIZATION="${OLLAMA_EXPECTED_QUANTIZATION:-nvfp4}"
OLLAMA_EXPECTED_ARCHITECTURE="${OLLAMA_EXPECTED_ARCHITECTURE:-qwen3_5_moe}"
OLLAMA_EXPECTED_NATIVE_CONTEXT="${OLLAMA_EXPECTED_NATIVE_CONTEXT:-262144}"
OLLAMA_MIN_VERSION="${OLLAMA_MIN_VERSION:-0.32.14}"
OLLAMA_CONTEXT_LENGTH="${OLLAMA_CONTEXT_LENGTH:-131072}"
OLLAMA_KV_CACHE_TYPE="${OLLAMA_KV_CACHE_TYPE:-mlx-native}"
OLLAMA_CAP_REASONING="${OLLAMA_CAP_REASONING:-required}"
OLLAMA_CAP_TOOLS="${OLLAMA_CAP_TOOLS:-required}"
OLLAMA_CAP_REASONING_MODE="${OLLAMA_CAP_REASONING_MODE:-think-true}"
OLLAMA_CAP_DISABLE_MODE="${OLLAMA_CAP_DISABLE_MODE:-think-false}"
OLLAMA_CAP_SYSTEM_PROMPT="${OLLAMA_CAP_SYSTEM_PROMPT:-}"
