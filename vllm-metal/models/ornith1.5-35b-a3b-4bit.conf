# vLLM-Metal model config for Ornith 1.5 35B-A3B (MoE), MLX 4-bit.
#
# ornith-ai/Ornith-1.5-35B-A3B-MLX-4bit: DeepReinforce's own MLX build,
# not a community requant -- the vendor publishes MLX, GGUF, NVFP4 and FP8
# side by side. ~19.5 GB of weights, MIT licensed. Released 2026-08-20,
# targeted at terminal-based coding agents.
#
# Architecturally this is a Qwen3.5-MoE derivative
# (Qwen3_5MoeForConditionalGeneration), not a new lineage: 40 layers with
# full attention every 4th, the rest linear attention; 16 attention heads
# over 2 KV heads x 256 head dim; 256 experts, 8 active (~3B active).
# That makes it a near-exact structural twin of Qwen3.6-35B-A3B, so the
# two profiles are directly comparable on this host -- which is the point,
# since DeepReinforce benchmarks the model against Qwen3.6-35B, Gemma 4
# 31B and Muse Glimmer 30B, all three already served here.

VLLM_MODEL_REPO="${VLLM_MODEL_REPO:-ornith-ai/Ornith-1.5-35B-A3B-MLX-4bit}"
VLLM_MODEL_REVISION="${VLLM_MODEL_REVISION:-19504d912fa8fc7622bf6b1de3db5d5d890b1f02}"
VLLM_SERVED_NAME="${VLLM_SERVED_NAME:-ornith-1.5-35b-a3b-mlx}"

# The checkpoint's native max_position_embeddings (nested under
# text_config); the paged pool must hold one whole sequence of this
# length or startup fails loudly.
VLLM_MAX_LEN="${VLLM_MAX_LEN:-262144}"

# Qwen3 chat template family inherited with the architecture: the
# template defines enable_thinking and emits <think>/<tool_call> tags.
VLLM_REASONING_PARSER="${VLLM_REASONING_PARSER:-qwen3}"
VLLM_TOOL_PARSER="${VLLM_TOOL_PARSER:-qwen3_xml}"

VLLM_CAP_REASONING="${VLLM_CAP_REASONING:-required}"
VLLM_CAP_TOOLS="${VLLM_CAP_TOOLS:-required}"
VLLM_CAP_REASONING_MODE="${VLLM_CAP_REASONING_MODE:-default}"
VLLM_CAP_DISABLE_MODE="${VLLM_CAP_DISABLE_MODE:-enable-thinking-false}"
VLLM_CAP_SYSTEM_PROMPT="${VLLM_CAP_SYSTEM_PROMPT:-}"

# Paged-KV cost, a model fact from the architecture above:
# 10 full-attention layers x 2 KV heads x 256 head dim x 2 (K+V) x 2 B.
VLLM_KV_BYTES_PER_TOKEN="${VLLM_KV_BYTES_PER_TOKEN:-20480}"

# Effective per-token cost under align-mode prefix caching. Measured on
# this checkpoint 2026-09-05: the planner reports per_block_bytes=45,236,224
# over 1,056-token hybrid blocks, i.e. 42,838 B/token -- byte-identical to
# Qwen3.6-35B-A3B, which is the strongest evidence that the linear-attention
# state geometry is unchanged from the base architecture.
VLLM_KV_BYTES_PER_TOKEN_APC="${VLLM_KV_BYTES_PER_TOKEN_APC:-42838}"

# Serving default: align-mode APC on, matching the Qwen3.6-35B-A3B twin.
VLLM_PREFIX_CACHING="${VLLM_PREFIX_CACHING:-1}"
