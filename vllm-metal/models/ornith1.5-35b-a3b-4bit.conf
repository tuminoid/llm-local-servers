# vLLM-Metal model config for Ornith 1.5 35B-A3B (MoE), MLX 4-bit.
#
# ornith-ai/Ornith-1.5-35B-A3B-MLX-4bit: DeepReinforce's own MLX build,
# MIT licensed. Architecturally a Qwen3.5-MoE derivative
# (Qwen3_5MoeForConditionalGeneration), a near-exact structural twin of
# Qwen3.6-35B-A3B, so it inherits that architecture's parser and KV
# geometry.

VLLM_MODEL_REPO="${VLLM_MODEL_REPO:-ornith-ai/Ornith-1.5-35B-A3B-MLX-4bit}"
VLLM_MODEL_REVISION="${VLLM_MODEL_REVISION:-19504d912fa8fc7622bf6b1de3db5d5d890b1f02}"
VLLM_SERVED_NAME="${VLLM_SERVED_NAME:-ornith-1.5-35b-a3b-mlx}"

# Native max_position_embeddings (nested under text_config); the paged
# pool must hold one whole sequence of this length or startup fails
# loudly.
VLLM_MAX_LEN="${VLLM_MAX_LEN:-262144}"

# Qwen3 chat template family inherited with the architecture: the
# template defines enable_thinking and emits <think>/<tool_call> tags.
VLLM_REASONING_PARSER="${VLLM_REASONING_PARSER:-qwen3}"
VLLM_TOOL_PARSER="${VLLM_TOOL_PARSER:-qwen3_xml}"

VLLM_CAP_REASONING="${VLLM_CAP_REASONING:-required}"
VLLM_CAP_TOOLS="${VLLM_CAP_TOOLS:-required}"
VLLM_CAP_REASONING_MODE="${VLLM_CAP_REASONING_MODE:-default}"
VLLM_CAP_DISABLE_MODE="${VLLM_CAP_DISABLE_MODE:-enable-thinking-false}"
VLLM_CAP_SYSTEM_PROMPT="${VLLM_CAP_SYSTEM_PROMPT:-}"

# AuditBench and audit fitness decode at the checkpoint's sampling, from
# generation_config.json at the pinned revision.
VLLM_SAMPLING="${VLLM_SAMPLING:-temperature=1.0 top_p=0.95 top_k=20}"

# Paged-KV cost, a model fact: 10 full-attention layers x 2 KV heads x
# 256 head dim x 2 (K+V) x 2 B.
VLLM_KV_BYTES_PER_TOKEN="${VLLM_KV_BYTES_PER_TOKEN:-20480}"

# Effective per-token cost under align-mode prefix caching. Plugin 0.30.0
# keeps KV and Gated DeltaNet state in one shared cache: the planner's
# 53.29 GiB backing over a 2,720,129-token pool is 21,038 B/token, rounded
# up (0.29.0's separate state pools cost 42,838). A wrong value
# mis-sizes the pool.
VLLM_KV_BYTES_PER_TOKEN_APC="${VLLM_KV_BYTES_PER_TOKEN_APC:-21038}"

# Serving default: align-mode APC on, matching the Qwen3.6-35B-A3B twin.
VLLM_PREFIX_CACHING="${VLLM_PREFIX_CACHING:-1}"