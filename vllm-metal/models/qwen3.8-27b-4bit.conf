# vLLM-Metal model config for Qwen3.8-27B, MLX 4-bit.
#
# mlx-community/Qwen3.8-27B-4bit: standard MLX 4-bit affine quantization,
# ~15.5 GiB of weights -- the same quality tier as the Ollama registry's
# NVFP4 artifact, which makes this the fair speed comparison against that
# baseline. MLX's 4-bit matmul path is its most-optimized kernel set; the
# 8-bit sibling measured dequant-limited at half the host's bandwidth.
#
# The smaller weights buy KV capacity, not a bigger per-request context:
# KV stays 64 KiB/token whatever the weight quantization, so at the 0.91
# budget the pool is ~1.28M tokens, about 4.9 full native sequences.

VLLM_MODEL_REPO="${VLLM_MODEL_REPO:-mlx-community/Qwen3.8-27B-4bit}"
VLLM_MODEL_REVISION="${VLLM_MODEL_REVISION:-3e6447f082e89cc7f0bc6e5441afd38dfce760ff}"
VLLM_SERVED_NAME="${VLLM_SERVED_NAME:-qwen3.8-27b-mlx}"

# The checkpoint's native max_position_embeddings; the paged pool must hold
# one whole sequence of this length or startup fails loudly.
VLLM_MAX_LEN="${VLLM_MAX_LEN:-262144}"

# Same Qwen3.8 chat template family: default thinking, qwen3 XML tools.
VLLM_REASONING_PARSER="${VLLM_REASONING_PARSER:-qwen3}"
VLLM_TOOL_PARSER="${VLLM_TOOL_PARSER:-qwen3_xml}"

VLLM_CAP_REASONING="${VLLM_CAP_REASONING:-required}"
VLLM_CAP_TOOLS="${VLLM_CAP_TOOLS:-required}"
VLLM_CAP_REASONING_MODE="${VLLM_CAP_REASONING_MODE:-default}"
VLLM_CAP_DISABLE_MODE="${VLLM_CAP_DISABLE_MODE:-enable-thinking-false}"
VLLM_CAP_SYSTEM_PROMPT="${VLLM_CAP_SYSTEM_PROMPT:-}"

# Paged-KV cost, a model fact from the architecture:
# 16 full-attention layers x 4 KV heads x 256 head dim x 2 (K+V) x 2 B.
# Expensive enough that the launcher's sizing computes past the host cap
# and lands on it (0.91, the measured four-full-context operating point).
VLLM_KV_BYTES_PER_TOKEN="${VLLM_KV_BYTES_PER_TOKEN:-65536}"

# Effective per-token cost under align-mode prefix caching
# (VLLM_PREFIX_CACHING=1), from the architecture: one GDN layer's state
# is 48 v-heads x 128 x 128 fp32 recurrent + 3 x 10,240 bf16 conv =
# 3,207,168 B; align mode carries 17 state pools per block (one per
# full-attention layer plus one growth overlap) beside 784 tokens of KV
# pages, so each block is 17 x 3,207,168 + 784 x 65,536 = 105,902,080 B
# -- matches the planner's per_block_bytes line exactly -- or 135,080
# B/token, 2.06x the plain paged-KV cost. On the 128 GiB host the
# budget computes past the cap either way (util 0.91); the pool is
# 611,156 tokens, 2.33 native sequences (cache-off holds 4.83).
VLLM_KV_BYTES_PER_TOKEN_APC="${VLLM_KV_BYTES_PER_TOKEN_APC:-135080}"

# Hybrid GDN (48 of 64 layers are GatedDeltaNet; only the 16
# full-attention layers billed above hold per-token KV). Serving
# default: align-mode APC ON, decided 2026-08-27 for audit workflows
# (user bar: <=20% decode for >=10x warm prefill). Trial at
# v0.3.0.dev20260826100011, MagSafe 140 W, relative same-session
# measurements: decode cost -12.5/-13.8/-11.6% at 1/2/4 streams
# (28.8/51.7/82.7 vs cache-off 32.9/59.9/93.6 tok/s, flat across
# samples -- no per-request decay); warm-prefix TTFT 20.3-21.5 s ->
# 0.44 s (47-49x); correctness gate byte-identical cold-vs-hit on both
# probe conversations across restarts, semantic needles 8/8. The
# explicit 1 also pins the resolved mode across core bumps (vLLM main
# resolves supported hybrids to align APC ON). Note align mode changes
# temp-0 outputs versus cache-off, so the cache-off canonical
# AuditBench rates do not transfer: the APC operating point owes its
# own canonical run. Set 0 to force the old cache-off behavior.
# Evidence: vllm-metal/BENCHMARKS.md.
VLLM_PREFIX_CACHING="${VLLM_PREFIX_CACHING:-1}"
