# vLLM-Metal model config for Qwen3.8-27B, MLX 4-bit.
#
# mlx-community/Qwen3.8-27B-4bit: standard MLX 4-bit affine quant. MLX's
# 4-bit matmul path is its most-optimized kernel set; the 8-bit sibling
# measured dequant-limited at half the host's bandwidth, so do not use
# it. Smaller weights buy KV capacity, not a bigger per-request context.

# Revision 10c35caa (2026-09-14) differs from the original 3e6447f0 upload
# in processor_config.json only (image_processor_type
# Qwen3VLImageProcessor -> Qwen2VLImageProcessor); all weight shards are
# byte-identical. The launcher serves text only, so neither name is read
# at startup.
VLLM_MODEL_REPO="${VLLM_MODEL_REPO:-mlx-community/Qwen3.8-27B-4bit}"
VLLM_MODEL_REVISION="${VLLM_MODEL_REVISION:-10c35caafbb80f7dc6a7a432cdd11af10a6d4818}"
VLLM_SERVED_NAME="${VLLM_SERVED_NAME:-qwen3.8-27b-mlx}"

# Native max_position_embeddings; the paged pool must hold one whole
# sequence of this length or startup fails loudly.
VLLM_MAX_LEN="${VLLM_MAX_LEN:-262144}"

# Same Qwen3.8 chat template family: default thinking, qwen3 XML tools.
VLLM_REASONING_PARSER="${VLLM_REASONING_PARSER:-qwen3}"
VLLM_TOOL_PARSER="${VLLM_TOOL_PARSER:-qwen3_xml}"

VLLM_CAP_REASONING="${VLLM_CAP_REASONING:-required}"
VLLM_CAP_TOOLS="${VLLM_CAP_TOOLS:-required}"
VLLM_CAP_REASONING_MODE="${VLLM_CAP_REASONING_MODE:-default}"
VLLM_CAP_DISABLE_MODE="${VLLM_CAP_DISABLE_MODE:-enable-thinking-false}"
VLLM_CAP_SYSTEM_PROMPT="${VLLM_CAP_SYSTEM_PROMPT:-}"

# AuditBench decodes at the checkpoint's sampling, from
# generation_config.json at the pinned revision.
VLLM_SAMPLING="${VLLM_SAMPLING:-temperature=1.0 top_p=0.95 top_k=20}"

# Qwen3.8's template accepts exactly low, medium and xhigh reasoning
# effort with thinking on: high is invalid, and unset means xhigh. The
# generated opencode entry offers them as variants.
VLLM_REASONING_EFFORTS="${VLLM_REASONING_EFFORTS:-low medium xhigh}"

# Paged-KV cost, a model fact: 16 full-attention layers x 4 KV heads x
# 256 head dim x 2 (K+V) x 2 B. Expensive enough that the launcher's
# sizing computes past the host cap and lands on 0.91.
VLLM_KV_BYTES_PER_TOKEN="${VLLM_KV_BYTES_PER_TOKEN:-65536}"

# Effective per-token cost under align-mode prefix caching
# (VLLM_PREFIX_CACHING=1), 2.06x the plain paged-KV cost. Must match the
# planner's per_block_bytes line or the pool is mis-sized. See
# vllm-metal/BENCHMARKS.md.
VLLM_KV_BYTES_PER_TOKEN_APC="${VLLM_KV_BYTES_PER_TOKEN_APC:-135080}"

# Hybrid GDN (48 of 64 layers are GatedDeltaNet; only the 16
# full-attention layers billed above hold per-token KV). Serving
# default: align-mode APC ON. The explicit 1 also pins the resolved mode
# across core bumps (vLLM main resolves supported hybrids to align APC
# ON). GOTCHA: align mode changes temp-0 outputs versus cache-off, so
# cache-off canonical AuditBench rates do not transfer -- the APC point
# owes its own canonical run. Set 0 to force cache-off behavior.
# Evidence: vllm-metal/BENCHMARKS.md.
VLLM_PREFIX_CACHING="${VLLM_PREFIX_CACHING:-1}"