# vLLM-Metal model config for Ornith 1.5 122B (MoE, 10B active), MLX 4-bit.
#
# ornith-ai/Ornith-1.5-122B-MLX-4bit: DeepReinforce's own MLX build, MIT
# licensed. The card names no base, but the config is Qwen3.5-MoE
# (Qwen3_5MoeForConditionalGeneration) with every serving dimension equal
# to Qwen3.5-122B-A10B's, so it inherits that architecture's parser and KV
# geometry, like the 35B-A3B tier. It passes Capability Check v2 but serves
# about 2.3 sessions/h on the M5 Max: an interactive profile, not an audit
# one.

VLLM_MODEL_REPO="${VLLM_MODEL_REPO:-ornith-ai/Ornith-1.5-122B-MLX-4bit}"
VLLM_MODEL_REVISION="${VLLM_MODEL_REVISION:-310ebeb9e38893df907277d9f640dca39324791e}"
VLLM_SERVED_NAME="${VLLM_SERVED_NAME:-ornith-1.5-122b-mlx}"

# Native max_position_embeddings (nested under text_config); the paged
# pool must hold one whole sequence of this length or startup fails
# loudly.
VLLM_MAX_LEN="${VLLM_MAX_LEN:-262144}"

# Qwen3 chat template family inherited with the architecture: the
# template defines enable_thinking and emits <think>/<tool_call> tags.
VLLM_REASONING_PARSER="${VLLM_REASONING_PARSER:-qwen3}"
VLLM_TOOL_PARSER="${VLLM_TOOL_PARSER:-qwen3_xml}"

VLLM_CAP_REASONING="${VLLM_CAP_REASONING:-required}"
VLLM_CAP_TOOLS="${VLLM_CAP_TOOLS:-required}"
VLLM_CAP_REASONING_MODE="${VLLM_CAP_REASONING_MODE:-default}"
VLLM_CAP_DISABLE_MODE="${VLLM_CAP_DISABLE_MODE:-enable-thinking-false}"
VLLM_CAP_SYSTEM_PROMPT="${VLLM_CAP_SYSTEM_PROMPT:-}"

# AuditBench and audit fitness decode at the checkpoint's sampling, from
# generation_config.json at the pinned revision.
VLLM_SAMPLING="${VLLM_SAMPLING:-temperature=0.6 top_p=0.95 top_k=20}"

# Paged-KV cost, a model fact: 12 full-attention layers x 2 KV heads x
# 256 head dim x 2 (K+V) x 2 B.
VLLM_KV_BYTES_PER_TOKEN="${VLLM_KV_BYTES_PER_TOKEN:-24576}"

# Effective per-token cost under align-mode prefix caching, KV and Gated
# DeltaNet state in one shared cache: the planner's 26.77 GiB backing over a
# 1,108,154-token pool is at most 25,944 B/token (the upper bound of the
# two-decimal GiB figure). The 64 GiB of weights put the budget on the host
# cap either way.
VLLM_KV_BYTES_PER_TOKEN_APC="${VLLM_KV_BYTES_PER_TOKEN_APC:-25944}"

# Serving default: align-mode APC on, as for the 35B-A3B tier.
VLLM_PREFIX_CACHING="${VLLM_PREFIX_CACHING:-1}"
