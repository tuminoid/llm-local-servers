# vLLM-Metal model config for Xiaomi MiMo-V2.6-Distill-Qwen-9B, MLX
# OptiQ 4-bit.
#
# Xiaomi's supervised fine-tune of Qwen3.5-9B on MiMo-generated coding,
# agent, cybersecurity and visual data (MIT). A 32-layer Qwen3.5 hybrid:
# 8 full-attention and 24 Gated DeltaNet layers. The mlx-community OptiQ
# quant keeps sensitive layers at 8-bit and the rest at 4-bit (7.1 GB).
# The conversion ships no processor files; the launcher serves text only
# and never reads them. The checkpoint declares one MTP layer but ships
# no MTP weights.
#
# Same chat dialect as the Qwen3.5 family: <think> blocks and Qwen3-XML
# tool calls; vLLM's `mimo` parser names alias the qwen3 / qwen3_xml
# classes.
#
# Its card presents it as an SFT research checkpoint, "a starting point for
# open research in agentic reinforcement learning" (no RL pass, 14% cyber
# data). It fails audit fitness on its own judgement (triage verdicts,
# selection loops) on every runtime and fix tried through 2026-10-26: a
# light coding model, not an audit model.

VLLM_MODEL_REPO="${VLLM_MODEL_REPO:-mlx-community/MiMo-V2.6-Distill-Qwen-9B-OptiQ-4bit}"
VLLM_MODEL_REVISION="${VLLM_MODEL_REVISION:-f8642c8eff3159d84518ad005c95d940f359e538}"
VLLM_SERVED_NAME="${VLLM_SERVED_NAME:-mimo-v2.6-9b-mlx}"

# Native max_position_embeddings (nested under text_config).
VLLM_MAX_LEN="${VLLM_MAX_LEN:-262144}"

VLLM_REASONING_PARSER="${VLLM_REASONING_PARSER:-qwen3}"
VLLM_TOOL_PARSER="${VLLM_TOOL_PARSER:-qwen3_xml}"

# The checkpoint's template prefills no <think>, so the model may skip
# reasoning; the fixed template opens the thinking block, as the CUDA
# profile's does. Measured 2026-10-26 on vLLM-Metal 0.31.0 (exploratory,
# with VLLM_PRESERVE_REASONING=1): the stock template passed 0 of 12
# fitness samples twice (10 and 11 without reasoning), the fixed one 3 and
# 4 of 12 with none, the rest selection runaways and invented paths and
# wrong triage verdicts. Both tool-call checks still get arguments {} with
# either template: at the check's prompt the model closes the opened block
# at once and writes a JSON body inside <function=...> (see CAPABILITIES.md).
# Retest when upstream fixes the template or on the next plugin bump.
VLLM_CHAT_TEMPLATE="${VLLM_CHAT_TEMPLATE:-mimo-v2.6-chat-template.jinja}"

# The template re-renders every past assistant turn's reasoning_content.
VLLM_PRESERVE_REASONING="${VLLM_PRESERVE_REASONING:-1}"

VLLM_CAP_REASONING="${VLLM_CAP_REASONING:-required}"
VLLM_CAP_TOOLS="${VLLM_CAP_TOOLS:-required}"
VLLM_CAP_REASONING_MODE="${VLLM_CAP_REASONING_MODE:-default}"
VLLM_CAP_DISABLE_MODE="${VLLM_CAP_DISABLE_MODE:-enable-thinking-false}"
VLLM_CAP_SYSTEM_PROMPT="${VLLM_CAP_SYSTEM_PROMPT:-}"

# AuditBench and audit fitness decode at the checkpoint's sampling, from
# generation_config.json at the pinned revision.
VLLM_SAMPLING="${VLLM_SAMPLING:-temperature=0.6 top_p=0.95 top_k=20}"

# Paged-KV cost, a model fact: 8 full-attention layers x 4 KV heads x
# 256 head dim x 2 (K+V) x 2 B.
VLLM_KV_BYTES_PER_TOKEN="${VLLM_KV_BYTES_PER_TOKEN:-32768}"

# Effective per-token cost under align-mode prefix caching. Plugin 0.30.0
# keeps KV and Gated DeltaNet state in one shared cache: the planner's
# 86.64 GiB backing over a 2,802,282-token pool is at most 33,200 B/token
# (the upper bound of the two-decimal GiB figure; 0.29.0's separate state
# pools cost 69,353). A wrong value mis-sizes the pool.
VLLM_KV_BYTES_PER_TOKEN_APC="${VLLM_KV_BYTES_PER_TOKEN_APC:-33200}"

# Align-mode APC on. Gate passed at plugin 0.29.0 (2026-09-22): cold vs
# hit byte-identical in both directions across a restart (TTFT 6.0 s
# cold vs 0.22 s hit on the ~10k-token probe prefix), same-instant pair
# probe 0/12, Capability Check v1 8/8. Cold vs hit re-passed at 0.30.0
# (2026-09-27).
VLLM_PREFIX_CACHING="${VLLM_PREFIX_CACHING:-1}"
