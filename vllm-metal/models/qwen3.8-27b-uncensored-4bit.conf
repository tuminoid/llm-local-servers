# vLLM-Metal model config for Qwen3.8-27B Uncensored (orcarouter
# abliteration), MLX affine 4-bit. STATUS: TRIAL (2026-09-03/04).
#
# orcarouter/Qwen3.8-27B-Uncensored-MLX is a multi-quant repo (2/4/6/8-bit
# subfolders plus an mtp drafter); the root files are the affine 4-bit
# (group 64, ~15 GiB), the same quantization class and kernel path as the
# incumbent qwen3.8-27b-4bit. VLLM_MODEL_INCLUDE limits the pull to those
# root files instead of the full 88 GiB repo. Text architecture identical
# to the incumbent: 64 layers, 16 full attention + 48 GDN, 4 KV heads x
# 256 head dim, native 262,144. Base lineage: Qwen/Qwen3.8-27B ->
# orcarouter abliterated bf16 -> this MLX quant.

VLLM_MODEL_REPO="${VLLM_MODEL_REPO:-orcarouter/Qwen3.8-27B-Uncensored-MLX}"
VLLM_MODEL_REVISION="${VLLM_MODEL_REVISION:-14963e70f886455cf93090ac95bdbf4c8730cbe1}"
VLLM_MODEL_INCLUDE="${VLLM_MODEL_INCLUDE:-model-* model.safetensors.index.json config.json generation_config.json tokenizer.json tokenizer_config.json vocab.json chat_template.jinja preprocessor_config.json processor_config.json video_preprocessor_config.json}"
VLLM_SERVED_NAME="${VLLM_SERVED_NAME:-qwen3.8-27b-uncensored-mlx}"

# 512k operating point (user decision 2026-09-04: this profile serves the
# extended context exclusively). Static YaRN factor 2.0 over the native
# 262,144, the exact override shape of the CUDA qwen3.8-27b-512k profile.
# Static scaling also taxes short requests; the incumbent qwen3.8-27b-4bit
# remains the native-context profile. At this max-len the APC pool is
# 617,494 tokens, 1.18 sequences -- one deep conversation plus admission
# queueing, not concurrent full-depth streams.
# Verified 2026-09-04 at plugin 0.28.0: the launcher passes the override
# (engine log shows rope_type yarn, max_model_len 524288) and a
# 278,846-token needle probe -- 16.7k tokens past the native window --
# retrieved its needle exactly at temp 0, thinking off; average prefill
# 188 tok/s over that depth (~25 min). One needle at one depth is a
# smoke, not the deep-quality gate: deep AuditBench phases and
# capability-v1 at depth are owed before promotion, as on the CUDA 512k
# profile.
VLLM_MAX_LEN="${VLLM_MAX_LEN:-524288}"

_QWEN38_YARN_OVERRIDES='{"text_config":{"rope_parameters":{"mrope_interleaved":true,"mrope_section":[11,11,10],"rope_type":"yarn","rope_theta":10000000,"partial_rotary_factor":0.25,"factor":2.0,"original_max_position_embeddings":262144}}}'
VLLM_HF_OVERRIDES="${VLLM_HF_OVERRIDES:-${_QWEN38_YARN_OVERRIDES}}"
unset _QWEN38_YARN_OVERRIDES

# Same Qwen3.8 chat template family: default thinking, qwen3 XML tools.
VLLM_REASONING_PARSER="${VLLM_REASONING_PARSER:-qwen3}"
VLLM_TOOL_PARSER="${VLLM_TOOL_PARSER:-qwen3_xml}"

VLLM_CAP_REASONING="${VLLM_CAP_REASONING:-required}"
VLLM_CAP_TOOLS="${VLLM_CAP_TOOLS:-required}"
VLLM_CAP_REASONING_MODE="${VLLM_CAP_REASONING_MODE:-default}"
VLLM_CAP_DISABLE_MODE="${VLLM_CAP_DISABLE_MODE:-enable-thinking-false}"
VLLM_CAP_SYSTEM_PROMPT="${VLLM_CAP_SYSTEM_PROMPT:-}"

# Paged-KV cost, identical architecture to qwen3.8-27b-4bit:
# 16 full-attention layers x 4 KV heads x 256 head dim x 2 (K+V) x 2 B.
VLLM_KV_BYTES_PER_TOKEN="${VLLM_KV_BYTES_PER_TOKEN:-65536}"

# Effective per-token cost under align-mode prefix caching, identical
# architecture and math to qwen3.8-27b-4bit: 17 GDN state pools per
# 784-token block beside the KV pages, 135,080 B/token (2.06x plain).
# On the 128 GiB host the pool is 611,156 tokens, 2.33 native
# sequences (cache-off holds 4.83).
VLLM_KV_BYTES_PER_TOKEN_APC="${VLLM_KV_BYTES_PER_TOKEN_APC:-135080}"

# Hybrid GDN: align-mode APC ON, the same serving default and rationale
# as the incumbent. Gates passed 2026-09-04 at plugin 0.28.0 on this
# artifact: cold-vs-hit byte-identical in both directions across a
# restart (TTFT 20.2-20.7 s cold -> 0.44 s hit, 47x on the probe
# prefix), same-instant pair probe 0/12, decode smoke flat at
# 28.5/52.9/83.6 tok/s (1/2/4 streams) with no per-request decay --
# rate parity with the incumbent's APC operating point in every
# measured respect. Align mode changes temp-0 outputs versus cache-off,
# so cache-off rates do not transfer; the APC operating point owes its
# own canonical run before promotion. Set 0 to force cache-off.
VLLM_PREFIX_CACHING="${VLLM_PREFIX_CACHING:-1}"
