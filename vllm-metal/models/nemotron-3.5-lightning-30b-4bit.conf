# vLLM-Metal model config for NVIDIA Nemotron 3.5 Lightning 30B-A3B,
# MLX OptiQ 4-bit. STATUS: BLOCKED (first-light trial 2026-08-25 at pin
# 0.3.0.dev20260819180958). The model LOADS -- nemotron_h and OptiQ
# both work -- and the launcher sizes a 1,331,525-token pool (five full
# 262,144 sequences, util 0.84), but the first forward crashes: the
# plugin's paged cache answers mlx_lm's create_ssm_mask() via make_mask()
# with the attention-style "causal" STRING for Mamba layer slots, and
# nemotron_h._conv() indexes it as an array
# (mx.where(mask[..., None], ...) -> TypeError). Plugin bug, not a model
# or checkpoint fault; no upstream issue exists yet. Reconfirmed broken
# 2026-08-26 on a v0.3.0.dev20260826100011 trial venv (same first-forward
# TypeError). Retest on every plugin bump; capability-v1 + the
# same-instant pair probe gate any adoption.
#
# mlx-community/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-OptiQ-4bit:
# 52 layers, only 6 full-attention; 23 Mamba2 and 23 MoE blocks
# (3B active parameters). 2 KV heads x 128 head dim. Paged KV cost is
# 6 x 2 x 128 x 2 x 2 B = 6,144 B/token, 3.3x cheaper than qwen3.6's
# 20,480. Mamba recurrent state is a constant ~46 MiB per sequence
# (fp32 SSM cache), outside the paged pool.
#
# The HF config carries max_position_embeddings 1,048,576; the fleet
# operating point stays 262,144 (matches the Ollama artifact's declared
# context and every cross-model comparison on this host).
#
# No reasoning or tool parser is set yet: parser selection needs the
# first-light server up to inspect the emitted dialect. The Ollama MLX
# artifact of this model passed capability-v1 with native think controls,
# so the model side is known good.

VLLM_MODEL_REPO="${VLLM_MODEL_REPO:-mlx-community/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-OptiQ-4bit}"
VLLM_MODEL_REVISION="${VLLM_MODEL_REVISION:-91866de84ecab44c6bcf5615e3583879f1d2bf3d}"
VLLM_SERVED_NAME="${VLLM_SERVED_NAME:-nemotron-3.5-lightning-30b-a3b-mlx}"

VLLM_MAX_LEN="${VLLM_MAX_LEN:-262144}"

VLLM_CAP_REASONING="${VLLM_CAP_REASONING:-required}"
VLLM_CAP_TOOLS="${VLLM_CAP_TOOLS:-required}"
VLLM_CAP_REASONING_MODE="${VLLM_CAP_REASONING_MODE:-default}"
VLLM_CAP_DISABLE_MODE="${VLLM_CAP_DISABLE_MODE:-none}"
VLLM_CAP_SYSTEM_PROMPT="${VLLM_CAP_SYSTEM_PROMPT:-}"

# Effective paged-pool cost per token. The raw attention KV is only
# 6 layers x 2 KV heads x 128 head dim x 2 (K+V) x 2 B = 6,144 B/token,
# but the hybrid allocator stripes the Mamba state into the same pool and
# forces one unified page size: the engine sets a 2,096-token attention
# block so the attention page is >= the mamba page (padded 0.58% to match)
# and reports 111,607,808 B per block -- 53,248 B/token effective. That is
# 2.6x qwen3.6's 20,480; a full 262,144 sequence costs 13.0 GiB of pool.
VLLM_KV_BYTES_PER_TOKEN="${VLLM_KV_BYTES_PER_TOKEN:-53248}"

# Hybrid Mamba: the 0.27.1 engine default is APC off for hybrids, but
# vLLM main resolves them to align-mode APC ON, so the explicit 0 pins
# the resolved mode across core bumps. Revisit together with the
# ssm-mask unblock above; align-mode state cost is unmeasured here.
VLLM_PREFIX_CACHING="${VLLM_PREFIX_CACHING:-0}"
