# vLLM-Metal model config for NVIDIA Nemotron 3.5 Lightning 30B-A3B,
# MLX OptiQ 4-bit.
#
# STATUS: BLOCKED, plugin bug rather than a model or checkpoint fault. The
# model loads and the launcher sizes a pool, but the first forward crashes:
# the plugin's paged cache answers mlx_lm's create_ssm_mask() via make_mask()
# with the attention-style "causal" STRING for Mamba layer slots, and
# nemotron_h._conv() indexes it as an array (TypeError). Reconfirmed on two
# dev pins and on the pinned 0.28.0 stable venv. Retest on every plugin bump;
# a capability check plus the same-instant pair probe gate any adoption.
#
# The HF config carries max_position_embeddings 1,048,576; the fleet operating
# point stays 262,144, matching the Ollama artifact and every cross-model
# comparison on this host.
#
# No reasoning or tool parser is set: choosing one needs the server up to
# inspect the emitted dialect. The Ollama MLX artifact of this model passes
# its capability checks with native think controls, so the model side is
# known good.

VLLM_MODEL_REPO="${VLLM_MODEL_REPO:-mlx-community/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-OptiQ-4bit}"
VLLM_MODEL_REVISION="${VLLM_MODEL_REVISION:-91866de84ecab44c6bcf5615e3583879f1d2bf3d}"
VLLM_SERVED_NAME="${VLLM_SERVED_NAME:-nemotron-3.5-lightning-30b-a3b-mlx}"

VLLM_MAX_LEN="${VLLM_MAX_LEN:-262144}"

VLLM_CAP_REASONING="${VLLM_CAP_REASONING:-required}"
VLLM_CAP_TOOLS="${VLLM_CAP_TOOLS:-required}"
VLLM_CAP_REASONING_MODE="${VLLM_CAP_REASONING_MODE:-default}"
VLLM_CAP_DISABLE_MODE="${VLLM_CAP_DISABLE_MODE:-none}"
VLLM_CAP_SYSTEM_PROMPT="${VLLM_CAP_SYSTEM_PROMPT:-}"

# Effective paged-pool cost per token, not the raw attention KV. The raw
# figure is only 6,144 B/token, but the hybrid allocator stripes the Mamba
# state into the same pool and forces one unified page size, which lands at
# 53,248 B/token effective -- 2.6x qwen3.6's, so a full sequence costs 13.0
# GiB of pool. Size from this number, not the per-head arithmetic.
VLLM_KV_BYTES_PER_TOKEN="${VLLM_KV_BYTES_PER_TOKEN:-53248}"

# Hybrid Mamba: the 0.27.1 engine default is APC off for hybrids, but
# vLLM main resolves them to align-mode APC ON, so the explicit 0 pins
# the resolved mode across core bumps. Revisit together with the
# ssm-mask unblock above; align-mode state cost is unmeasured here.
VLLM_PREFIX_CACHING="${VLLM_PREFIX_CACHING:-0}"
