# vLLM-Metal model config for NVIDIA Nemotron 3.5 Lightning 30B-A3B,
# MLX OptiQ 4-bit.
#
# Serves since plugin 0.29.0. Earlier pins (two dev pins and 0.28.0)
# crashed in the first forward: the plugin's paged cache answered
# mlx_lm's create_ssm_mask() with the attention-style "causal" string
# for Mamba layer slots and nemotron_h._conv() indexed it as an array.
#
# The HF config carries max_position_embeddings 1,048,576; the fleet
# operating point stays 262,144, matching the Ollama artifact and every
# cross-model comparison on this host.
#
# Emitted dialect is Qwen3-XML (<think> blocks, <tool_call><function=...>
# calls): reasoning parser qwen3, tool parser qwen3_xml; the template
# honors enable_thinking=false. json_schema fails with the gemma4-class
# whitespace runaway. Canonical rates are in ../BENCHMARKS.md.

VLLM_MODEL_REPO="${VLLM_MODEL_REPO:-mlx-community/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-OptiQ-4bit}"
VLLM_MODEL_REVISION="${VLLM_MODEL_REVISION:-91866de84ecab44c6bcf5615e3583879f1d2bf3d}"
VLLM_SERVED_NAME="${VLLM_SERVED_NAME:-nemotron-3.5-lightning-30b-a3b-mlx}"

VLLM_MAX_LEN="${VLLM_MAX_LEN:-262144}"
VLLM_REASONING_PARSER="${VLLM_REASONING_PARSER:-qwen3}"
VLLM_TOOL_PARSER="${VLLM_TOOL_PARSER:-qwen3_xml}"

VLLM_CAP_REASONING="${VLLM_CAP_REASONING:-required}"
VLLM_CAP_TOOLS="${VLLM_CAP_TOOLS:-required}"
VLLM_CAP_REASONING_MODE="${VLLM_CAP_REASONING_MODE:-default}"
VLLM_CAP_DISABLE_MODE="${VLLM_CAP_DISABLE_MODE:-enable-thinking-false}"
VLLM_CAP_SYSTEM_PROMPT="${VLLM_CAP_SYSTEM_PROMPT:-}"

# AuditBench and audit fitness decode at the checkpoint's sampling, from
# generation_config.json at the pinned revision.
VLLM_SAMPLING="${VLLM_SAMPLING:-temperature=1.0 top_p=0.95}"

# Paged-pool cost per token, from the planner's own breakdown at plugin
# 0.29.0: per_block_bytes 12,877,824 over a 2,096-token attention block is
# exactly 6,144 B/token -- the KV of the 6 full-attention layers, the only
# thing in the pool. The 23 Mamba-2 layers keep a private per-sequence
# state slot outside the pool (49.1 MB per sequence, reserved lazily: the
# planner budgets 0.15 GB for a peak of 3 of the 5 slots), which the
# launcher's flat 5 GB engine-overhead term already covers. Five full
# native contexts therefore invert to util 0.32 (~1.65M-token pool, 6.3x
# native) instead of the old 0.85. The earlier 53,248 figure described the
# 0.28.0-era layout that striped Mamba state into the pool; that layout
# never served a request on this host.
VLLM_KV_BYTES_PER_TOKEN="${VLLM_KV_BYTES_PER_TOKEN:-6144}"

# Hybrid Mamba: vLLM main resolves hybrids to align-mode APC ON, but
# plugin 0.29.0 refuses it for this state family and serves cache-off
# with a warning (`the 'nemotron_h' state family supports
# mamba_cache_mode ('none',), not 'align'`, 2026-09-22 trial). The 0
# states the only mode the plugin has; retest on a plugin bump.
VLLM_PREFIX_CACHING="${VLLM_PREFIX_CACHING:-0}"
