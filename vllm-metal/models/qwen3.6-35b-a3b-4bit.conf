# vLLM-Metal model config for Qwen3.6-35B-A3B (MoE), MLX 4-bit.
#
# mlx-community/Qwen3.6-35B-A3B-4bit: standard MLX 4-bit affine
# quantization (group size 64, 8-bit MoE gates), ~20 GiB of weights.
# Same quality tier as the Ollama registry's NVFP4 artifact; the official
# coding variant exists only in the Ollama registry (no HF release, no
# MLX conversion), so this base checkpoint is the vLLM-Metal profile.
#
# Hybrid architecture: 40 layers, only 10 full-attention (interval 4),
# the rest gated-delta linear attention; 2 KV heads x 256 head dim.
# Paged KV cost is therefore 10 x 2 x 256 x 2 x 2 B = 20 KiB/token,
# 3.2x cheaper than qwen3.8's 64 KiB/token. 256 experts, 8 active
# (~3B active parameters) keeps decode bandwidth per token low.

VLLM_MODEL_REPO="${VLLM_MODEL_REPO:-mlx-community/Qwen3.6-35B-A3B-4bit}"
VLLM_MODEL_REVISION="${VLLM_MODEL_REVISION:-38740b847e4cb78f352aba30aa41c76e08e6eb46}"
VLLM_SERVED_NAME="${VLLM_SERVED_NAME:-qwen3.6-35b-a3b-mlx}"

# The checkpoint's native max_position_embeddings (nested under
# text_config in this multimodal-style config); the paged pool must hold
# one whole sequence of this length or startup fails loudly.
VLLM_MAX_LEN="${VLLM_MAX_LEN:-262144}"

# Same Qwen3 chat template family: default thinking, qwen3 XML tools.
VLLM_REASONING_PARSER="${VLLM_REASONING_PARSER:-qwen3}"
VLLM_TOOL_PARSER="${VLLM_TOOL_PARSER:-qwen3_xml}"

VLLM_CAP_REASONING="${VLLM_CAP_REASONING:-required}"
VLLM_CAP_TOOLS="${VLLM_CAP_TOOLS:-required}"
VLLM_CAP_REASONING_MODE="${VLLM_CAP_REASONING_MODE:-default}"
VLLM_CAP_DISABLE_MODE="${VLLM_CAP_DISABLE_MODE:-enable-thinking-false}"
VLLM_CAP_SYSTEM_PROMPT="${VLLM_CAP_SYSTEM_PROMPT:-}"

# Paged-KV cost, a model fact from the architecture above:
# 10 full-attention layers x 2 KV heads x 256 head dim x 2 (K+V) x 2 B.
# The launcher sizes the memory budget from it (verified: util computes
# 0.46, pool 1,410,584 tokens, five full native sequences fit outright).
VLLM_KV_BYTES_PER_TOKEN="${VLLM_KV_BYTES_PER_TOKEN:-20480}"

# Effective per-token cost under align-mode prefix caching
# (VLLM_PREFIX_CACHING=1), from the same architecture: one request's GDN
# state is 30 linear layers x (32 v-heads x 128 x 128 fp32 recurrent +
# 3 x 8192 bf16 conv) = 64,389,120 B; align mode stripes it into 10 state
# pools (one per within-group position) plus one growth-overlap pool, so
# each 1,056-token hybrid block carries 23,609,344 B of state besides its
# 21,626,880 B of KV pages. Total 45,236,224 B/block -- matches the
# planner's per_block_bytes breakdown line exactly -- is 42,838 B/token.
VLLM_KV_BYTES_PER_TOKEN_APC="${VLLM_KV_BYTES_PER_TOKEN_APC:-42838}"

# Serving default: align-mode APC ON, decided 2026-08-26 for audit
# workflows after the pin moved to v0.3.0.dev20260826100011 (plugin PR
# #634 fixed the per-request decode decay that blocked APC on the
# 08-19 pin; decode now holds flat at 101/171/257 tok/s at 1/2/4).
# The accepted trade: a flat ~15-19% decode cost under the cache-off
# control (119.6/202.0/316.1) buys ~36x TTFT on warm prefixes -- and
# audit clients resend the whole conversation every step. The explicit
# 1 also pins the resolved mode across core bumps. Note align mode
# changes hybrid temp-0 outputs from the first generated token, so the
# cache-off canonical AuditBench rates do not transfer: the APC
# operating point still owes its own canonical run. Set 0 to force the
# old cache-off behavior.
VLLM_PREFIX_CACHING="${VLLM_PREFIX_CACHING:-1}"
