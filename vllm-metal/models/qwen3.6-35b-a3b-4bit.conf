# vLLM-Metal model config for Qwen3.6-35B-A3B (MoE), MLX 4-bit.
#
# mlx-community/Qwen3.6-35B-A3B-4bit: standard MLX 4-bit affine quant.
# The official coding variant exists only in the Ollama registry (no HF
# release, no MLX conversion), so this base checkpoint is the vLLM-Metal
# profile.

VLLM_MODEL_REPO="${VLLM_MODEL_REPO:-mlx-community/Qwen3.6-35B-A3B-4bit}"
VLLM_MODEL_REVISION="${VLLM_MODEL_REVISION:-38740b847e4cb78f352aba30aa41c76e08e6eb46}"
VLLM_SERVED_NAME="${VLLM_SERVED_NAME:-qwen3.6-35b-a3b-mlx}"

# Native max_position_embeddings (nested under text_config in this
# multimodal-style config); the paged pool must hold one whole sequence
# of this length or startup fails loudly.
VLLM_MAX_LEN="${VLLM_MAX_LEN:-262144}"

# Same Qwen3 chat template family: default thinking, qwen3 XML tools.
VLLM_REASONING_PARSER="${VLLM_REASONING_PARSER:-qwen3}"
VLLM_TOOL_PARSER="${VLLM_TOOL_PARSER:-qwen3_xml}"

VLLM_CAP_REASONING="${VLLM_CAP_REASONING:-required}"
VLLM_CAP_TOOLS="${VLLM_CAP_TOOLS:-required}"
VLLM_CAP_REASONING_MODE="${VLLM_CAP_REASONING_MODE:-default}"
VLLM_CAP_DISABLE_MODE="${VLLM_CAP_DISABLE_MODE:-enable-thinking-false}"
VLLM_CAP_SYSTEM_PROMPT="${VLLM_CAP_SYSTEM_PROMPT:-}"

# AuditBench and audit fitness decode at the checkpoint's sampling, from
# generation_config.json at the pinned revision.
VLLM_SAMPLING="${VLLM_SAMPLING:-temperature=1.0 top_p=0.95 top_k=20}"

# Paged-KV cost, a model fact: 10 full-attention layers x 2 KV heads x
# 256 head dim x 2 (K+V) x 2 B. The launcher sizes its memory budget
# from this; a wrong value mis-sizes the pool.
VLLM_KV_BYTES_PER_TOKEN="${VLLM_KV_BYTES_PER_TOKEN:-20480}"

# Effective per-token cost under align-mode prefix caching. Plugin 0.30.0
# keeps KV and Gated DeltaNet state in one shared cache: the planner's
# 54.38 GiB backing over a 2,775,642-token pool is 21,039 B/token, rounded
# up (0.29.0's separate state pools cost 42,838). A wrong value
# mis-sizes the pool.
VLLM_KV_BYTES_PER_TOKEN_APC="${VLLM_KV_BYTES_PER_TOKEN_APC:-21039}"

# Serving default: align-mode APC ON (plugin PR #634 fixed the
# per-request decode decay that blocked APC on the 08-19 pin). Trades a
# flat decode cost for large warm-prefix TTFT wins; audit clients resend
# the whole conversation every step. The explicit 1 also pins the
# resolved mode across core bumps. GOTCHA: align mode changes hybrid
# temp-0 outputs from the first generated token, so cache-off canonical
# AuditBench rates do not transfer -- the APC point owes its own
# canonical run. Set 0 to force cache-off behavior.
VLLM_PREFIX_CACHING="${VLLM_PREFIX_CACHING:-1}"