# vLLM-Metal model config for IBM Granite 4.2 30B, MLX 4-bit.
#
# ibm-granite/granite-4.2-30b-q4-mlx: IBM's own MLX conversion, ~16.5 GB of
# weights. Granite 4.2 is a dense transformer, unlike the hybrid Mamba-2
# designs of 4.0 and 4.1. When this profile was added (plugin 0.28.0) the Metal
# plugin could not serve Mamba state layers; Nemotron-H's served from 0.29.0,
# and 0.30.0 lists Granite 4.0 hybrids as served with prefix caching off. The
# 4.0 and 4.1 hybrids are untested on this host.

VLLM_MODEL_REPO="${VLLM_MODEL_REPO:-ibm-granite/granite-4.2-30b-q4-mlx}"
VLLM_MODEL_REVISION="${VLLM_MODEL_REVISION:-d3f143b440062060eb05f7b8677ced5b4d9a8946}"
VLLM_SERVED_NAME="${VLLM_SERVED_NAME:-granite-4.2-30b-mlx}"

# The checkpoint's native max_position_embeddings. IBM documents a 512k
# extension for the 30B, but this checkpoint carries rope_scaling=null, so
# 131,072 is what the artifact declares. A longer operating point is a
# separate, evidenced change -- not a launch flag.
VLLM_MAX_LEN="${VLLM_MAX_LEN:-131072}"

# qwen3, because Granite 4.2 emits <think>...</think> and takes
# enable_thinking as a chat-template kwarg -- the Qwen3 grammar exactly.
# Neither obvious alternative works:
#   granite     targets Granite 3.x prose markers ("Here is my thought
#               process:"). Wrong generation entirely.
#   deepseek_r1 assumes the stream starts in reasoning and only leaves it at
#               </think>. With thinking off Granite emits no tags, so the
#               whole answer is billed as reasoning and content comes back
#               empty -- and only on the non-streaming path, which hides the
#               cause behind a structured-output failure.
VLLM_REASONING_PARSER="${VLLM_REASONING_PARSER:-qwen3}"

# qwen3_coder, NOT granite4, despite the model's name. The chat template
# emits XML tool calls
# (<tool_call><function=NAME><parameter=KEY>value</parameter></function>),
# and vLLM's granite4 parser runs json.loads() between the <tool_call> tags,
# raising JSONDecodeError on the '<' of <function=. qwen3_coder implements
# exactly this grammar.
#
# The failure is invisible to a named tool_choice, which routes through
# guided decoding and never consults the parser. Under tool_choice=auto,
# granite4 fails two ways: non-streaming loses the call and leaks raw XML
# into content, streaming raises inside extract_tool_calls_streaming and
# drops it.
VLLM_TOOL_PARSER="${VLLM_TOOL_PARSER:-qwen3_coder}"

# The template also has a low_effort switch reachable as
# reasoning_effort="low" (`low_effort = reasoning_effort == "low"`), so that
# kwarg grades verbosity and cannot turn thinking off: reasoning-effort-none
# would leave enable_thinking true. enable-thinking-false is the disable
# control; the low-effort third state is left unmeasured.
VLLM_CAP_REASONING="${VLLM_CAP_REASONING:-required}"
VLLM_CAP_TOOLS="${VLLM_CAP_TOOLS:-required}"
VLLM_CAP_REASONING_MODE="${VLLM_CAP_REASONING_MODE:-enable-thinking}"
VLLM_CAP_DISABLE_MODE="${VLLM_CAP_DISABLE_MODE:-enable-thinking-false}"
VLLM_CAP_SYSTEM_PROMPT="${VLLM_CAP_SYSTEM_PROMPT:-}"

# AuditBench and audit fitness decode at the checkpoint's sampling, from
# generation_config.json at the pinned revision.
VLLM_SAMPLING="${VLLM_SAMPLING:-temperature=1.0 top_p=0.95}"

# Paged-KV cost, a model fact: 64 layers x 8 KV heads x 128 head dim x 2
# (K+V) x 2 B. Every layer is full attention, so it is a flat 256 KiB/token
# with nothing bounded behind a window -- four times Qwen3.8-27B's.
VLLM_KV_BYTES_PER_TOKEN="${VLLM_KV_BYTES_PER_TOKEN:-262144}"

# Dense model: pinned on so a core bump cannot silently change the mode.
VLLM_PREFIX_CACHING="${VLLM_PREFIX_CACHING:-1}"
