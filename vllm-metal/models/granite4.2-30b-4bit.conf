# vLLM-Metal model config for IBM Granite 4.2 30B, MLX 4-bit.
#
# ibm-granite/granite-4.2-30b-q4-mlx: IBM's own MLX conversion, not a
# community requant -- the vendor publishes the MLX, GGUF, fp8, mxfp4, and
# nvfp4 builds side by side, so this profile and any future GGUF sibling
# share a first-party provenance. ~16.5 GB of weights.
#
# Granite 4.2 (2026-08-25) is a dense decoder-only transformer, unlike the
# hybrid Mamba-2 designs of Granite 4.0 and 4.1. That matters here: the
# Metal plugin cannot serve Mamba state layers (see the Nemotron 3.5
# Lightning conf), so only the 4.2 generation is servable on this host.
#
# 64 layers, 32 attention heads over 8 KV heads (GQA 4:1), 128 head dim,
# full attention on every layer -- no sliding window, no hybrid state.

VLLM_MODEL_REPO="${VLLM_MODEL_REPO:-ibm-granite/granite-4.2-30b-q4-mlx}"
VLLM_MODEL_REVISION="${VLLM_MODEL_REVISION:-d3f143b440062060eb05f7b8677ced5b4d9a8946}"
VLLM_SERVED_NAME="${VLLM_SERVED_NAME:-granite-4.2-30b-mlx}"

# The checkpoint's native max_position_embeddings. IBM documents a 512k
# extension for the 30B, but this checkpoint carries rope_scaling=null, so
# 131,072 is what the artifact actually declares. A longer operating point
# is a separate, evidenced change -- not a launch flag.
VLLM_MAX_LEN="${VLLM_MAX_LEN:-131072}"

# Granite 4.2 emits <think>...</think> and takes enable_thinking as a
# chat-template kwarg -- the Qwen3 grammar exactly. Neither obvious
# alternative works:
#
#   granite     is for Granite 3.x, which separated phases with the prose
#               markers "Here is my thought process:" / "Here is my
#               response:". Wrong generation entirely.
#   deepseek_r1 matches the tags but assumes the stream always starts in
#               reasoning and only leaves it at </think>. With thinking
#               off Granite emits no tags at all, so the whole answer is
#               billed as reasoning and content comes back empty. Measured
#               2026-09-05: the streaming path survives this, the
#               non-streaming path does not, so the capability gate failed
#               structured_json and json_schema on empty content while
#               thinking_disabled passed -- a split that hides the cause.
#
# qwen3 reads chat_template_kwargs.enable_thinking and configures itself
# per request, which is the behavior this model needs. It is a combined
# reasoning+tool engine, but tools stay with granite4 below and the tool
# checks pass under that pairing.
VLLM_REASONING_PARSER="${VLLM_REASONING_PARSER:-qwen3}"
VLLM_TOOL_PARSER="${VLLM_TOOL_PARSER:-granite4}"

# The chat template defines enable_thinking (default true) and a separate
# low_effort switch, also reachable as reasoning_effort="low". The gate
# exercises the on/off pair; the low-effort third state has no capability
# vocabulary and is left unmeasured.
VLLM_CAP_REASONING="${VLLM_CAP_REASONING:-required}"
VLLM_CAP_TOOLS="${VLLM_CAP_TOOLS:-required}"
VLLM_CAP_REASONING_MODE="${VLLM_CAP_REASONING_MODE:-enable-thinking}"
VLLM_CAP_DISABLE_MODE="${VLLM_CAP_DISABLE_MODE:-enable-thinking-false}"
VLLM_CAP_SYSTEM_PROMPT="${VLLM_CAP_SYSTEM_PROMPT:-}"

# Paged-KV cost, a model fact from the architecture:
# 64 layers x 8 KV heads x 128 head dim x 2 (K+V) x 2 B. Every layer is
# full attention, so this is a flat per-token cost with nothing bounded
# behind a window -- 256 KiB/token, four times Qwen3.8-27B's, which is
# what a 30B dense model with no attention sparsity costs.
VLLM_KV_BYTES_PER_TOKEN="${VLLM_KV_BYTES_PER_TOKEN:-262144}"

# Dense model: the 0.28.0 engine default is APC on. The explicit 1 pins
# it across core bumps rather than trusting the default, matching the
# other dense profile on this host.
VLLM_PREFIX_CACHING="${VLLM_PREFIX_CACHING:-1}"
