# vLLM-Metal model config for Gemma 4 31B, MLX 4-bit.
#
# mlx-community/gemma-4-31b-it-4bit: the largest dense Gemma 4, standard MLX
# 4-bit affine quantization, ~17.5 GiB of weights. The most-downloaded MLX
# conversion of the family.
#
# Dense gemma4: 60 layers, 10 full-attention (interval 6), the rest
# 1024-token sliding window; 16 KV heads x 256 head dim.

VLLM_MODEL_REPO="${VLLM_MODEL_REPO:-mlx-community/gemma-4-31b-it-4bit}"
VLLM_MODEL_REVISION="${VLLM_MODEL_REVISION:-696d436c404745a59f30e4939a658162b0a9e57f}"
VLLM_SERVED_NAME="${VLLM_SERVED_NAME:-gemma4-31b-mlx}"

# The checkpoint's native max_position_embeddings.
VLLM_MAX_LEN="${VLLM_MAX_LEN:-262144}"

# Gemma 4 parsers are bundled in vLLM 0.27.
VLLM_REASONING_PARSER="${VLLM_REASONING_PARSER:-gemma4}"
VLLM_TOOL_PARSER="${VLLM_TOOL_PARSER:-gemma4}"

VLLM_CAP_REASONING="${VLLM_CAP_REASONING:-required}"
VLLM_CAP_TOOLS="${VLLM_CAP_TOOLS:-required}"
VLLM_CAP_REASONING_MODE="${VLLM_CAP_REASONING_MODE:-enable-thinking}"
VLLM_CAP_DISABLE_MODE="${VLLM_CAP_DISABLE_MODE:-enable-thinking-false}"
VLLM_CAP_SYSTEM_PROMPT="${VLLM_CAP_SYSTEM_PROMPT:-}"

# Growing paged-KV cost from the 10 full-attention layers:
# 10 x 16 KV heads x 256 head dim x 2 (K+V) x 2 B. The sliding-window
# layers add a bounded ~3.3 GiB per slot on top, not a per-token cost.
VLLM_KV_BYTES_PER_TOKEN="${VLLM_KV_BYTES_PER_TOKEN:-163840}"

# Proven operating point: the 0.27.1 engine default for dense models is
# APC on, and the canonical AuditBench run measured that state. The
# explicit 1 pins it across core bumps instead of trusting the default.
VLLM_PREFIX_CACHING="${VLLM_PREFIX_CACHING:-1}"
