# DeepSeek V4.1 Flash, ds4's calibrated Q2. 152 GiB of main weights plus
# 189 GiB of Engram tables that are always read from the file, never resident.
DS4_MODEL_REPO="${DS4_MODEL_REPO:-antirez/deepseek-v4.1-flash-gguf}"
DS4_MODEL_REVISION="${DS4_MODEL_REVISION:-dd8a266f7145edc19e2334b46e19b6821f221dc7}"
DS4_MODEL_FILE="${DS4_MODEL_FILE:-DeepSeek-V4.1-Flash-Q2.gguf}"
DS4_MODEL_SHA256="${DS4_MODEL_SHA256:-1ce6a8f8806205c13330d7ca287bd198331dc5ca35ccc5d8a9a92a188a6f6f42}"
# Resident weights in GiB; the launcher streams from SSD when they do not fit.
DS4_RESIDENT_GIB="${DS4_RESIDENT_GIB:-152}"
# Served id: the first /v1/models card; later cards are aliases.
DS4_SERVED_NAME="${DS4_SERVED_NAME:-deepseek-v4.1-flash}"
# ds4 documents built-in MTP for GLM and Qwen only, and no DSpark for V4.1.
DS4_MTP="${DS4_MTP:-0}"
DS4_CTX="${DS4_CTX:-262144}"
# Disk KV checkpoint budget in MiB.
DS4_KV_DISK_MB="${DS4_KV_DISK_MB:-32768}"

# Capability expectations. ds4 selects non-thinking with thinking={type:disabled}
# on every model it serves (./ds4-server --help thinking).
DS4_CAP_REASONING="${DS4_CAP_REASONING:-required}"
DS4_CAP_TOOLS="${DS4_CAP_TOOLS:-required}"
DS4_CAP_REASONING_MODE="${DS4_CAP_REASONING_MODE:-default}"
DS4_CAP_DISABLE_MODE="${DS4_CAP_DISABLE_MODE:-thinking-disabled}"
DS4_CAP_SYSTEM_PROMPT="${DS4_CAP_SYSTEM_PROMPT:-}"

# Reasoning effort with thinking on: ds4 sends V4.1 an effort of 75 for
# reasoning_effort high (also its default) and 100 for max, which V4.1 keeps
# at this context. The generated opencode entry offers them as variants.
DS4_REASONING_EFFORTS="${DS4_REASONING_EFFORTS:-high max}"

# The model card's recommended sampling (deepseek-ai/DeepSeek-V4.1-Flash at
# dba1be0a40aa45a94ad051997016db3960a90277 ships no generation_config.json):
# temperature 1.0, top_p 0.95 or 1.0; 0.95 is what its agentic evaluations use.
# min_p=0 is stated because ds4 applies its own min_p 0.05 when a request
# omits it.
DS4_SAMPLING="${DS4_SAMPLING:-temperature=1.0 top_p=0.95 min_p=0}"
