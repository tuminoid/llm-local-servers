# DeepSeek V4 Flash 0731 (284B-A13B), ds4's imatrix Q2: IQ2_XXS gate/up and
# Q2_K down routed experts, Q8 attention, shared experts and output.
DS4_MODEL_REPO="${DS4_MODEL_REPO:-antirez/deepseek-v4-gguf}"
DS4_MODEL_REVISION="${DS4_MODEL_REVISION:-f71f23d552d664e523b422157b2befbf74040380}"
DS4_MODEL_FILE="${DS4_MODEL_FILE:-DeepSeek-V4-Flash-IQ2XXS-w2Q2K-AProjQ8-SExpQ8-OutQ8-chat-v2-imatrix-0731.gguf}"
DS4_MODEL_SHA256="${DS4_MODEL_SHA256:-ca22ae2f838e14077c22bc1c1417b71b45b5e5a3687bd96c2ac6e17fdb6261c0}"
# Resident weights in GiB; the launcher streams from SSD when they do not fit.
DS4_RESIDENT_GIB="${DS4_RESIDENT_GIB:-81}"
# Served id: the first /v1/models card; later cards are aliases.
DS4_SERVED_NAME="${DS4_SERVED_NAME:-deepseek-v4-flash}"
# No built-in MTP. Its DSpark drafter (DeepSeek-V4-Flash-DSpark-support-0731.gguf
# in the same repo) stalled inside every tool call at exact sampling
# (0.01-0.9 tok/s), so it is not wired; retest after a ds4 DSpark change.
DS4_MTP="${DS4_MTP:-0}"
DS4_CTX="${DS4_CTX:-262144}"

# Capability expectations. ds4 selects non-thinking with thinking={type:disabled}
# on every model it serves (./ds4-server --help thinking).
DS4_CAP_REASONING="${DS4_CAP_REASONING:-required}"
DS4_CAP_TOOLS="${DS4_CAP_TOOLS:-required}"
DS4_CAP_REASONING_MODE="${DS4_CAP_REASONING_MODE:-default}"
DS4_CAP_DISABLE_MODE="${DS4_CAP_DISABLE_MODE:-thinking-disabled}"
DS4_CAP_SYSTEM_PROMPT="${DS4_CAP_SYSTEM_PROMPT:-}"

# generation_config.json of deepseek-ai/DeepSeek-V4-Flash at
# 60d8d70770c6776ff598c94bb586a859a38244f1.
# min_p=0 is stated because ds4 applies its own min_p 0.05 when a request
# omits it.
DS4_SAMPLING="${DS4_SAMPLING:-temperature=1.0 top_p=1.0 min_p=0}"
