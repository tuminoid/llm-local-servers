# Qwen3.8 Flash Next, ds4's Q4: imatrix Q4_K gate/up and MXFP4 down experts,
# MTP included. 69.73 GiB resident; its 95.37 GiB BF16 n-gram table stays in
# the file and is read per token.
DS4_MODEL_REPO="${DS4_MODEL_REPO:-antirez/qwen3.8-flash-next-gguf}"
DS4_MODEL_REVISION="${DS4_MODEL_REVISION:-d600fe1a43d2e1cdcadb85144ce3142f66f9eefe}"
DS4_MODEL_FILE="${DS4_MODEL_FILE:-Qwen3.8-Flash-Next-Q4.gguf}"
DS4_MODEL_SHA256="${DS4_MODEL_SHA256:-680944460a8cbe93ba8b6d7b6107213ffb7e22320bd913000e563ca0a0f25a8a}"
# Resident weights in GiB; the launcher streams from SSD when they do not fit.
DS4_RESIDENT_GIB="${DS4_RESIDENT_GIB:-70}"
# Served id: the first /v1/models card; later cards are aliases.
DS4_SERVED_NAME="${DS4_SERVED_NAME:-qwen3.8-flash-next}"
# Built-in MTP at exact sampling: +28% mid-session decode on the M5 Max.
DS4_MTP="${DS4_MTP:-1}"
DS4_CTX="${DS4_CTX:-262144}"

# Capability expectations. ds4 selects non-thinking with thinking={type:disabled}
# on every model it serves (./ds4-server --help thinking).
DS4_CAP_REASONING="${DS4_CAP_REASONING:-required}"
DS4_CAP_TOOLS="${DS4_CAP_TOOLS:-required}"
DS4_CAP_REASONING_MODE="${DS4_CAP_REASONING_MODE:-default}"
DS4_CAP_DISABLE_MODE="${DS4_CAP_DISABLE_MODE:-thinking-disabled}"
DS4_CAP_SYSTEM_PROMPT="${DS4_CAP_SYSTEM_PROMPT:-}"

# generation_config.json of Qwen/Qwen3.8-Flash-Next at
# de4b8e4d43b917e7706784d8bb445c9af86a3540.
# min_p=0 is stated because ds4 applies its own min_p 0.05 when a request
# omits it.
DS4_SAMPLING="${DS4_SAMPLING:-temperature=1.0 top_p=0.95 top_k=20 min_p=0}"
