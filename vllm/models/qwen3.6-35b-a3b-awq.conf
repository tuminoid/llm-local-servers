# vLLM server config for qwen3.6-35b-a3b-awq
#
# QuantTrio/Qwen3.6-35B-A3B-AWQ: 36B total, 3B active (256 experts, 8 per
# token), AWQ 4-bit weights at group size 128. Ungated, Apache 2.0.
#
# Every value uses ${VAR:-default} so the environment wins over this file.
#
# Model-portable settings only. Utilization, sequence count, batch size and
# attention backend are host policy and live in ../start.sh.
#
# Sizing, for whichever host runs it: weights are 23.7 GiB. This is a hybrid
# model -- 30 of its 40 layers are GatedDeltaNet linear attention and allocate
# no per-token KV at all. Only the 10 full-attention layers do, at 10 x 2 KV
# heads x 256 head dim x 2 (K+V) x 2 B = 20 KiB/token, so the full context
# below costs just 5.0 GiB. Roughly 31 GiB all-in, the smallest footprint of
# any capable model at 256k, which is what makes two instances viable on one
# 80 GB card (62.5 GiB for the pair).
#
# The linear layers are not free, they are just billed differently: each holds
# a fixed recurrent state per *sequence* rather than per token, 1.05 MiB per
# layer, so 31.4 MiB per sequence and ~251 MiB at the large-card profile's 8
# sequences. Raising max-num-seqs raises that linearly, unlike KV.
#
# Notes specific to this model:
#
# - Hybrid (IsHybrid) means the per-token arithmetic above does not describe
#   the whole footprint. This is the case vllm/AGENTS.md calls out
#   under Known limits.
# - vLLM raises NotImplementedError on `--mamba-cache-mode=all` for this
#   architecture and tells you to use `align`. Do not set the former.
# - Architecture is Qwen3_5MoeForConditionalGeneration, registered in vLLM
#   0.26. It is multimodal (it carries a vision config), so a bare text
#   deployment still loads the vision tower.
#
# Verified on the A100 test host (sm_80): FLASH_ATTN for the 10 full-attention
# layers, GatedDeltaNet for the other 30, fp16 weights per the AWQ config,
# utilization 0.98, 78,571 MiB in use, KV pool 2,747,310 tokens (10.48x a
# full-length sequence). Both parsers checked against live requests. The
# fastest model in this directory on the A100; figures in
# vllm/AGENTS.md.

VLLM_MODEL="${VLLM_MODEL:-QuantTrio/Qwen3.6-35B-A3B-AWQ}"
VLLM_MODEL_REVISION="${VLLM_MODEL_REVISION:-119886a1072372348f73ef0df2d801cdcc0f455b}"
VLLM_SERVED_NAME="${VLLM_SERVED_NAME:-qwen3.6-35b-a3b-awq}"

# The model's own max_position_embeddings, so no RoPE extrapolation beyond
# training. KV must hold one whole sequence of this length or vLLM refuses to
# start.
VLLM_MAX_LEN="${VLLM_MAX_LEN:-262144}"

# bf16 KV. At 20 KiB/token this model does not need fp8 to fit its context on
# any card that can hold the weights, and asking for fp8 would only restrict
# which hosts can serve it (fp8 KV needs sm_89+).
VLLM_KV_DTYPE="${VLLM_KV_DTYPE:-auto}"

# Thinking model: the chat template opens a <think> block and closes it before
# the answer. Unparsed, </think> leaks into message.content.
VLLM_REASONING_PARSER="${VLLM_REASONING_PARSER:-qwen3}"

# The template emits <tool_call><function=name>...</function></tool_call>, the
# XML dialect rather than the JSON one. qwen3_xml and qwen3_coder resolve to
# the same Qwen3EngineToolParser in vLLM 0.26; the former names what this
# template actually produces.
VLLM_TOOL_PARSER="${VLLM_TOOL_PARSER:-qwen3_xml}"

VLLM_CAP_REASONING="${VLLM_CAP_REASONING:-required}"
VLLM_CAP_TOOLS="${VLLM_CAP_TOOLS:-required}"
VLLM_CAP_REASONING_MODE="${VLLM_CAP_REASONING_MODE:-default}"
VLLM_CAP_DISABLE_MODE="${VLLM_CAP_DISABLE_MODE:-enable-thinking-false}"
VLLM_CAP_SYSTEM_PROMPT="${VLLM_CAP_SYSTEM_PROMPT:-}"

# Serving default: align-mode APC ON, decided 2026-08-26 on
# audit-conversation evidence measured on the A100 at this digest
# (vllm/BENCHMARKS.md): 4.5x audit conversations/hour over cache-off
# (18.2 -> 82.1/h at ~165k final depth, 89.7% of prompt tokens served
# from cache per the engine's own counters), with measured align costs
# of ~1% pool (2,714,989 vs 2,747,310 tokens) and ~1% decode, no
# per-request decay across ~30 requests. vLLM 0.27.1 auto-selects Mamba
# cache mode 'align' and flags it experimental; align numerics differ
# from cache-off from the first generated token, so cache-off canonical
# rates stay authoritative for cache-off only. The explicit 1 also pins
# the resolved mode across core bumps. Set 0 to force the old cache-off
# behavior.
VLLM_PREFIX_CACHING="${VLLM_PREFIX_CACHING:-1}"
