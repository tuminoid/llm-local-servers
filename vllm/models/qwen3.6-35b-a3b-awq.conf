# vLLM server config for qwen3.6-35b-a3b-awq
#
# QuantTrio/Qwen3.6-35B-A3B-AWQ: 36B total, 3B active MoE, AWQ 4-bit.
# Ungated, Apache 2.0.
#
# Hybrid model (IsHybrid): 30 of 40 layers are GatedDeltaNet linear
# attention and allocate no per-token KV, so per-token arithmetic does not
# describe the whole footprint -- the case vllm/AGENTS.md calls out under
# Known limits. The linear layers instead hold a fixed recurrent state per
# *sequence* (1.05 MiB/layer), which grows with max-num-seqs, not with KV.
# Smallest footprint of any capable model at 256k, which makes two
# instances viable on one 80 GB card. Canonical sizing/rates in
# vllm/BENCHMARKS.md.
#
# Architecture is Qwen3_5MoeForConditionalGeneration (vLLM 0.26). It carries
# a vision config, so a bare text deployment still loads the vision tower.
#
# vLLM raises NotImplementedError on `--mamba-cache-mode=all` for this
# architecture and tells you to use `align`. Do not set the former.

VLLM_MODEL="${VLLM_MODEL:-QuantTrio/Qwen3.6-35B-A3B-AWQ}"
VLLM_MODEL_REVISION="${VLLM_MODEL_REVISION:-119886a1072372348f73ef0df2d801cdcc0f455b}"
VLLM_SERVED_NAME="${VLLM_SERVED_NAME:-qwen3.6-35b-a3b-awq}"

# The model's own max_position_embeddings, so no RoPE extrapolation beyond
# training. KV must hold one whole sequence of this length or vLLM refuses to
# start.
VLLM_MAX_LEN="${VLLM_MAX_LEN:-262144}"

# bf16 KV. At 20 KiB/token this model does not need fp8 to fit its context on
# any card that can hold the weights, and asking for fp8 would only restrict
# which hosts can serve it (fp8 KV needs sm_89+).
VLLM_KV_DTYPE="${VLLM_KV_DTYPE:-auto}"

# Thinking model: the chat template opens a <think> block and closes it before
# the answer. Unparsed, </think> leaks into message.content.
VLLM_REASONING_PARSER="${VLLM_REASONING_PARSER:-qwen3}"

# The template emits <tool_call><function=name>...</function></tool_call>, the
# XML dialect rather than the JSON one. qwen3_xml and qwen3_coder resolve to
# the same Qwen3EngineToolParser in vLLM 0.26; the former names what this
# template actually produces.
VLLM_TOOL_PARSER="${VLLM_TOOL_PARSER:-qwen3_xml}"

VLLM_CAP_REASONING="${VLLM_CAP_REASONING:-required}"
VLLM_CAP_TOOLS="${VLLM_CAP_TOOLS:-required}"
VLLM_CAP_REASONING_MODE="${VLLM_CAP_REASONING_MODE:-default}"
VLLM_CAP_DISABLE_MODE="${VLLM_CAP_DISABLE_MODE:-enable-thinking-false}"
VLLM_CAP_SYSTEM_PROMPT="${VLLM_CAP_SYSTEM_PROMPT:-}"

# Serving default: align-mode APC ON, decided 2026-08-26 on A100 audit
# evidence at this digest: 4.5x audit conversations/hour over cache-off
# (18.2 -> 82.1/h at ~165k depth, 89.7% of prompt tokens from cache), for
# ~1% pool and ~1% decode cost. vLLM 0.27.1 auto-selects Mamba cache mode
# 'align' and flags it experimental; align numerics differ from cache-off
# from the first generated token, so cache-off canonical rates stay
# authoritative for cache-off only. The explicit 1 pins the resolved mode
# across core bumps. Set 0 to force the old cache-off behavior.
VLLM_PREFIX_CACHING="${VLLM_PREFIX_CACHING:-1}"
