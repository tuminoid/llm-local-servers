# vLLM server config for qwen3.8-27b-dflash2
#
# The qwen3.8-27b profile with DFlash 2 speculative decoding: the same
# Qwen/Qwen3.8-27B-FP8 target and revision as ../models/qwen3.8-27b.conf
# (see that file for the architecture and sizing notes), plus the official
# z-lab drafter. The plain profile stays the control and fallback; this
# profile exists because the drafter more than doubles decode on
# bandwidth-bound dense FP8 hosts.
#
# Requires vLLM 0.28.0 or newer (DFlash 2 integration) and ninja in the
# serving venv: the draft head is torch.compiled at engine init and
# inductor shells out to ninja. The launcher puts the venv bin on PATH.
#
# Drafter facts: z-lab/Qwen3.8-27B-DFlash2, 5 layers, block size 8,
# selector top-k 16, 3.85 GB safetensors, trained for the base Qwen3.8-27B
# checkpoint and measured compatible with the FP8 target.
# num_speculative_tokens is mandatory when a draft model is named (nothing
# derives it from the drafter's block size); 7 is the drafter's intended
# depth and the measured operating point.
#
# Measured on the A100 (sm_80), vLLM 0.28.0, transformers 5.15.1, in the
# adoption trial: decode 114.5/221.0/404.0/602.0 tok/s at 1/2/4/8 streams
# against the plain profile's 48.6/93.4/180.9/343.5 (2.36x/2.37x/2.23x/
# 1.75x); mean acceptance length ~3.6 of 7 drafted; greedy output
# byte-identical to the plain path on a fixed prompt; Capability Check v1
# full pass through the speculative path. The drafter costs KV: the APC
# pool drops from 743,381 to 512,493 tokens (1.96 native contexts), which
# still fits the deep-audit 2x candidate but retires the 4x one. Prefill
# is untouched by speculation.
#
# Every value uses ${VAR:-default} so the environment wins over this file.

VLLM_MODEL="${VLLM_MODEL:-Qwen/Qwen3.8-27B-FP8}"
VLLM_MODEL_REVISION="${VLLM_MODEL_REVISION:-017b9c7af6b5689d5dd426a76e0bc077eb5ca20a}"
VLLM_SERVED_NAME="${VLLM_SERVED_NAME:-qwen3.8-27b}"

VLLM_MAX_LEN="${VLLM_MAX_LEN:-262144}"
VLLM_KV_DTYPE="${VLLM_KV_DTYPE:-auto}"
VLLM_REASONING_PARSER="${VLLM_REASONING_PARSER:-qwen3}"
VLLM_TOOL_PARSER="${VLLM_TOOL_PARSER:-qwen3_xml}"

VLLM_CAP_REASONING="${VLLM_CAP_REASONING:-required}"
VLLM_CAP_TOOLS="${VLLM_CAP_TOOLS:-required}"
VLLM_CAP_REASONING_MODE="${VLLM_CAP_REASONING_MODE:-default}"
VLLM_CAP_DISABLE_MODE="${VLLM_CAP_DISABLE_MODE:-enable-thinking-false}"
VLLM_CAP_SYSTEM_PROMPT="${VLLM_CAP_SYSTEM_PROMPT:-}"

# Same align-mode APC pin and rationale as the plain profile.
VLLM_PREFIX_CACHING="${VLLM_PREFIX_CACHING:-1}"

# One argv element of JSON; the launcher passes it to --speculative-config
# verbatim. The method is auto-detected from the drafter name. The revision
# pins the drafter artifact like any model revision. Two-step default: a
# literal `}` inside ${VAR:-...} breaks the expansion when the environment
# overrides it, and the JSON stays whitespace-free so it remains a single
# shell token for the remote VLLM_ENV forwarding.
VLLM_SPECULATIVE_CONFIG_DEFAULT='{"model":"z-lab/Qwen3.8-27B-DFlash2","revision":"50307d4c4cde6860d4eee73e2547cd786fe8e8a4","num_speculative_tokens":7}'
VLLM_SPECULATIVE_CONFIG="${VLLM_SPECULATIVE_CONFIG:-${VLLM_SPECULATIVE_CONFIG_DEFAULT}}"
