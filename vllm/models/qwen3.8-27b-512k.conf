# vLLM profile for Qwen3.8-27B-FP8 at 512 Ki tokens.
#
# EXPLORATORY, not canonical. Reintroduced 2026-09-01 as a middle point
# between the retired 320k (factor 1.25, measured clean) and 720k (factor
# 2.8125, one-request, never timed) profiles, whose confs were recovered
# from the ai monorepo history at f07bc09~1. The override shape below is
# the exact nested form vLLM 0.27.1 accepted for those profiles; only the
# factor and max_len differ. This profile itself has NOT been run: no pool,
# no deep-context proof, no Capability Check v1 record yet. It earns no
# README/BENCHMARKS inventory row until those pass on the A100.
#
# Why 512k: the target is one deep conversation (up to ~400-500k) running
# alongside one or two shorter ones, not maximum single-request depth. The
# KV pool is util-bound and effectively max_len-independent -- the align-APC
# base conf measured 742,613 tokens on this host -- so raising max_len does
# NOT add aggregate capacity; it only permits a single sequence to exceed
# the native 262,144. Derived layout at this pool: one ~512k sequence leaves
# ~218k, i.e. one 400k conversation plus one ~340k, or 400k plus two ~170k.
# VLLM_MAX_SEQS stays host policy (8 on the A100).
#
# This extends the native 262,144-token context with static YaRN at factor
# 2.0 (524288 / 262144). Static scaling also applies to short requests, so
# use the native profile when the extra context is not needed -- and note
# most audit turns start well below 262k, so the whole early conversation
# pays the scaling tax.
#
# UNVERIFIED RISKS, to close before trusting this profile (mission: deep
# context is the product, and a config that parses 512k but reasons worse
# at depth is broken, not "mostly fine"):
# - Quality at factor 2.0 is unproven. The 320k/1.25 run only established
#   throughput and pool, never reasoning quality; 2.0 is a larger stretch.
#   Gate with a deep AuditBench run plus Capability Check v1 at depth before
#   promoting.
# - Concurrent full-length requests at this max_len were never timed on any
#   Qwen3.8 profile (see BENCHMARKS.md).
# - Cost is inherent: this dense FP8 model (W8A16/Marlin on sm_80) prefills
#   ~2.45k tok/s -- roughly 165 s to fill 400k -- and decodes ~48 tok/s at
#   one stream, so deep single conversations are slow by design.

VLLM_SERVED_NAME="${VLLM_SERVED_NAME:-qwen3.8-27b-512k}"
VLLM_MAX_LEN="${VLLM_MAX_LEN:-524288}"
VLLM_ALLOW_LONG_MAX_MODEL_LEN="${VLLM_ALLOW_LONG_MAX_MODEL_LEN:-1}"

_QWEN38_YARN_OVERRIDES='{"text_config":{"rope_parameters":{"mrope_interleaved":true,"mrope_section":[11,11,10],"rope_type":"yarn","rope_theta":10000000,"partial_rotary_factor":0.25,"factor":2.0,"original_max_position_embeddings":262144}}}'
VLLM_HF_OVERRIDES="${VLLM_HF_OVERRIDES:-${_QWEN38_YARN_OVERRIDES}}"
unset _QWEN38_YARN_OVERRIDES

# shellcheck source=qwen3.8-27b.conf
source "${BASH_SOURCE[0]%/*}/qwen3.8-27b.conf"
