# vLLM profile for Qwen3.8-27B-FP8 at 512 Ki tokens.
#
# EXPLORATORY, not canonical: no deep-context proof and no AuditBench result,
# so it earns no README/BENCHMARKS inventory row yet. The override shape below
# is the exact nested form vLLM accepted for the retired 320k/720k profiles;
# only the factor and max_len differ.
#
# Raising max_len does NOT add aggregate capacity. The KV pool is util-bound
# and effectively max_len-independent (748,760 tokens measured here), so this
# only permits a single sequence to exceed the native 262,144: one ~512k
# sequence leaves ~218k for the rest.
#
# Static YaRN at factor 2.0 also applies to short requests, so use the native
# profile unless one request truly needs the depth -- most audit turns start
# well below 262k and would pay the scaling tax for nothing.
#
# UNVERIFIED RISKS, to close before trusting this profile:
# - Quality at factor 2.0 is unproven; the 320k/1.25 run established only
#   throughput and pool. Gate with a deep AuditBench run plus a capability
#   check at depth before promoting.
# - Concurrent full-length requests at this max_len were never timed on any
#   Qwen3.8 profile.
# - Cost is inherent: ~2.45k tok/s prefill (roughly 165 s to fill 400k) and
#   ~48 tok/s decode at one stream.
# - Scaling costs schema enforcement: the capability gate fails here as
#   `whitespace_runaway` (reproducible 2/2) where the native profile passes
#   `enforced` on the same weights, revision and venv. Grammar-constrained
#   structured output does not survive the stretch. Retest with the depth run.

VLLM_SERVED_NAME="${VLLM_SERVED_NAME:-qwen3.8-27b-512k}"
VLLM_MAX_LEN="${VLLM_MAX_LEN:-524288}"
VLLM_ALLOW_LONG_MAX_MODEL_LEN="${VLLM_ALLOW_LONG_MAX_MODEL_LEN:-1}"

_QWEN38_YARN_OVERRIDES='{"text_config":{"rope_parameters":{"mrope_interleaved":true,"mrope_section":[11,11,10],"rope_type":"yarn","rope_theta":10000000,"partial_rotary_factor":0.25,"factor":2.0,"original_max_position_embeddings":262144}}}'
VLLM_HF_OVERRIDES="${VLLM_HF_OVERRIDES:-${_QWEN38_YARN_OVERRIDES}}"
unset _QWEN38_YARN_OVERRIDES

# shellcheck source=qwen3.8-27b.conf
source "${BASH_SOURCE[0]%/*}/qwen3.8-27b.conf"
