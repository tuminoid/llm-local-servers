# vLLM server config for qwen3.8-27b
#
# dbirks/Qwen3.8-27B-W4A16-AutoRound: dense 27B hybrid VLM quantized to
# compressed-tensors W4A16 (pack-quantized, group 128, symmetric, 18.14 GiB),
# served text only (the launcher skips the vision tower). The
# 160k/320k/720k YaRN context profiles were retired 2026-08-26 (overrides
# and pools in git history); qwen3.8-27b-512k.conf sources this file and
# keeps the FP8 weights.
#
# Plain control and fallback. The checkpoint's MTP draft head is
# deliberately NOT enabled here; the speculative profile is
# ../models/qwen3.8-27b-dflash2.conf.
#
# Replaced Qwen/Qwen3.8-27B-FP8 (017b9c7a) on 2026-10-10. On A100 (sm_80)
# FP8 ran W8A16 through Marlin, since the card has no FP8 tensor cores, so
# the ~165k report decode read about 27 GB of weights per token. W4A16
# Marlin halves those reads: report decode 49.7 against 36.7 tok/s at one
# stream, sessions/h flat at 1x and +21% at 4x, Capability Check v2 passing
# on vLLM 0.30.0 and 0.31.0. Canonical rates and pool are in
# vllm/BENCHMARKS.md.

VLLM_MODEL="${VLLM_MODEL:-dbirks/Qwen3.8-27B-W4A16-AutoRound}"
VLLM_MODEL_REVISION="${VLLM_MODEL_REVISION:-1f05c441c4e64ae0549de44fa9ea5a6d43610314}"
VLLM_SERVED_NAME="${VLLM_SERVED_NAME:-qwen3.8-27b}"

# The model's own max_position_embeddings, so no RoPE extrapolation
# beyond training. KV must hold one whole sequence of this length or
# vLLM refuses to start.
VLLM_MAX_LEN="${VLLM_MAX_LEN:-262144}"

# Controls the KV cache separately from the FP8 weights: fp8 KV needs
# sm_89+, so the A100 must use auto (bf16 KV).
VLLM_KV_DTYPE="${VLLM_KV_DTYPE:-auto}"

# Thinking is on by default in the chat template. Unparsed, </think>
# leaks into message.content.
VLLM_REASONING_PARSER="${VLLM_REASONING_PARSER:-qwen3}"

# The template emits <tool_call><function=name>...</function></tool_call>.
# qwen3_xml and qwen3_coder resolve to the same parser in vLLM 0.27.1;
# the former names the emitted XML dialect.
VLLM_TOOL_PARSER="${VLLM_TOOL_PARSER:-qwen3_xml}"

VLLM_CAP_REASONING="${VLLM_CAP_REASONING:-required}"
VLLM_CAP_TOOLS="${VLLM_CAP_TOOLS:-required}"
VLLM_CAP_REASONING_MODE="${VLLM_CAP_REASONING_MODE:-default}"
VLLM_CAP_DISABLE_MODE="${VLLM_CAP_DISABLE_MODE:-enable-thinking-false}"
VLLM_CAP_SYSTEM_PROMPT="${VLLM_CAP_SYSTEM_PROMPT:-}"

# AuditBench and audit fitness decode at the checkpoint's sampling, from
# generation_config.json at the pinned revision.
VLLM_SAMPLING="${VLLM_SAMPLING:-temperature=1.0 top_p=0.95 top_k=20}"

# Qwen3.8's template accepts exactly low, medium and xhigh reasoning
# effort with thinking on: high is invalid, and unset means xhigh. The
# generated opencode entry offers them as variants.
VLLM_REASONING_EFFORTS="${VLLM_REASONING_EFFORTS:-low medium xhigh}"

# Hybrid GDN: the 0.27.1 engine default is APC off for hybrid models;
# the explicit pin keeps the resolved mode stable across core bumps
# (vLLM main resolves supported hybrids to align-mode APC ON). Align
# mode legitimately changes temp-0 outputs from the first token.
# Adopted 2026-08-27 on A100 evidence; audit-replay win and correctness
# gate are in vllm/BENCHMARKS.md (audit replay section).
VLLM_PREFIX_CACHING="${VLLM_PREFIX_CACHING:-1}"
