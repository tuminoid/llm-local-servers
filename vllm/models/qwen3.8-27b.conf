# vLLM server config for qwen3.8-27b
#
# Qwen/Qwen3.8-27B-FP8: official dense 27B vision-language model, with
# fine-grained FP8 weights at block size 128. Ungated, Apache 2.0.
#
# Every value uses ${VAR:-default} so the environment wins over this file.
#
# Model-portable settings only. Utilization, sequence count, batch size and
# attention backend are host policy and live in ../start.sh.
#
# Sizing, for whichever host runs it: the weight shards total 28.75 GiB. This
# is a hybrid model -- 48 of its 64 layers are GatedDeltaNet linear attention
# and allocate no per-token KV. Only the 16 full-attention layers do, at
# 16 x 4 KV heads x 256 head dim x 2 (K+V) x 2 B = 64 KiB/token, so the native
# context below costs 16.0 GiB of bf16 KV per sequence.
#
# The linear layers instead hold fixed recurrent state per sequence:
# 48 value heads x 128 value dim x 128 key dim x 4 B = 3 MiB per layer,
# or 144 MiB across 48 layers, plus a small convolution state. At the
# large-card profile's eight sequences that is roughly 1.1 GiB.
#
# Two native-length sequences fit in the measured A100 cache: vLLM allocated
# 46.26 GiB / 749,204 tokens, 2.86x the 262,144 floor. This is the only
# qwen3.8 config: the 160k/320k/720k context profiles were retired
# 2026-08-26 (their YaRN overrides and measured pools are in git history).
#
# Notes specific to this model:
#
# - Architecture is Qwen3_5ForConditionalGeneration, implemented natively by
#   vLLM 0.27.1. It is multimodal, so text-only serving still loads the vision
#   tower.
# - On A100 (sm_80), vLLM runs these FP8 weights as W8A16 through Marlin; the
#   card has no native FP8 tensor cores.
# - The checkpoint includes an MTP draft head, but speculative decoding is
#   deliberately not enabled in this baseline. Measure it separately rather
#   than silently changing the comparison.
#
# Verified on the A100 test host (sm_80), vLLM 0.27.1 and Transformers 5.14.1:
# FLASH_ATTN for the 16 full-attention layers, GatedDeltaNet for the other 48,
# Marlin FP8 weight-only execution, bf16 KV, utilization 0.98, 78,027 MiB in
# use after startup, and the 749,204-token pool above. Reasoning and structured
# tool calls both passed live requests. Three benchmark samples were stable:
# 2,946-2,980 tok/s short prefill, 2,437-2,461 long prefill, 48.1 tok/s decode,
# and 3.72x aggregate decode at four streams. Full figures are in
# vllm/BENCHMARKS.md.

VLLM_MODEL="${VLLM_MODEL:-Qwen/Qwen3.8-27B-FP8}"
VLLM_MODEL_REVISION="${VLLM_MODEL_REVISION:-017b9c7af6b5689d5dd426a76e0bc077eb5ca20a}"
VLLM_SERVED_NAME="${VLLM_SERVED_NAME:-qwen3.8-27b}"

# The model's own max_position_embeddings, so no RoPE extrapolation beyond
# training. KV must hold one whole sequence of this length or vLLM refuses to
# start.
VLLM_MAX_LEN="${VLLM_MAX_LEN:-262144}"

# bf16 KV on the A100. Unlike the FP8 checkpoint name, this setting controls
# the separate KV cache: fp8 KV requires sm_89+, so the A100 must use auto.
# Two native-length bf16 caches cost 32 GiB; the measured pool holds 2.86x.
VLLM_KV_DTYPE="${VLLM_KV_DTYPE:-auto}"

# Thinking is enabled by default in the chat template. Unparsed, </think>
# leaks into message.content.
VLLM_REASONING_PARSER="${VLLM_REASONING_PARSER:-qwen3}"

# The template emits <tool_call><function=name>...</function></tool_call>.
# qwen3_xml and qwen3_coder resolve to the same parser in vLLM 0.27.1; the
# former names the emitted XML dialect.
VLLM_TOOL_PARSER="${VLLM_TOOL_PARSER:-qwen3_xml}"

VLLM_CAP_REASONING="${VLLM_CAP_REASONING:-required}"
VLLM_CAP_TOOLS="${VLLM_CAP_TOOLS:-required}"
VLLM_CAP_REASONING_MODE="${VLLM_CAP_REASONING_MODE:-default}"
VLLM_CAP_DISABLE_MODE="${VLLM_CAP_DISABLE_MODE:-enable-thinking-false}"
VLLM_CAP_SYSTEM_PROMPT="${VLLM_CAP_SYSTEM_PROMPT:-}"

# Hybrid GDN: the 0.27.1 engine default is APC off for hybrid models;
# the explicit pin keeps the resolved mode stable across core bumps
# (vLLM main resolves supported hybrids to align-mode APC ON).
#
# Align-mode APC adopted 2026-08-27 on A100 evidence (user decision, same
# gate as qwen3.6): audit replay 6.1x end to end on matched verdicts
# (137.6 s vs 845.0 s, final-turn prefill 84.8 -> 7.4 s, 89.9% of prompt
# tokens served from cache); correctness gate passed -- conversation
# probe byte-identical cold-vs-hit where the cache-off baseline is
# itself deterministic, divergence elsewhere reproduced cache-off
# (CUDA baseline nondeterminism, not a cache defect), semantic needles
# 8/8, TTFT 5.29 s -> 0.15 s on the shared prefix. Measured align pool
# cost on this model: 742,613 vs 749,204 tokens, -0.88%. Note align
# mode legitimately changes temp-0 outputs from the first token.
# Evidence: vllm/BENCHMARKS.md (audit replay section) and
# ~/.local/state/auditbench/replay-20260827/.
VLLM_PREFIX_CACHING="${VLLM_PREFIX_CACHING:-1}"
