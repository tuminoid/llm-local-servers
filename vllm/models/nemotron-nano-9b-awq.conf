# vLLM server config for nemotron-nano-9b-awq
#
# cyankiwi/NVIDIA-Nemotron-Nano-9B-v2-AWQ-4bit: Nemotron Nano 9B v2, a
# Mamba2 hybrid, int4 compressed-tensors pack-quantized. Weights 6.23 GiB.
#
# Sizing gotcha: only 4 of 56 layers hold per-token KV (8 KiB/token at
# fp8), but the 27 Mamba2 layers bill ~135 MiB per SEQUENCE -- the largest
# per-sequence cost in this directory, and it lands inside the KV pool, so
# the pool holds fewer tokens than the per-token figure predicts (measured
# 298,301 tokens from 2.63 GiB). That term grows with max-num-seqs, not
# with context.
#
# Do NOT switch to RedHatAI/NVIDIA-Nemotron-Nano-9B-v2-quantized.w4a16,
# which looks like the better pick at 0.22 GiB smaller: its config.json
# carries `time_step_limit: [0.0, null]` and strict config validation
# rejects it before the engine starts. The failure is inside
# AutoConfig.from_pretrained, so --hf-overrides cannot reach it.
#
# Request-budget trap: thinking is on by default, and 400 max_tokens did
# not reach </think> on "what is 17 * 24" -- the whole answer stayed in the
# reasoning stream with finish_reason "length". It closed at 1,064.
#
# Supervised probe on the 12 GB card (sm_120, util 0.916, seqs 2, fp8 KV):
# prefill ~1,950 tok/s at 11k and ~1,675 at 47k, decode 55 tok/s at one
# stream and 104 at two, no gain at four. No canonical AuditBench result.

VLLM_MODEL="${VLLM_MODEL:-cyankiwi/NVIDIA-Nemotron-Nano-9B-v2-AWQ-4bit}"
VLLM_MODEL_REVISION="${VLLM_MODEL_REVISION:-5fad34bce867ef6784079415721cc36031f6b969}"
VLLM_SERVED_NAME="${VLLM_SERVED_NAME:-nemotron-nano-9b-awq}"

# The model's own max_position_embeddings, so no RoPE extrapolation. Not the
# binding constraint here: it is also the largest context that leaves room
# for two concurrent sequences on a 12 GB card.
VLLM_MAX_LEN="${VLLM_MAX_LEN:-131072}"

# A preference, not a demand: bf16 KV for the full context is only 2.0 GiB,
# but fp8 halves the per-sequence pool cost where the Mamba2 state already
# dominates. The launcher downgrades to bf16 below sm_89, which costs little.
VLLM_KV_DTYPE="${VLLM_KV_DTYPE:-fp8}"

# Vendored plugin, because vLLM bundles no parser for this checkpoint's
# <TOOLCALL>[{...}]</TOOLCALL> dialect. ../nemotron_tool_parser.py registers
# both the reasoning and the tool parser, adapted from vLLM PR #42255 but
# buffering each whole tool block before emitting one streaming delta:
# incremental parsing cannot retract this checkpoint's malformed prefixes.
#
# Two parsers that look right and are not:
#   deepseek_r1 aborts startup -- this tokenizer has no single token for
#     </think> and every BaseThinkingReasoningParser looks the marker up in
#     the vocab ("could not locate think start/end tokens").
#   NVIDIA's own nemotron_toolcall_parser_no_streaming.py imports a module
#     path vLLM removed, and its streaming method raises NotImplementedError.
VLLM_REASONING_PARSER="${VLLM_REASONING_PARSER:-nemotron_nano_v2}"
VLLM_REASONING_PLUGIN="${VLLM_REASONING_PLUGIN:-nemotron_tool_parser.py}"
VLLM_TOOL_PARSER="${VLLM_TOOL_PARSER:-nemotron_nano_v2}"
VLLM_TOOL_PLUGIN="${VLLM_TOOL_PLUGIN:-nemotron_tool_parser.py}"

VLLM_CAP_REASONING="${VLLM_CAP_REASONING:-required}"
VLLM_CAP_TOOLS="${VLLM_CAP_TOOLS:-required}"
VLLM_CAP_REASONING_MODE="${VLLM_CAP_REASONING_MODE:-default}"
# The template honours /think and /no_think in a user or system message,
# emitting an empty <think></think> for the latter. Model behaviour, not a
# server flag.
VLLM_CAP_DISABLE_MODE="${VLLM_CAP_DISABLE_MODE:-no-think-prefix}"
VLLM_CAP_SYSTEM_PROMPT="${VLLM_CAP_SYSTEM_PROMPT:-}"

# AuditBench decodes at the checkpoint's sampling, from the model card's
# reasoning-on recommendation; generation_config.json carries none.
VLLM_SAMPLING="${VLLM_SAMPLING:-temperature=0.6 top_p=0.95}"

# Hybrid Mamba2: pinned off because align-mode pool cost is unmeasured on
# this model, and core bumps resolve supported hybrids to align ON.
VLLM_PREFIX_CACHING="${VLLM_PREFIX_CACHING:-0}"
