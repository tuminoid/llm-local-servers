# vLLM server config for nemotron-nano-9b-awq
#
# TOOL CALLING: supported for streaming and non-streaming requests through the
# vendored parser named at the bottom of this file.
#
# vLLM 0.26 bundles no parser for this model's <TOOLCALL> dialect, so the config
# loads ../nemotron_tool_parser.py as both its reasoning and tool plugin. It is
# adapted from the parser proposed upstream in vLLM PR #42255, but buffers each
# whole tool block before emitting one complete streaming delta. Incremental
# parsing cannot retract malformed prefixes from this checkpoint. Local handling
# also accepts its truncated `</TOOLCALL` marker and repairs malformed JSON
# strings and container closers.
#
# cyankiwi/NVIDIA-Nemotron-Nano-9B-v2-AWQ-4bit: NVIDIA's Nemotron Nano 9B v2, a
# Mamba2 hybrid, quantized to 4-bit by llm-compressor's AWQModifier (int4, group
# size 32, symmetric, per recipe.yaml in the repo) and stored as
# compressed-tensors pack-quantized. Ungated; nvidia-open-model-license.
#
# Every value uses ${VAR:-default} so the environment wins over this file.
#
# Model-portable settings only. Utilization, sequence count, batch size and
# attention backend are host policy and live in ../start.sh.
#
# Sizing, for whichever host runs it: weights are 6.23 GiB. Only 4 of its 56
# layers hold per-token KV -- the hybrid_override_pattern is
#   M-M-M-MM-M-M-M*-M-M-M*-M-M-M-M*-M-M-M-M*-M-MM-M-M-M-M-M-
# i.e. 27 Mamba2 layers, 25 MLP and 4 attention. Those four cost 4 x 8 KV heads
# x 128 head dim x 2 (K+V) x 2 B = 16 KiB/token at bf16, halved to 8 KiB by the
# fp8 preference below, so the full 131072 context is 1.0 GiB of KV. That is the
# cheapest context in this directory: half qwen3.5-4b-awq's 32 KiB/token at
# bf16.
#
# The Mamba2 layers are billed per *sequence* instead: 128 mamba heads x 80 head
# dim x 128 state dim x 4 B (float32) = 5.0 MiB per layer, so ~135 MiB per
# sequence across the 27 of them, plus a small conv state (conv_kernel 4). That
# scales with max-num-seqs, not with context, and it is the largest per-sequence
# cost of any config here -- worth remembering before raising max-num-seqs on a
# small card. It lands inside the KV pool rather than beside it, so the pool
# holds fewer tokens than the per-token figure alone predicts: measured 298,301
# tokens from 2.63 GiB, an effective 9.2 KiB/token against the nominal 8.
#
# Notes specific to this model:
#
# - This is the config to copy when adding a model to a 12 GB card. What makes it
#   fit is the 4-attention-layer pattern, not the quantization: at 8 KiB/token
#   even bf16 KV holds several full-length sequences.
# - Do not switch to RedHatAI/NVIDIA-Nemotron-Nano-9B-v2-quantized.w4a16, which
#   is the same model 0.22 GiB smaller and looks like the better pick. Its
#   config.json carries `time_step_limit: [0.0, null]`, and strict config
#   validation rejects it before the engine starts:
#     StrictDataclassFieldValidationError: Validation error for field
#     'time_step_limit': TypeError: Field 'time_step_limit' with value
#     [0.0, None] doesn't match any type in (list[float], tuple[float, ...])
#   The failure is inside AutoConfig.from_pretrained, so --hf-overrides cannot
#   reach it. This repo writes `[0.0, Infinity]`, and NVIDIA's own repos omit the
#   field and take the class default; all three are fine.
# - The 4-bit pack leaves exactly one module unquantized, `lm_head`. Embeddings
#   are untied (vocab 131072 x hidden 4480), so those two matrices are 1.09 GiB
#   each and dominate what remains in bf16.
# - Hybrid (IsHybrid), so the per-token arithmetic above does not describe the
#   whole footprint. This is the case vllm/AGENTS.md calls out under
#   Known limits, and here the per-sequence half is unusually large.
# - The repo ships configuration_nemotron_h.py and modeling_nemotron_h.py, but
#   vLLM 0.26 registers NemotronHForCausalLM natively, so no trust_remote_code.
# - Thinking is on by default and the template honours `/think` and `/no_think`
#   in a user or system message, emitting an empty `<think></think>` for the
#   latter. That is model behaviour, not a server flag.

VLLM_MODEL="${VLLM_MODEL:-cyankiwi/NVIDIA-Nemotron-Nano-9B-v2-AWQ-4bit}"
VLLM_MODEL_REVISION="${VLLM_MODEL_REVISION:-5fad34bce867ef6784079415721cc36031f6b969}"
VLLM_SERVED_NAME="${VLLM_SERVED_NAME:-nemotron-nano-9b-awq}"

# The model's own max_position_embeddings, which tokenizer_config.json's
# model_max_length agrees with, so no RoPE extrapolation beyond training. KV must
# hold one whole sequence of this length or vLLM refuses to start, and here that
# is not the binding constraint: 131072 is both the model's ceiling and the
# largest context that leaves room for two concurrent sequences on a 12 GB card,
# so the usual trade between context and concurrency does not arise. Measured
# there at the derived util 0.916: KV pool 298,301 tokens, 2.28x a full-length
# sequence, with 9,938 MiB in use.
VLLM_MAX_LEN="${VLLM_MAX_LEN:-131072}"

# A preference, not a demand. This model does not need fp8 to fit its context
# anywhere -- bf16 KV for the full 131072 is only 2.0 GiB -- but fp8 halves the
# pool cost per sequence on a card where the Mamba2 per-sequence state is
# already the larger term, and sm_120 has the path. FlashInfer accepts fp8 KV
# alongside the Mamba2 layers here, so no VLLM_ATTN_AUTO is needed. The launcher
# downgrades to bf16 below sm_89, which costs little here.
VLLM_KV_DTYPE="${VLLM_KV_DTYPE:-fp8}"

# The generation prompt pre-opens a <think> block and closes it before the
# answer. Unparsed, </think> leaks into message.content.
#
# Not deepseek_r1, despite the markers being the usual pair: this tokenizer has
# no single token for either, `</think>` encodes as ['</', 'think', '>'] (ids
# 1885, 74045, 1062), and every parser deriving from BaseThinkingReasoningParser
# looks the whole marker up in the vocab and aborts startup when it is absent:
#   RuntimeError: DeepSeekR1ReasoningParser reasoning parser could not locate
#   think start/end tokens in the tokenizer!
# The adapter registered by nemotron_tool_parser.py retains olmo3's string-space
# buffering and optional opening tag, but uses that buffer's CONTENT state for
# the streaming phase transition. Stock olmo3 extracts the text correctly here
# but its separate token-ID check never hands the remainder to the tool parser.
# It also detects the prompt-rendered </think> used by /no_think.
VLLM_REASONING_PARSER="${VLLM_REASONING_PARSER:-nemotron_nano_v2}"
VLLM_REASONING_PLUGIN="${VLLM_REASONING_PLUGIN:-nemotron_tool_parser.py}"

# Tool calls arrive as <TOOLCALL>[{"name": ..., "arguments": ...}]</TOOLCALL>,
# a dialect no parser bundled with vLLM 0.26 matches. The plugin file registers
# both parsers under the canonical name proposed by vLLM upstream, so the tool
# plugin import also makes the reasoning adapter available.
#
# NVIDIA ships nemotron_toolcall_parser_no_streaming.py in the model repo. Do not
# use it: it imports vllm.entrypoints.openai.tool_parsers, a module path that no
# longer exists in 0.26, and its streaming method raises NotImplementedError,
# which breaks the streaming vllm-local provider even after fixing the import.
VLLM_TOOL_PARSER="${VLLM_TOOL_PARSER:-nemotron_nano_v2}"
VLLM_TOOL_PLUGIN="${VLLM_TOOL_PLUGIN:-nemotron_tool_parser.py}"

VLLM_CAP_REASONING="${VLLM_CAP_REASONING:-required}"
VLLM_CAP_TOOLS="${VLLM_CAP_TOOLS:-required}"
VLLM_CAP_REASONING_MODE="${VLLM_CAP_REASONING_MODE:-default}"
VLLM_CAP_DISABLE_MODE="${VLLM_CAP_DISABLE_MODE:-no-think-prefix}"
VLLM_CAP_SYSTEM_PROMPT="${VLLM_CAP_SYSTEM_PROMPT:-}"

# Verified on the 12 GB laptop card (sm_120): backend FLASHINFER, kv fp8, util
# 0.916, seqs 2, batched 2048, 9,938 MiB in use, KV pool 298,301 tokens (2.28x a
# full-length sequence), attention block size forced to 2608 tokens with the
# mamba page padded 0.46% to match. Reasoning parser checked against live
# requests, including /no_think, which returned the answer in 5 tokens with an
# empty reasoning field.
#
# Throughput, six samples with the machine properly powered (see the power note
# in BENCHMARKS.md before comparing any of this with a figure from elsewhere):
#
#   prefill ~11k        1870 - 2240 tok/s, median 1950
#   prefill ~47k        1520 - 1855 tok/s, median 1675
#   decode, 1 stream      30 - 58 tok/s,   median 55
#   decode, 2 streams     68 - 112 tok/s,  median 104, 1.8-2.3x
#   decode, 4 streams   no further gain; max-num-seqs 2 is the cap
#
# Roughly half qwen3.5-4b-awq's prefill and two thirds its decode, for 1.7x the
# weight bytes and 2.3x the parameters. One request needs a real token budget:
# thinking is on by default and 400 max_tokens was not enough to reach </think>
# on "what is 17 * 24", which leaves the whole answer in the reasoning stream
# with finish_reason "length". It closed the block after 1,064.

# Hybrid Mamba2: the 0.27.1 engine default is APC off for hybrid models
# and the benchmarked state was measured that way. vLLM main resolves
# supported hybrids to align-mode APC ON, so the explicit 0 pins the
# resolved mode across core bumps. Align-mode pool cost is unmeasured on
# this model; opting in needs new budget math first.
VLLM_PREFIX_CACHING="${VLLM_PREFIX_CACHING:-0}"
