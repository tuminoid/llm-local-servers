# vLLM server config for glm4.7-flash-awq
#
# QuantTrio/GLM-4.7-Flash-AWQ: 31.2B total MoE (64 experts, 4 per token), AWQ
# 4-bit weights at group size 128. Ungated, MIT.
#
# Every value uses ${VAR:-default} so the environment wins over this file.
#
# Model-portable settings only. Utilization, sequence count, batch size and
# attention backend are host policy and live in ../start.sh.
#
# Sizing, for whichever host runs it: weights are 18.8 GiB. Attention is MLA,
# so the cache holds one compressed latent per token per layer rather than
# separate K and V heads: 47 layers x (kv_lora_rank 512 + qk_rope_head_dim 64)
# x 2 B = 52.9 KiB/token, 10.2 GiB at the full context below. Roughly 31 GiB
# all-in, which is what lets two instances share an 80 GB card.
#
# Notes specific to this model:
#
# - Every one of its 47 layers does global attention. That is the reason to
#   pick it over the sliding-window and linear-attention models of similar
#   size: nothing in the sequence is behind a 1024-token window or compressed
#   into a recurrent state. It costs more KV per token than either, and buys
#   uniform long-range reachability with it.
# - VLLM_MLA below is load-bearing, not decorative. See its comment.
# - Native context is 202752, an odd number that is simply what the model
#   declares. Do not round it up to 256k.
#
# Verified on the A100 test host (sm_80): TRITON_MLA, bf16 KV, utilization
# 0.92 derived, 74,597 MiB in use, KV pool 1,050,624 tokens. Both parsers
# checked against live requests. Figures in vllm/AGENTS.md.

VLLM_MODEL="${VLLM_MODEL:-QuantTrio/GLM-4.7-Flash-AWQ}"
VLLM_MODEL_REVISION="${VLLM_MODEL_REVISION:-88e3d3d913c0d97c8f505cdc03433c48226bedc3}"
VLLM_SERVED_NAME="${VLLM_SERVED_NAME:-glm4.7-flash-awq}"

# The model's own max_position_embeddings, so no RoPE extrapolation beyond
# training. KV must hold one whole sequence of this length or vLLM refuses to
# start.
VLLM_MAX_LEN="${VLLM_MAX_LEN:-202752}"

# bf16 KV. MLA already compresses the cache by roughly an order of magnitude
# against ordinary GQA, so fp8 is unnecessary and would only restrict which
# hosts can serve this model (fp8 KV needs sm_89+).
VLLM_KV_DTYPE="${VLLM_KV_DTYPE:-auto}"

# Multi-head latent attention. This is a model fact, and it tells the launcher
# to name no attention backend so vLLM selects from the MLA family for the host
# it is on. Unsetting it makes the launcher force a dense backend, and engine
# init then dies with "Selected backend AttentionBackendEnum.FLASH_ATTN is not
# valid for this configuration. Reason: ['MLA not supported']" rather than
# falling back.
VLLM_MLA="${VLLM_MLA:-1}"

# Thinking model: the chat template opens a <think> block and closes it before
# the answer. Unparsed, </think> leaks into message.content.
VLLM_REASONING_PARSER="${VLLM_REASONING_PARSER:-glm47}"

# The template emits <tool_call>{function-name}<arg>... , GLM's own dialect
# rather than the JSON or XML ones. glm45 is the same parser under an older
# name; prefer glm47, which matches this model.
VLLM_TOOL_PARSER="${VLLM_TOOL_PARSER:-glm47}"

VLLM_CAP_REASONING="${VLLM_CAP_REASONING:-required}"
VLLM_CAP_TOOLS="${VLLM_CAP_TOOLS:-required}"
VLLM_CAP_REASONING_MODE="${VLLM_CAP_REASONING_MODE:-default}"
VLLM_CAP_DISABLE_MODE="${VLLM_CAP_DISABLE_MODE:-none}"
VLLM_CAP_SYSTEM_PROMPT="${VLLM_CAP_SYSTEM_PROMPT:-}"

# Regular attention (no recurrent state): the 0.27.1 engine default is
# APC on and the benchmarked state was measured that way. The explicit 1
# pins it across core bumps instead of trusting the default.
VLLM_PREFIX_CACHING="${VLLM_PREFIX_CACHING:-1}"
