# vLLM server config for qwen3-coder-30b
#
# Qwen/Qwen3-Coder-30B-A3B-Instruct-FP8: 30B total, 3B active (128 experts, 8
# per token), FP8 e4m3 weights. Ungated on Hugging Face.
#
# Every value uses ${VAR:-default} so the environment wins over this file.
#
# Model-portable settings only. Utilization, sequence count, batch size and
# attention backend are host policy and live in ../start.sh.
#
# Sizing, for whichever host runs it: weights are 29.5 GiB and KV costs
# 96 KiB/token (48 layers x 4 KV heads x 128 head dim x 2 (K+V) x 2 B), so the
# full context below needs 24 GiB of KV on top of the weights. That rules out
# any card below roughly 64 GB.
#
# The 80B sibling (Qwen3-Next-80B-A3B) is deliberately not here: bf16 is
# 162.7 GB and even the FP8 build is 82.1 GB (76.5 GiB), which fills an 80 GB
# card with nothing left for KV. There is no official 4-bit release.

VLLM_MODEL="${VLLM_MODEL:-Qwen/Qwen3-Coder-30B-A3B-Instruct-FP8}"
VLLM_MODEL_REVISION="${VLLM_MODEL_REVISION:-dcaee4d4dfc5ee71ad501f01f530e5652438fde0}"
VLLM_SERVED_NAME="${VLLM_SERVED_NAME:-qwen3-coder-30b}"

# The model's own max_position_embeddings, so no RoPE extrapolation beyond
# training. KV must hold one whole sequence of this length or vLLM refuses to
# start.
VLLM_MAX_LEN="${VLLM_MAX_LEN:-262144}"

# bf16 KV. This model does not need fp8 to fit its context on a large card, and
# asking for fp8 would only restrict which hosts can serve it (fp8 KV needs
# sm_89+).
VLLM_KV_DTYPE="${VLLM_KV_DTYPE:-auto}"

# Non-thinking model: it emits no <think> block, so no reasoning parser. Setting
# one would leave message.content empty.
VLLM_REASONING_PARSER="${VLLM_REASONING_PARSER:-}"

# Qwen3-Coder emits XML-style tool calls. Parser names are registered lazily and
# do not appear in `vllm serve --help`; find them under
# vllm/tool_parsers/ in the installed package.
VLLM_TOOL_PARSER="${VLLM_TOOL_PARSER:-qwen3_coder}"

VLLM_CAP_REASONING="${VLLM_CAP_REASONING:-absent}"
VLLM_CAP_TOOLS="${VLLM_CAP_TOOLS:-required}"
VLLM_CAP_REASONING_MODE="${VLLM_CAP_REASONING_MODE:-default}"
VLLM_CAP_DISABLE_MODE="${VLLM_CAP_DISABLE_MODE:-none}"
VLLM_CAP_SYSTEM_PROMPT="${VLLM_CAP_SYSTEM_PROMPT:-}"

# Regular attention (no recurrent state): the 0.27.1 engine default is
# APC on and the benchmarked state was measured that way. The explicit 1
# pins it across core bumps instead of trusting the default.
VLLM_PREFIX_CACHING="${VLLM_PREFIX_CACHING:-1}"
