# vLLM server config for qwen3-coder-30b
#
# Qwen/Qwen3-Coder-30B-A3B-Instruct-FP8: 30B total, 3B active (128 experts, 8
# per token), FP8 e4m3 weights. Ungated. Weights 29.5 GiB and KV 96 KiB/token,
# so the full context needs 24 GiB of KV on top -- no card below roughly 64 GB.
#
# The 80B sibling (Qwen3-Next-80B-A3B) is deliberately not here: even the FP8
# build is 76.5 GiB, which fills an 80 GB card with nothing left for KV, and
# there is no official 4-bit release.

VLLM_MODEL="${VLLM_MODEL:-Qwen/Qwen3-Coder-30B-A3B-Instruct-FP8}"
VLLM_MODEL_REVISION="${VLLM_MODEL_REVISION:-dcaee4d4dfc5ee71ad501f01f530e5652438fde0}"
VLLM_SERVED_NAME="${VLLM_SERVED_NAME:-qwen3-coder-30b}"

# The model's own max_position_embeddings, so no RoPE extrapolation. KV must
# hold one whole sequence of this length or vLLM refuses to start.
VLLM_MAX_LEN="${VLLM_MAX_LEN:-262144}"

# bf16 KV. Asking for fp8 would only restrict which hosts can serve this
# model (fp8 KV needs sm_89+) and it fits without.
VLLM_KV_DTYPE="${VLLM_KV_DTYPE:-auto}"

# Non-thinking model: setting a reasoning parser would leave content empty.
VLLM_REASONING_PARSER="${VLLM_REASONING_PARSER:-}"

# CAPABILITY FAILURE on this pairing (vLLM 0.28.0): with tool_choice=auto and
# a prompt requiring one call, it returns TWO tool calls, streaming and
# non-streaming alike, so the tool round trip cannot run. The parser
# assembles well-formed calls; the model emits a second one. A named tool
# choice hides this by routing through guided decoding. The same checkpoint
# passes on Ollama's llama.cpp runner, so it is the vLLM pairing and not the
# weights. Not promotable for agent workloads here until it emits one call.
# Retest on every vLLM pin bump and any tool-parser change.
VLLM_TOOL_PARSER="${VLLM_TOOL_PARSER:-qwen3_coder}"

VLLM_CAP_REASONING="${VLLM_CAP_REASONING:-absent}"
VLLM_CAP_TOOLS="${VLLM_CAP_TOOLS:-required}"
VLLM_CAP_REASONING_MODE="${VLLM_CAP_REASONING_MODE:-default}"
# The chat template defines neither enable_thinking nor reasoning_effort, so
# there is nothing to disable and graded effort controls do not apply.
VLLM_CAP_DISABLE_MODE="${VLLM_CAP_DISABLE_MODE:-none}"
VLLM_CAP_SYSTEM_PROMPT="${VLLM_CAP_SYSTEM_PROMPT:-}"

# AuditBench and audit fitness decode at the checkpoint's sampling, from
# generation_config.json at the pinned revision.
VLLM_SAMPLING="${VLLM_SAMPLING:-temperature=0.7 top_p=0.8 top_k=20 repetition_penalty=1.05}"

# Regular attention: pinned on so a core bump cannot silently change the
# mode the benchmarked state was measured in.
VLLM_PREFIX_CACHING="${VLLM_PREFIX_CACHING:-1}"
