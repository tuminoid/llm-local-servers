# vLLM server config for gemma4-e2b-awq
#
# cyankiwi/gemma-4-E2B-it-AWQ-INT4: Gemma 4 E2B, the MatFormer "effective 2B"
# edge variant of the Gemma 4 family, 4-bit weights in compressed-tensors
# pack-quantized format. Ungated, Apache 2.0 -- Gemma 4 dropped the bespoke
# Gemma licence and its Prohibited Use Policy, which is what makes it usable
# for security work.
#
# Every value uses ${VAR:-default} so the environment wins over this file.
#
# Model-portable settings only. Utilization, sequence count, batch size and
# attention backend are host policy and live in ../start.sh.
#
# Why the E2B and not the E4B or the 26B on a 12 GB card. The 26B-A4B is 15.4
# GiB of weights and never fits. The E4B is closer but still 9.60 GiB, because
# the Per-Layer-Embedding tables (vocab 262144 x 256 x 42 layers) stay
# unquantized and dominate the checkpoint; after weights and CUDA graphs a 12
# GiB card has no room for two 128k sequences of KV, so it fails the "2x at
# 128k" bar this host is benched at. The E2B keeps the same PLE design but at
# 35 layers and 1 KV head, so its weights are 7.06 GiB and the KV that grows
# with context comes from only three layers. It is the largest gemma4 that
# clears the bar here.
#
# Sizing, for whichever host runs it (COMPUTED from config.json -- see the
# verification note at the bottom; this file has not yet been measured on
# hardware the way the others in this directory have):
#
# - Weights 7.06 GiB, single shard, all-in: the text stack, the vision and
#   audio towers (this is an any-to-any multimodal model), and the unquantized
#   PLE tables. tie_word_embeddings is true, which keeps the output projection
#   off the books.
# - 35 text layers, 28 sliding_attention (window 512) and 7 full_attention at
#   indices 4, 9, 14, 19, 24, 29, 34. num_kv_shared_layers is 20, so the top
#   20 layers (15-34) reuse an earlier layer's KV and allocate none. That
#   leaves three full-attention layers (4, 9, 14) holding global KV and twelve
#   sliding layers holding window-capped KV.
# - Global KV is 3 layers x 1 KV head x 512 head dim x 2 (K+V) x 2 B = 6
#   KiB/token at 16-bit, so 0.77 GiB at the 131072 context below and ~1.5 GiB
#   for two concurrent sequences. The head-dim attribution is the one soft
#   spot in this arithmetic: config.json exposes both head_dim 256 and
#   global_head_dim 512 and this assumes the full-attention layers bill at
#   512; if vLLM bills them at 256 the figure halves. Either way it is small.
# - Sliding KV is capped at the 512-token window: 12 layers x 1 KV head x 256
#   x 2 x 2 B x 512 = ~6 MiB per sequence, negligible.
# - Expected footprint on the 12 GB card: 7.06 GiB weights + ~1.5 GiB KV for
#   two full-length sequences + CUDA graphs + activations. The small-card
#   profile's derived util 0.916 offers ~10.9 GiB, which should leave the KV
#   pool a comfortable multiple of one full sequence. This is the number the
#   verification run must confirm.
#
# Notes specific to this model:
#
# - Architecture is Gemma4ForConditionalGeneration, the same class the
#   gemma4-26b-a4b-awq conf documents as registered in vLLM 0.26 as gemma4_mm.
#   Verified 0.26.0 on this host. No trust_remote_code.
# - It is multimodal and uses PrefixLM bidirectional attention over the image
#   and audio prefix, which the launcher's dense default backend does not
#   implement at this head size. Naming a backend aborts engine init:
#     ValueError: Selected backend AttentionBackendEnum.FLASH_ATTN is not valid
#     for this configuration. Reason: ['partial multimodal token full attention
#     not supported', 'mm_prefix (PrefixLM bidirectional attention) requires
#     FlashAttention v4, which does not resolve for this head_size']
#   Hence VLLM_ATTN_AUTO=1 below: unset, vLLM finds TRITON_ATTN, which supports
#   mm_prefix unconditionally. This mirrors the 26B exactly.
# - Gemma 4 does not use <think>/</think>. It emits a channel format,
#   <|channel>thought ... <channel|>, with tool calls as <|tool_call>call:.
#   Hence the gemma4 parsers below and not a deepseek_r1-style one.
# - Thinking is off by default and the template's logic is inverted: when
#   enable_thinking is false it pre-fills an empty closed thought block into
#   the generation prompt, which suppresses reasoning rather than merely not
#   asking for it. message.reasoning therefore stays empty and the model
#   reasons inline in content unless a request sends
#   "chat_template_kwargs": {"enable_thinking": true}. This is why the
#   opencode.json entry for this model does NOT declare a reasoning field
#   (see README.md, the Gemma 4 row).

VLLM_MODEL="${VLLM_MODEL:-cyankiwi/gemma-4-E2B-it-AWQ-INT4}"
VLLM_MODEL_REVISION="${VLLM_MODEL_REVISION:-6ff611a1991f632acc88da5c74775a7c244a35ac}"
VLLM_SERVED_NAME="${VLLM_SERVED_NAME:-gemma4-e2b-awq}"

# The model's own max_position_embeddings, so no RoPE extrapolation beyond
# training, and it is the largest context this host is benched at rather than a
# cut for fit: the KV that grows with context is only three layers, so 131072
# costs about 0.77 GiB per sequence and does not bind on a 12 GB card. KV must
# hold one whole sequence of this length or vLLM refuses to start.
VLLM_MAX_LEN="${VLLM_MAX_LEN:-131072}"

# Automatic 16-bit KV (fp16 for this checkpoint). The sliding-window majority
# plus the 20-layer KV sharing leave only three layers growing with context, so
# fp8 is unnecessary here. Asking for it would also force a backend that
# supports both fp8 KV and mm_prefix under the mandatory VLLM_ATTN_AUTO below,
# a combination not worth chasing for ~0.4 GiB of savings. Same call as the
# 26B.
VLLM_KV_DTYPE="${VLLM_KV_DTYPE:-auto}"

# Let vLLM pick the attention backend. Multimodal PrefixLM bidirectional
# attention only resolves on some backends, and the launcher's dense default is
# not one of them at this head size (see the note above). Unset, vLLM selects
# TRITON_ATTN, which supports mm_prefix unconditionally.
VLLM_ATTN_AUTO="${VLLM_ATTN_AUTO:-1}"

# Splits the model's thought channel out of the answer. Without it the raw
# <|channel>thought markers land in message.content. Bundled with vLLM 0.26.
VLLM_REASONING_PARSER="${VLLM_REASONING_PARSER:-gemma4}"

# Matches the template's <|tool_call>call: emission so tool calls arrive as a
# structured tool_calls array. Bundled with vLLM 0.26.
VLLM_TOOL_PARSER="${VLLM_TOOL_PARSER:-gemma4}"

VLLM_CAP_REASONING="${VLLM_CAP_REASONING:-required}"
VLLM_CAP_TOOLS="${VLLM_CAP_TOOLS:-required}"
VLLM_CAP_REASONING_MODE="${VLLM_CAP_REASONING_MODE:-enable-thinking}"
VLLM_CAP_DISABLE_MODE="${VLLM_CAP_DISABLE_MODE:-enable-thinking-false}"
VLLM_CAP_SYSTEM_PROMPT="${VLLM_CAP_SYSTEM_PROMPT:-}"

# Verified on the 12 GB laptop card (sm_120) with vLLM 0.27.1 and Transformers
# 5.14.1: TRITON_ATTN selected by vLLM, automatic KV dtype, utilization 0.916,
# seqs 2, batched 2048, model load 7.29 GiB, 10,858 MiB in use, and a 450,444
# token KV pool (3.44x a full-length sequence). The server returned a valid
# OpenAI-compatible chat response and a structured tool call through the
# bundled gemma4 parser. Default requests suppress thinking, so the opt-in
# reasoning path was not exercised.
#
# Canonical AuditBench v1, three samples:
#
#   prefill 32,772      4,835.1 median [4,800.7-4,846.9] tok/s
#   prefill 65,528      3,168.8 median [3,152.6-3,174.0] tok/s
#   decode, 1 stream      145.44 median [145.34-148.63] tok/s
#   decode, 2 streams     303.54 median [275.09-304.18] tok/s, 2.09x
#   audit 32k, 1/2      215.06 / 289.55 calls/hour
#   audit half, 1       113.31 calls/hour
#   audit deep, 1/2      56.22 / 56.89 calls/hour
#
# Transformers 5.15 changes Gemma 4 to explicit per-layer head dimensions,
# which vLLM 0.27.1 does not consume correctly. The repository pins 5.14.1
# until a vLLM release includes upstream PR #49797.

# Regular attention (no recurrent state): the 0.27.1 engine default is
# APC on and the benchmarked state was measured that way. The explicit 1
# pins it across core bumps instead of trusting the default.
VLLM_PREFIX_CACHING="${VLLM_PREFIX_CACHING:-1}"
