# vLLM server config for gemma4-e2b-awq
#
# cyankiwi/gemma-4-E2B-it-AWQ-INT4: Gemma 4 E2B, the MatFormer "effective
# 2B" edge variant, int4 compressed-tensors pack-quantized. Apache 2.0 --
# Gemma 4 dropped the bespoke licence and its Prohibited Use Policy, which
# is what makes it usable for security work.
#
# Why the E2B and not the E4B or 26B on a 12 GB card: the unquantized
# Per-Layer-Embedding tables dominate every variant, so the 26B-A4B is 15.4
# GiB and the E4B still 9.60 GiB, leaving no room for two 128k sequences.
# The E2B is 7.06 GiB with 1 KV head.
#
# Context is cheap here rather than tight: 20 of 35 layers share an earlier
# layer's KV and most of the rest are sliding-window (512), so only three
# full-attention layers grow with context.
#
# Canonical rates are in vllm/BENCHMARKS.md.

VLLM_MODEL="${VLLM_MODEL:-cyankiwi/gemma-4-E2B-it-AWQ-INT4}"
VLLM_MODEL_REVISION="${VLLM_MODEL_REVISION:-6ff611a1991f632acc88da5c74775a7c244a35ac}"
VLLM_SERVED_NAME="${VLLM_SERVED_NAME:-gemma4-e2b-awq}"

# The model's own max_position_embeddings, so no RoPE extrapolation. KV must
# hold one whole sequence of this length or vLLM refuses to start.
VLLM_MAX_LEN="${VLLM_MAX_LEN:-131072}"

# Automatic 16-bit KV. fp8 would buy ~0.4 GiB and would have to coexist with
# the mandatory backend choice below, which is not worth chasing.
VLLM_KV_DTYPE="${VLLM_KV_DTYPE:-auto}"

# Load-bearing. This model uses PrefixLM bidirectional attention over the
# multimodal prefix, which the launcher's dense default backend does not
# implement at this head size -- naming a backend aborts engine init with
# "mm_prefix (PrefixLM bidirectional attention) requires FlashAttention v4,
# which does not resolve for this head_size". Unset, vLLM selects TRITON_ATTN,
# which supports mm_prefix unconditionally.
VLLM_ATTN_AUTO="${VLLM_ATTN_AUTO:-1}"

# Gemma 4 does not use <think>/</think>: it emits <|channel>thought ... with
# tool calls as <|tool_call>call:. Unparsed, those markers land in
# message.content, so these are the gemma4 parsers rather than deepseek-style.
VLLM_REASONING_PARSER="${VLLM_REASONING_PARSER:-gemma4}"
VLLM_TOOL_PARSER="${VLLM_TOOL_PARSER:-gemma4}"

VLLM_CAP_REASONING="${VLLM_CAP_REASONING:-required}"
VLLM_CAP_TOOLS="${VLLM_CAP_TOOLS:-required}"
# Thinking is off by default and the template's logic is inverted: with
# enable_thinking false it pre-fills an empty closed thought block, which
# suppresses reasoning. message.reasoning therefore stays empty and the model
# reasons inline in content unless a request opts in with enable_thinking
# true, so clients must not declare a reasoning field for this model.
VLLM_CAP_REASONING_MODE="${VLLM_CAP_REASONING_MODE:-enable-thinking}"
VLLM_CAP_DISABLE_MODE="${VLLM_CAP_DISABLE_MODE:-enable-thinking-false}"
VLLM_CAP_SYSTEM_PROMPT="${VLLM_CAP_SYSTEM_PROMPT:-}"

# AuditBench decodes at the checkpoint's sampling, from
# generation_config.json at the pinned revision.
VLLM_SAMPLING="${VLLM_SAMPLING:-temperature=1.0 top_p=0.95 top_k=64}"

# Transformers 5.15 changes Gemma 4 to explicit per-layer head dimensions,
# which vLLM 0.27.1 does not consume correctly. The repository pins 5.14.1
# until a vLLM release includes upstream PR #49797.

# Regular attention: pinned on so a core bump cannot silently change the
# mode the benchmarked state was measured in.
VLLM_PREFIX_CACHING="${VLLM_PREFIX_CACHING:-1}"
