# vLLM server config for qwen3.5-4b-awq
#
# cyankiwi/Qwen3.5-4B-AWQ-4bit: Qwen3.5 4B dense hybrid, 4-bit weights produced
# by llm-compressor's AWQModifier (int4, group size 32, symmetric, mse observer,
# per recipe.yaml in the repo). Ungated, Apache 2.0.
#
# Despite the repo name, config.json declares quant_method compressed-tensors
# with format pack-quantized, so vLLM loads it through the compressed-tensors
# path and not the awq one. The scales are AWQ-derived either way; the
# distinction only matters when reading a log or filing a bug.
#
# Every value uses ${VAR:-default} so the environment wins over this file.
#
# Model-portable settings only. Utilization, sequence count, batch size and
# attention backend are host policy and live in ../start.sh.
#
# Sizing, for whichever host runs it: weights are 3.76 GiB in a single shard.
# This is a hybrid model -- 24 of its 32 layers are GatedDeltaNet linear
# attention (full_attention_interval 4) and allocate no per-token KV at all.
# Only the 8 full-attention layers do, at 8 x 4 KV heads x 256 head dim x 2
# (K+V) x 2 B = 32 KiB/token, halved to 16 KiB by the fp8 preference set here.
# The native 262144 therefore costs 4.0 GiB of KV at fp8 and the 131072 set
# below costs 2.0 GiB; vLLM's own figures are 4.06 and 2.03, the difference
# being page rounding in the hybrid allocator.
#
# The linear layers are not free, they are billed per *sequence*: a fixed
# recurrent state of 32 value heads x 128 value dim x 128 key dim x 4 B
# (float32, per mamba_ssm_dtype) = 2.0 MiB per layer, so 48 MiB per sequence
# across the 24 of them, plus a small conv state. That scales with
# max-num-seqs, not with context.
#
# Notes specific to this model:
#
# - Why the 4B and not the 9B on a 12 GB card. Every published 4-bit
#   Qwen3.5-9B is 10.4-11.5 GiB (QuantTrio AWQ 11.53, RedHatAI w4a16 10.65,
#   ig1 NVFP4 10.43) because that model unties lm_head -- vocab 248320 x
#   hidden 4096 twice over in bf16 -- and no quantizer converts the vision
#   tower or the linear_attn projections, there being no 4-bit GatedDeltaNet
#   kernel. Weights alone exceed the budget, so a shorter context cannot buy
#   the fit; only the KV term moves. This 4B ties its embeddings, which is
#   most of the difference.
# - Hybrid (IsHybrid) means the per-token arithmetic above does not describe
#   the whole footprint. This is the case vllm/AGENTS.md calls out
#   under Known limits.
# - Architecture is Qwen3_5ForConditionalGeneration, registered in vLLM 0.26.
#   It is multimodal (it carries a vision config), so a bare text deployment
#   still loads the vision tower.
# - config.json's max_position_embeddings and tokenizer_config.json's
#   model_max_length agree at 262144.
# - The checkpoint declares mtp_num_hidden_layers 1. vLLM registers Qwen3_5MTP
#   separately and only loads it under a speculative-decoding config, so it
#   costs nothing here.
# - The hybrid allocator sets the attention block size to 1056 tokens so that
#   an attention page is at least a mamba page, then pads the mamba page by
#   0.76% to make them equal. Another reason not to reach for
#   --num-gpu-blocks-override, which the README warns about assuming 16.
#
# Verified on the 12 GB laptop card (sm_120), the host this config was written
# for: backend FLASHINFER, kv fp8, util 0.80, seqs 1, batched 2048, 8044 MiB in
# use, KV pool 200,704 tokens (1.53x a full-length sequence). Both parsers
# checked against live requests. FlashInfer accepts head_dim 256 with fp8 KV on
# this hybrid model, so no VLLM_ATTN_AUTO is needed.
#
# Measured envelope on that card. The memory columns are power-independent and
# reproduce within 1%; the throughput columns are not, see the power note below.
# The first three rows are the small-card profile as it was (util 0.80), the
# fourth is what it now derives, and the rest take VLLM_GPU_UTIL as an override,
# since utilization is host policy and not a value this file may set:
#
#   util   max_len  seqs   pool tokens  pool/seq   note
#   0.80    131072     1       200,704     1.53x   old default
#   0.80    196608     1       202,816     1.03x   1x context ceiling at 0.80
#   0.80     98304     2       198,634     2.02x   2x needed a context cut here
#   0.916   131072     2       274,432     2.09x   current default
#   0.92    262144     1       293,351     1.12x   native context, needs >= 0.92
#   0.92    131072     2       287,744     2.20x
#   0.958   262144     1       321,438     1.23x
#
# Canonical AuditBench v1 at the derived default (util 0.916, max_len 131072,
# seqs 2), three samples with the machine properly powered:
#
#   prefill 32,780      4,686.9 median [3,760.1-4,691.2] tok/s
#   prefill 65,547      3,774.3 median [3,757.3-3,788.7] tok/s
#   decode, 1 stream       87.41 median [87.29-87.67] tok/s
#   decode, 2 streams     176.12 median [158.21-176.38] tok/s, 2.01x
#   audit 32k, 1/2      180.18 / 250.94 calls/hour
#   audit half, 1       113.76 calls/hour
#   audit deep, 1/2      83.20 / 85.82 calls/hour
#
# Three things that envelope settles:
#
# - The context ceiling is set by utilization, not by the card: the native
#   262144 needs 4.06 GiB of KV, which util 0.80 cannot offer (3.17 GiB) and
#   0.92 can (4.55 GiB). vLLM's estimated ceiling at 0.80 was 203808, and 196608
#   is the largest verified value there. Budget converts to pool 1:1 -- 0.92 to
#   0.958 offered 0.45 GiB more and the pool took 0.44 GiB.
# - Two concurrent streams are worth about 2x aggregate decode, and four are
#   worth no more, so max-num-seqs 2 in the small-card profile is the cap that
#   binds rather than the card. At max-num-seqs 1 both 2 and 4 streams flatten to
#   exactly 1.00x by queueing.
# - Throughput is flat across every memory row. Context length and utilization
#   change how much pool there is and nothing else.
#
# Power note, because it cost an entire measurement set. Every figure here was
# first taken with the GPU capped at 35 W, and the cap is invisible unless
# looked for: it survives `powerprofilesctl set performance`, the card sits at
# 56 C, and only `clocks_throttle_reasons.active = 0x4` (SwPowerCap) with
# `enforced.power.limit` below `power.default_limit` gives it away. The cause was
# the machine running on a USB-C PD contract of 9 V x 4.3 A, about 39 W for the
# whole laptop, so nvidia-powerd had nothing to allocate. Under the proper
# adapter the limit rises to 55-70 W and every throughput figure improves by
# roughly 10x. Check
#   nvidia-smi --query-gpu=enforced.power.limit,power.default_limit --format=csv
# before recording any throughput number from this host, and note that Dynamic
# Boost varies the limit between runs, which is why the figures above are ranges
# over six samples rather than a mean of two.
#
VLLM_MODEL="${VLLM_MODEL:-cyankiwi/Qwen3.5-4B-AWQ-4bit}"
VLLM_MODEL_REVISION="${VLLM_MODEL_REVISION:-ef85d23bebaba87b3c4672ba11c449c79dbdb23e}"
VLLM_SERVED_NAME="${VLLM_SERVED_NAME:-qwen3.5-4b-awq}"

# The model's own max_position_embeddings is 262144, and this is deliberately
# below it. KV must hold one whole sequence of VLLM_MAX_LEN or vLLM refuses to
# start. The native length did not fit the old small-card profile: measured on
# sm_120 at util 0.80, weights and CUDA graphs left 3.17 GiB for KV while
# 262144 needs 4.06 GiB, so engine init aborts with
#   ValueError: To serve at least one request with the model's max seq len
#   (262144), (4.06 GiB KV cache is needed, which is larger than the available
#   KV cache memory (3.17 GiB) ... estimated maximum model length is 203808
# The retained 131072 point now has a 274432-token pool, 2.09x its configured
# context. This is the one value here that is not purely a model fact, which is
# why it is called out rather than left to look native: on a host with room,
# restore the full context with VLLM_MAX_LEN=262144 (an A100 at util 0.98 has
# ample headroom for the 8.0 GiB that costs at bf16 KV).
VLLM_MAX_LEN="${VLLM_MAX_LEN:-131072}"

# A preference, not a demand. At 32 KiB/token bf16 KV even the capped 131072
# context would need 4.06 GiB, more than the 3.17 GiB the small-card profile
# leaves after weights and CUDA graphs; fp8 halves it to 2.03 GiB, at some cost
# in attention accuracy. The launcher downgrades this to bf16 below sm_89 rather
# than failing, so on such a host raise VLLM_GPU_UTIL or lower VLLM_MAX_LEN to
# match.
VLLM_KV_DTYPE="${VLLM_KV_DTYPE:-fp8}"

# Thinking model: the chat template pre-opens a <think> block in the generation
# prompt and closes it before the answer. Unparsed, </think> leaks into
# message.content.
VLLM_REASONING_PARSER="${VLLM_REASONING_PARSER:-qwen3}"

# The template emits <tool_call><function=name><parameter=...>, the XML dialect
# rather than the JSON one. qwen3_xml and qwen3_coder resolve to the same
# Qwen3EngineToolParser in vLLM 0.26; the former names what this template
# actually produces.
VLLM_TOOL_PARSER="${VLLM_TOOL_PARSER:-qwen3_xml}"

VLLM_CAP_REASONING="${VLLM_CAP_REASONING:-required}"
VLLM_CAP_TOOLS="${VLLM_CAP_TOOLS:-required}"
VLLM_CAP_REASONING_MODE="${VLLM_CAP_REASONING_MODE:-default}"
VLLM_CAP_DISABLE_MODE="${VLLM_CAP_DISABLE_MODE:-enable-thinking-false}"
VLLM_CAP_SYSTEM_PROMPT="${VLLM_CAP_SYSTEM_PROMPT:-}"

# Hybrid GDN: the 0.27.1 engine default is APC off for hybrid models,
# and the canonical cache-neutral RTX rows were measured that way.
# Serving default is APC OFF on clean-fixture conversation evidence
# (2026-08-27, vllm/BENCHMARKS.md RTX section): cache-off this
# checkpoint holds the audit tool loop 2/2 with full recall; under
# align-mode APC it follows the same chain and then reliably derails
# into a 16,384-token length runaway on the late turns -- align
# numerics move the temperature-0 trajectory, and here they break
# compliance. The measured align costs are otherwise cheap (pool
# 274,432 -> 268,147, -2.3%; decode -0.4%; replay 1.32x faster), so a
# deployment that only serves scripted or short-prompt work may
# override to 1; a compliance failure is a capability gate no
# throughput number overrides. The explicit 0 pins the resolved mode
# across core bumps (vLLM main resolves supported hybrids to align ON).
VLLM_PREFIX_CACHING="${VLLM_PREFIX_CACHING:-0}"
