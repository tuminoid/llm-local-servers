# vLLM server config for qwen3.5-4b-awq
#
# cyankiwi/Qwen3.5-4B-AWQ-4bit: Qwen3.5 4B dense/GDN hybrid, int4 weights.
# Despite the repo name, config.json declares compressed-tensors
# pack-quantized, so vLLM loads it through that path and logs say so.
#
# Why the 4B and not the 9B on a 12 GB card: every published 4-bit
# Qwen3.5-9B is 10.4-11.5 GiB because that model unties lm_head and no
# quantizer converts its vision tower or linear_attn projections. Weights
# alone exceed the budget, so a shorter context cannot buy the fit.
#
# Hybrid sizing gotcha: only 8 of 32 layers hold per-token KV; the 24 GDN
# layers instead bill a fixed ~48 MiB recurrent state PER SEQUENCE, so
# that term grows with max-num-seqs, not with context. The hybrid
# allocator also picks its own page sizes -- never reach for
# --num-gpu-blocks-override here.
#
# Measured envelope, canonical rates and the RTX power tripwire are in
# vllm/BENCHMARKS.md.

VLLM_MODEL="${VLLM_MODEL:-cyankiwi/Qwen3.5-4B-AWQ-4bit}"
VLLM_MODEL_REVISION="${VLLM_MODEL_REVISION:-ef85d23bebaba87b3c4672ba11c449c79dbdb23e}"
VLLM_SERVED_NAME="${VLLM_SERVED_NAME:-qwen3.5-4b-awq}"

# Deliberately below the model's native 262144. KV must hold one whole
# sequence of VLLM_MAX_LEN or vLLM refuses to start, and on a 12 GB card
# the native length aborts engine init ("estimated maximum model length is
# 203808"). This is the one value here that is not a pure model fact: on a
# host with room, restore it with VLLM_MAX_LEN=262144.
VLLM_MAX_LEN="${VLLM_MAX_LEN:-131072}"

# A preference, not a demand: fp8 halves KV to fit the small-card profile,
# at some cost in attention accuracy. The launcher downgrades it to bf16
# below sm_89 rather than failing, so on such a host raise VLLM_GPU_UTIL or
# lower VLLM_MAX_LEN to match.
VLLM_KV_DTYPE="${VLLM_KV_DTYPE:-fp8}"

# Thinking model: unparsed, </think> leaks into message.content.
VLLM_REASONING_PARSER="${VLLM_REASONING_PARSER:-qwen3}"

# The template emits the XML dialect, not the JSON one. qwen3_xml and
# qwen3_coder resolve to the same parser; the former names what this
# template produces.
VLLM_TOOL_PARSER="${VLLM_TOOL_PARSER:-qwen3_xml}"

VLLM_CAP_REASONING="${VLLM_CAP_REASONING:-required}"
VLLM_CAP_TOOLS="${VLLM_CAP_TOOLS:-required}"
VLLM_CAP_REASONING_MODE="${VLLM_CAP_REASONING_MODE:-default}"
VLLM_CAP_DISABLE_MODE="${VLLM_CAP_DISABLE_MODE:-enable-thinking-false}"
VLLM_CAP_SYSTEM_PROMPT="${VLLM_CAP_SYSTEM_PROMPT:-}"

# APC OFF is a compliance decision, not a performance one: under align-mode
# APC this checkpoint follows the audit tool loop and then reliably derails
# into a 16,384-token length runaway on the late turns, while cache-off it
# holds 2/2 with full recall (2026-08-27, vllm/BENCHMARKS.md RTX section).
# Align is otherwise cheap, so a deployment serving only scripted or short
# work may override to 1. The explicit 0 pins the mode across core bumps,
# which now resolve supported hybrids to align ON.
VLLM_PREFIX_CACHING="${VLLM_PREFIX_CACHING:-0}"
