# vLLM server config for nanbeige4.3-33b-w4a16
#
# Nanbeige/Nanbeige4.3-33B (Apache-2.0): a dense 33B reasoning model on the
# plain Llama architecture (LlamaForCausalLM; 52 layers, 8 KV heads of 128,
# so bf16 KV grows 208 KiB per token), native 524,288, aimed at agentic
# coding. Tech2wild/Nanbeige4.3-33B-W4A16-AutoRound is its AutoRound INT4
# weight-only quant in GPTQ format (group 128, symmetric, 20.8 GB, calibrated
# on pile-10k), served through vLLM's GPTQ Marlin kernels.
#
# A heavy thinker: on Capability Check v2's selection task it deliberates on
# topic past 32,768 tokens, so it passes audit fitness only under
# llm-audit-bench 2.4.0's context-scaled cap (65,536 at 262,144); the FP8
# build behaved the same. The card evaluates at its highest effort with a
# 65,536-token agentic budget and documents no thinking-budget control.

VLLM_MODEL="${VLLM_MODEL:-Tech2wild/Nanbeige4.3-33B-W4A16-AutoRound}"
VLLM_MODEL_REVISION="${VLLM_MODEL_REVISION:-1c1666af6d964ac8f315fba6a6fcb2efa6abdc23}"
VLLM_SERVED_NAME="${VLLM_SERVED_NAME:-nanbeige4.3-33b}"
VLLM_MAX_LEN="${VLLM_MAX_LEN:-262144}"
VLLM_KV_DTYPE="${VLLM_KV_DTYPE:-auto}"

# The vendor's parsers. The template opens <think> in the generation prompt
# and emits Qwen3-Coder XML tool calls.
VLLM_REASONING_PARSER="${VLLM_REASONING_PARSER:-qwen3}"
VLLM_TOOL_PARSER="${VLLM_TOOL_PARSER:-qwen3_coder}"

VLLM_CAP_REASONING="${VLLM_CAP_REASONING:-required}"
VLLM_CAP_TOOLS="${VLLM_CAP_TOOLS:-required}"
VLLM_CAP_REASONING_MODE="${VLLM_CAP_REASONING_MODE:-default}"
VLLM_CAP_DISABLE_MODE="${VLLM_CAP_DISABLE_MODE:-enable-thinking-false}"
VLLM_CAP_SYSTEM_PROMPT="${VLLM_CAP_SYSTEM_PROMPT:-}"

# The card recommends preserve_thinking for multi-turn tool use and code
# agents; its template re-renders each past turn's reasoning_content.
VLLM_PRESERVE_REASONING="${VLLM_PRESERVE_REASONING:-1}"

# generation_config.json carries no sampling; the model card's agentic
# setting.
VLLM_SAMPLING="${VLLM_SAMPLING:-temperature=1.0 top_p=0.95}"

VLLM_PREFIX_CACHING="${VLLM_PREFIX_CACHING:-1}"
