# vLLM server config for gemma4-26b-a4b-awq
#
# cyankiwi/gemma-4-26B-A4B-it-AWQ-4bit: 26.5B total, 4B active, 4-bit weights
# in compressed-tensors format. Ungated, Apache 2.0 -- Gemma 4 dropped the
# bespoke Gemma licence and its Prohibited Use Policy, which is what makes it
# usable for security work.
#
# Every value uses ${VAR:-default} so the environment wins over this file.
#
# Model-portable settings only. Utilization, sequence count, batch size and
# attention backend are host policy and live in ../start.sh.
#
# Sizing, for whichever host runs it: weights are 15.4 GiB. Only 5 of the 30
# layers are full attention; the other 25 are sliding-window with a 1024-token
# window, and a sliding layer's KV is capped at its window rather than growing
# with the sequence. So the growing part is 5 x 8 KV heads x 256 head dim x 2
# (K+V) x 2 B = 40 KiB/token, 10.0 GiB at the full context below, plus a fixed
# 0.2 GiB for the sliding layers. Roughly 28 GiB all-in.
#
# Notes specific to this model:
#
# - That 25:5 split is why the 26B is here and the dense 31B is not. The 31B
#   costs 160 KiB/token (10 full layers of 16 KV heads), needs 40.8 GiB of KV
#   at 256k and 81.5 GiB even at 128k, so it does not fit an 80 GB card in
#   bf16 at either length. Its KV exceeds its own weights past ~160k.
# - Gemma 4 does not use <think>/</think>. It emits a channel format,
#   <|channel>thought ... <channel|>, with tool calls as <|tool_call>call:.
#   Hence the gemma4 parsers below and not a deepseek_r1-style one.
# - Architecture is Gemma4ForConditionalGeneration, registered in vLLM 0.26
#   as gemma4_mm. It is multimodal.
#
# Verified on the A100 test host (sm_80): TRITON_ATTN selected by vLLM, bf16
# weights, utilization 0.98, 79,429 MiB in use, KV pool 1,868,129 tokens
# (7.13x a full-length sequence). Both parsers checked against live requests.
# Fastest decode of the five models measured there and the slowest long
# prefill, both consequences of TRITON_ATTN; figures in vllm/AGENTS.md.
#
# The only one of these models with prefix caching enabled, so a repeated
# benchmark measures cache hits rather than prefill -- see the pitfalls in
# AGENTS.md before trusting a second run's numbers.

VLLM_MODEL="${VLLM_MODEL:-cyankiwi/gemma-4-26B-A4B-it-AWQ-4bit}"
VLLM_MODEL_REVISION="${VLLM_MODEL_REVISION:-0ef577a5710035bd2d3a3f27e4f5cb2e86a9a9ba}"
VLLM_SERVED_NAME="${VLLM_SERVED_NAME:-gemma4-26b-a4b-awq}"

# The model's own max_position_embeddings, so no RoPE extrapolation beyond
# training. KV must hold one whole sequence of this length or vLLM refuses to
# start.
VLLM_MAX_LEN="${VLLM_MAX_LEN:-262144}"

# bf16 KV. The sliding-window majority keeps the cache small enough that fp8
# is unnecessary here, and asking for it would only restrict which hosts can
# serve this model (fp8 KV needs sm_89+).
VLLM_KV_DTYPE="${VLLM_KV_DTYPE:-auto}"

# Let vLLM pick the attention backend. Gemma 4 is multimodal and uses PrefixLM
# bidirectional attention over the image prefix, which only some backends
# implement, and the launcher's dense default is not one of them at this head
# size. Naming it aborts engine init rather than falling back:
#   ValueError: Selected backend AttentionBackendEnum.FLASH_ATTN is not valid
#   for this configuration. Reason: ['partial multimodal token full attention
#   not supported', 'mm_prefix (PrefixLM bidirectional attention) requires
#   FlashAttention v4, which does not resolve for this head_size']
# Unset, vLLM finds TRITON_ATTN, which supports mm_prefix unconditionally.
VLLM_ATTN_AUTO="${VLLM_ATTN_AUTO:-1}"

# Splits the model's thought channel out of the answer. Without it the raw
# <|channel>thought markers land in message.content.
#
# Thinking is off by default and the template's logic is inverted: when
# enable_thinking is false it *pre-fills* an empty closed thought block
# (<|channel>thought\n<channel|>) into the generation prompt, which suppresses
# reasoning rather than merely not asking for it. So message.reasoning stays
# empty and the model reasons inline in content unless a request opts in:
#
#   "chat_template_kwargs": {"enable_thinking": true}
#
# Verified both ways -- empty reasoning by default, 397 characters of it with
# the flag and a 15-character answer. The parser is therefore correct and
# necessary, not merely declared.
VLLM_REASONING_PARSER="${VLLM_REASONING_PARSER:-gemma4}"

# Matches the template's <|tool_call>call: emission so tool calls arrive as a
# structured tool_calls array.
VLLM_TOOL_PARSER="${VLLM_TOOL_PARSER:-gemma4}"

VLLM_CAP_REASONING="${VLLM_CAP_REASONING:-required}"
VLLM_CAP_TOOLS="${VLLM_CAP_TOOLS:-required}"
VLLM_CAP_REASONING_MODE="${VLLM_CAP_REASONING_MODE:-enable-thinking}"
VLLM_CAP_DISABLE_MODE="${VLLM_CAP_DISABLE_MODE:-enable-thinking-false}"
VLLM_CAP_SYSTEM_PROMPT="${VLLM_CAP_SYSTEM_PROMPT:-}"

# Regular attention (no recurrent state): the 0.27.1 engine default is
# APC on and the benchmarked state was measured that way. The explicit 1
# pins it across core bumps instead of trusting the default.
VLLM_PREFIX_CACHING="${VLLM_PREFIX_CACHING:-1}"
