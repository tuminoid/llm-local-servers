# vLLM server config for mimo-v2.6-9b-awq
#
# cyankiwi/MiMo-V2.6-Distill-Qwen-9B-AWQ-BF16-INT4: AWQ 4-bit
# (compressed-tensors W4A16, group 32, asymmetric; 9.0 GB) of
# XiaomiMiMo/MiMo-V2.6-Distill-Qwen-9B, calibrated on cyankiwi's STEM and
# agentic set. The model is Xiaomi's supervised fine-tune of Qwen3.5-9B on
# coding, agent and cybersecurity data (MIT). Only builds of these weights
# are in scope, never the Qwen3.5 base.
#
# A 32-layer Qwen3.5 hybrid: 8 full-attention layers (4 KV heads x 256) and
# 24 Gated DeltaNet layers, so bf16 KV is 32 KiB/token. It declares one MTP
# layer but ships no MTP weights. Qwen3_5ForConditionalGeneration; the
# launcher serves it text only.

VLLM_MODEL="${VLLM_MODEL:-cyankiwi/MiMo-V2.6-Distill-Qwen-9B-AWQ-BF16-INT4}"
VLLM_MODEL_REVISION="${VLLM_MODEL_REVISION:-09a55d0912c0652152ac24777f3688c408497b68}"
VLLM_SERVED_NAME="${VLLM_SERVED_NAME:-mimo-v2.6-9b-awq}"

# Native max_position_embeddings (nested under text_config).
VLLM_MAX_LEN="${VLLM_MAX_LEN:-262144}"
VLLM_KV_DTYPE="${VLLM_KV_DTYPE:-auto}"

# The upstream template prefills nothing when thinking is on (Qwen3.5
# prefills '<think>\n'), so enable_thinking true is a no-op and the model
# decides whether to reason. When it skips, it also writes tool arguments as
# JSON inside <function=...> instead of <parameter=...>, which qwen3_xml
# reads as {} (HF discussions #4, #6, #7 on the model repo). Measured
# 2026-09-25 on the A100, vLLM 0.30.0: Capability Check v1 4/8 on the stock
# template, 8/8 on the fixed one (twice). With the fixed template the BF16,
# INT8 and FP8 builds still close the opened block at once and write JSON
# arguments; the INT4 builds reason and write <parameter=...>. Retest when
# upstream fixes the template.
VLLM_CHAT_TEMPLATE="${VLLM_CHAT_TEMPLATE:-mimo-v2.6-chat-template.jinja}"

# Qwen3.5 dialect; vLLM's `mimo` parser names alias these classes.
VLLM_REASONING_PARSER="${VLLM_REASONING_PARSER:-qwen3}"
VLLM_TOOL_PARSER="${VLLM_TOOL_PARSER:-qwen3_xml}"

# With the fixed template an unset enable_thinking renders exactly as true
# (the mode the model card queries with), so thinking is the default.
VLLM_CAP_REASONING="${VLLM_CAP_REASONING:-required}"
VLLM_CAP_TOOLS="${VLLM_CAP_TOOLS:-required}"
VLLM_CAP_REASONING_MODE="${VLLM_CAP_REASONING_MODE:-default}"
VLLM_CAP_DISABLE_MODE="${VLLM_CAP_DISABLE_MODE:-enable-thinking-false}"
VLLM_CAP_SYSTEM_PROMPT="${VLLM_CAP_SYSTEM_PROMPT:-}"

# Align-mode APC on. The 2026-09-25 A100 hunt ran the conversation and
# replay profiles with it on the W4A16 and BF16 builds of these weights:
# compliant, 16/16 recall, ~0.89 cached, no late-turn runaway (the failure
# that pins qwen3.5-4b-awq to 0). The cold-vs-hit correctness gate passed on
# the vLLM-Metal build (2026-09-22) and is not rerun on CUDA.
VLLM_PREFIX_CACHING="${VLLM_PREFIX_CACHING:-1}"
